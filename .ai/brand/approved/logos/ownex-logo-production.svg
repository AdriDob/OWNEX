<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="valueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#3B82F6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle with gradient -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#valueGrad)" stroke-width="4" filter="url(#subtleGlow)"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="45" fill="#3B82F6" opacity="0.85"/>
  
  <!-- Cross elements (value integration) -->
  <path d="M100 55 L 100 145" stroke="#F59E0B" stroke-width="3" opacity="0.85"/>
  <path d="M55 100 L 145 100" stroke="#F59E0B" stroke-width="3" opacity="0.85"/>
  
  <!-- Center core -->
  <circle cx="100" cy="100" r="15" fill="#F59E0B" opacity="0.95"/>
  
  <!-- Outer accent dots -->
  <circle cx="100" cy="30" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="100" cy="170" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="30" cy="100" r="4" fill="#F59E0B" opacity="0.8"/>
  <circle cx="170" cy="100" r="4" fill="#F59E0B" opacity="0.8"/>
</svg>