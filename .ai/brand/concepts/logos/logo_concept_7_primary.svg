<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#3B82F6" stroke-width="3" opacity="0.8" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.3"/>
  <circle cx="100" cy="100" r="25" fill="#3B82F6" opacity="0.9"/>
  <circle cx="135" cy="65" r="6" fill="#F59E0B" opacity="0.9" filter="url(#glow)"/>
</svg>