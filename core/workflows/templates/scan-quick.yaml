name: "Escaneo Rápido"
description: "Escaneo básico de vulnerabilidades con nuclei"
steps:
  - id: nuclei_scan
    type: scan
    params:
      tool: nuclei
      targets: "{{ target }}"
      severity: [critical, high, medium]
      templates: [cves, exposures]
  - id: fuzz_params
    type: scan
    params:
      tool: ffuf
      targets: "{{ target }}"
      wordlist: common_params
  - id: validate_findings
    type: validate
    params:
      findings: ["{{ steps.nuclei_scan.result }}", "{{ steps.fuzz_params.result }}"]
