name: "Reporte Automático"
description: "Genera reporte a partir de findings confirmados"
steps:
  - id: collect_verified
    type: validate
    params:
      status: confirmed
  - id: generate_report
    type: report
    params:
      findings: ["{{ steps.collect_verified.result }}"]
      format: markdown
  - id: notify_platforms
    type: notify
    params:
      platforms: [hackerone, bugcrowd]
      report: "{{ steps.generate_report.result }}"
