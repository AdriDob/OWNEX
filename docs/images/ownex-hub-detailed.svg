<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="hubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0070d1;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0070d1;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="activeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#hubBg)" rx="16"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="760" height="50" fill="#0d1117" rx="12" stroke="#0070d1" stroke-width="2"/>
  <circle cx="50" cy="45" r="15" fill="#0070d1"/>
  <text x="75" y="52" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">OWNEX HUB — Mission Control</text>
  <circle cx="750" cy="45" r="8" fill="#00ff88"/>
  <text x="720" y="50" font-family="Arial" font-size="12" fill="#00ff88">ONLINE</text>
  
  <!-- Navigation Categories -->
  <text x="400" y="95" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#888">WORK CATEGORIES</text>
  
  <!-- Dev Bounty Card -->
  <rect x="30" y="110" width="220" height="120" fill="url(#cardGradient)" stroke="#0070d1" stroke-width="2" rx="12"/>
  <circle cx="60" cy="140" r="20" fill="#0070d1" opacity="0.4"/>
  <text x="60" y="148" text-anchor="middle" font-family="Arial" font-size="18" fill="#0070d1">{'<>'}</text>
  <text x="140" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">Dev Bounty</text>
  <text x="140" y="155" text-anchor="middle" font-family="Arial" font-size="11" fill="#0070d1">Open Source Contributions</text>
  <rect x="50" y="170" width="70" height="25" fill="#0070d1" opacity="0.3" rx="4"/>
  <text x="85" y="187" text-anchor="middle" font-family="Arial" font-size="10" fill="white">GitHub</text>
  <rect x="130" y="170" width="70" height="25" fill="#0070d1" opacity="0.3" rx="4"/>
  <text x="165" y="187" text-anchor="middle" font-family="Arial" font-size="10" fill="white">GitLab</text>
  <rect x="50" y="200" width="70" height="25" fill="#0070d1" opacity="0.3" rx="4"/>
  <text x="85" y="217" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Algora</text>
  <rect x="130" y="200" width="70" height="25" fill="#0070d1" opacity="0.3" rx="4"/>
  <text x="165" y="217" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Opire</text>
  
  <!-- Bug Bounty Card -->
  <rect x="270" y="110" width="220" height="120" fill="url(#cardGradient)" stroke="#00ff88" stroke-width="2" rx="12"/>
  <circle cx="300" cy="140" r="20" fill="#00ff88" opacity="0.4"/>
  <text x="300" y="148" text-anchor="middle" font-family="Arial" font-size="18" fill="#00ff88">🛡</text>
  <text x="380" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">Bug Bounty</text>
  <text x="380" y="155" text-anchor="middle" font-family="Arial" font-size="11" fill="#00ff88">Security Research</text>
  <rect x="290" y="170" width="70" height="25" fill="#00ff88" opacity="0.3" rx="4"/>
  <text x="325" y="187" text-anchor="middle" font-family="Arial" font-size="10" fill="white">HackerOne</text>
  <rect x="370" y="170" width="70" height="25" fill="#00ff88" opacity="0.3" rx="4"/>
  <text x="405" y="187" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Bugcrowd</text>
  <rect x="290" y="200" width="70" height="25" fill="#00ff88" opacity="0.3" rx="4"/>
  <text x="325" y="217" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Intigriti</text>
  <rect x="370" y="200" width="70" height="25" fill="#00ff88" opacity="0.3" rx="4"/>
  <text x="405" y="217" text-anchor="middle" font-family="Arial" font-size="10" fill="white">YesWeHack</text>
  
  <!-- Data Entry Card -->
  <rect x="510" y="110" width="220" height="120" fill="url(#cardGradient)" stroke="#ffd700" stroke-width="2" rx="12"/>
  <circle cx="540" cy="140" r="20" fill="#ffd700" opacity="0.4"/>
  <text x="540" y="148" text-anchor="middle" font-family="Arial" font-size="18" fill="#ffd700">📊</text>
  <text x="620" y="135" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">Entrada de Datos</text>
  <text x="620" y="155" text-anchor="middle" font-family="Arial" font-size="11" fill="#ffd700">AI Tasks & Labeling</text>
  <rect x="530" y="170" width="70" height="25" fill="#ffd700" opacity="0.3" rx="4"/>
  <text x="565" y="187" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Outlier</text>
  <rect x="610" y="170" width="70" height="25" fill="#ffd700" opacity="0.3" rx="4"/>
  <text x="645" y="187" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Mindrift</text>
  <rect x="530" y="200" width="70" height="25" fill="#ffd700" opacity="0.3" rx="4"/>
  <text x="565" y="217" text-anchor="middle" font-family="Arial" font-size="10" fill="white">DataAnno</text>
  <rect x="610" y="200" width="70" height="25" fill="#ffd700" opacity="0.3" rx="4"/>
  <text x="645" y="217" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Remotasks</text>
  
  <!-- Dashboard Metrics -->
  <text x="400" y="260" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#888">DASHBOARD METRICS</text>
  
  <!-- Throughput Widget -->
  <rect x="30" y="275" width="170" height="80" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="8"/>
  <text x="115" y="295" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#0070d1">THROUGHPUT</text>
  <text x="115" y="315" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">127</text>
  <text x="115" y="335" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">opportunities/day</text>
  
  <!-- Agent Fleet Widget -->
  <rect x="215" y="275" width="170" height="80" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="8"/>
  <text x="300" y="295" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#00ff88">AGENT FLEET</text>
  <text x="300" y="315" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">8/10</text>
  <text x="300" y="335" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">agents active</text>
  
  <!-- Revenue Widget -->
  <rect x="400" y="275" width="170" height="80" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="8"/>
  <text x="485" y="295" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffd700">REVENUE</text>
  <text x="485" y="315" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">$2,450</text>
  <text x="485" y="335" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">this week</text>
  
  <!-- XP Level Widget -->
  <rect x="585" y="275" width="170" height="80" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="8"/>
  <text x="670" y="295" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#0070d1">LEVEL</text>
  <text x="670" y="315" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">42</text>
  <text x="670" y="335" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">12,450 XP</text>
  
  <!-- Quick Actions -->
  <text x="400" y="380" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#888">QUICK ACTIONS</text>
  
  <rect x="30" y="395" width="120" height="40" fill="url(#activeGradient)" stroke="#00ff88" stroke-width="1" rx="8"/>
  <text x="90" y="420" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Sync Tasks</text>
  
  <rect x="160" y="395" width="120" height="40" fill="url(#cardGradient)" stroke="#0070d1" stroke-width="1" rx="8"/>
  <text x="220" y="420" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Run Scan</text>
  
  <rect x="290" y="395" width="120" height="40" fill="url(#cardGradient)" stroke="#0070d1" stroke-width="1" rx="8"/>
  <text x="350" y="420" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">New Report</text>
  
  <rect x="420" y="395" width="120" height="40" fill="url(#cardGradient)" stroke="#ffd700" stroke-width="1" rx="8"/>
  <text x="480" y="420" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Trade</text>
  
  <rect x="550" y="395" width="120" height="40" fill="url(#cardGradient)" stroke="#0070d1" stroke-width="1" rx="8"/>
  <text x="610" y="420" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Terminal</text>
  
  <rect x="680" y="395" width="90" height="40" fill="#0d1117" stroke="#888" stroke-width="1" rx="8"/>
  <text x="725" y="420" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#888">Settings</text>
  
  <!-- Command Palette Hint -->
  <rect x="30" y="455" width="740" height="30" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="6"/>
  <text x="50" y="475" font-family="Arial" font-size="11" fill="#0070d1">Press</text>
  <rect x="90" y="463" width="60" height="20" fill="#0070d1" opacity="0.3" rx="4"/>
  <text x="120" y="477" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Ctrl+K</text>
  <text x="160" y="475" font-family="Arial" font-size="11" fill="#888">to open Command Palette</text>
  <text x="600" y="475" font-family="Arial" font-size="11" fill="#00ff88">● System Healthy</text>
</svg>