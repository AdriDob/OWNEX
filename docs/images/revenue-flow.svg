<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="850" height="500">
  <defs>
    <linearGradient id="revenueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="detectGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0070d1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0070d1;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="reportGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="payoutGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="wealthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="850" height="500" fill="url(#revenueBg)" rx="16"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="810" height="45" fill="#0d1117" rx="10" stroke="#ffd700" stroke-width="2"/>
  <circle cx="50" cy="42" r="12" fill="#ffd700"/>
  <text x="70" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">REVENUE FLOW — From Detection to Wealth</text>
  <text x="750" y="48" font-family="Arial" font-size="12" fill="#ffd700">$12,450 this month</text>
  
  <!-- Pipeline Steps -->
  <text x="425" y="90" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#888">REVENUE PIPELINE</text>
  
  <!-- Step 1: Detection -->
  <rect x="30" y="105" width="180" height="90" fill="url(#detectGradient)" stroke="#0070d1" stroke-width="2" rx="12"/>
  <text x="120" y="125" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#0070d1">1. DETECTION</text>
  <rect x="45" y="140" width="70" height="25" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="4"/>
  <text x="80" y="157" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">Findings</text>
  <rect x="125" y="140" width="70" height="25" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="4"/>
  <text x="160" y="157" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">Vulnerabilities</text>
  <text x="120" y="180" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">127 findings detected</text>
  
  <!-- Arrow -->
  <path d="M210 150 L240 150" stroke="#0070d1" stroke-width="3"/>
  
  <!-- Step 2: Validation -->
  <rect x="240" y="105" width="180" height="90" fill="url(#detectGradient)" stroke="#0070d1" stroke-width="2" rx="12"/>
  <text x="330" y="125" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#0070d1">2. VALIDATION</text>
  <rect x="255" y="140" width="70" height="25" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="4"/>
  <text x="290" y="157" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">PoC Gen</text>
  <rect x="335" y="140" width="70" height="25" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="4"/>
  <text x="370" y="157" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">Evidence</text>
  <text x="330" y="180" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">89 validated (70%)</text>
  
  <!-- Arrow -->
  <path d="M420 150 L450 150" stroke="#0070d1" stroke-width="3"/>
  
  <!-- Step 3: Reporting -->
  <rect x="450" y="105" width="180" height="90" fill="url(#reportGradient)" stroke="#00ff88" stroke-width="2" rx="12"/>
  <text x="540" y="125" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#00ff88">3. REPORTING</text>
  <rect x="465" y="140" width="70" height="25" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="4"/>
  <text x="500" y="157" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">Format</text>
  <rect x="545" y="140" width="70" height="25" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="4"/>
  <text x="580" y="157" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">Submit</text>
  <text x="540" y="180" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">45 reports submitted</text>
  
  <!-- Arrow -->
  <path d="M630 150 L660 150" stroke="#00ff88" stroke-width="3"/>
  
  <!-- Step 4: Acceptance -->
  <rect x="660" y="105" width="160" height="90" fill="url(#reportGradient)" stroke="#00ff88" stroke-width="2" rx="12"/>
  <text x="740" y="125" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#00ff88">4. ACCEPTANCE</text>
  <rect x="675" y="140" width="70" height="25" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="4"/>
  <text x="710" y="157" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">Review</text>
  <rect x="755" y="140" width="55" height="25" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="4"/>
  <text x="782" y="157" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">Approve</text>
  <text x="740" y="180" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">38 accepted (84%)</text>
  
  <!-- Curved arrow down -->
  <path d="M740 195 Q740 250 425 250 Q110 250 110 295" stroke="#ffd700" stroke-width="3" stroke-dasharray="5" fill="none"/>
  
  <!-- Step 5: Payout -->
  <rect x="30" y="295" width="180" height="90" fill="url(#payoutGradient)" stroke="#ffd700" stroke-width="2" rx="12"/>
  <text x="120" y="315" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffd700">5. PAYOUT</text>
  <rect x="45" y="330" width="70" height="25" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="4"/>
  <text x="80" y="347" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">Platform</text>
  <rect x="125" y="330" width="70" height="25" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="4"/>
  <text x="160" y="347" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">Transfer</text>
  <text x="120" y="370" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">$12,450 received</text>
  
  <!-- Arrow -->
  <path d="M210 340 L240 340" stroke="#ffd700" stroke-width="3"/>
  
  <!-- Step 6: Conversion -->
  <rect x="240" y="295" width="180" height="90" fill="url(#payoutGradient)" stroke="#ffd700" stroke-width="2" rx="12"/>
  <text x="330" y="315" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffd700">6. CONVERSION</text>
  <rect x="255" y="330" width="70" height="25" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="4"/>
  <text x="290" y="347" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">USD→ARS</text>
  <rect x="335" y="330" width="70" height="25" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="4"/>
  <text x="370" y="347" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">USDT→ARS</text>
  <text x="330" y="370" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">$11.8M ARS @ $950</text>
  
  <!-- Arrow -->
  <path d="M420 340 L450 340" stroke="#ffd700" stroke-width="3"/>
  
  <!-- Step 7: Wealth -->
  <rect x="450" y="295" width="180" height="90" fill="url(#wealthGradient)" stroke="#ff6b6b" stroke-width="2" rx="12"/>
  <text x="540" y="315" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ff6b6b">7. WEALTH</text>
  <rect x="465" y="330" width="70" height="25" fill="#0d1117" stroke="#ff6b6b" stroke-width="1" rx="4"/>
  <text x="500" y="347" text-anchor="middle" font-family="Arial" font-size="9" fill="#ff6b6b">Invest</text>
  <rect x="545" y="330" width="70" height="25" fill="#0d1117" stroke="#ff6b6b" stroke-width="1" rx="4"/>
  <text x="580" y="347" text-anchor="middle" font-family="Arial" font-size="9" fill="#ff6b6b">Trade</text>
  <text x="540" y="370" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">Portfolio growth</text>
  
  <!-- Arrow -->
  <path d="M630 340 L660 340" stroke="#ff6b6b" stroke-width="3"/>
  
  <!-- Step 8: Reinvest -->
  <rect x="660" y="295" width="160" height="90" fill="url(#wealthGradient)" stroke="#ff6b6b" stroke-width="2" rx="12"/>
  <text x="740" y="315" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ff6b6b">8. REINVEST</text>
  <rect x="675" y="330" width="70" height="25" fill="#0d1117" stroke="#ff6b6b" stroke-width="1" rx="4"/>
  <text x="710" y="347" text-anchor="middle" font-family="Arial" font-size="9" fill="#ff6b6b">Infrastructure</text>
  <rect x="755" y="330" width="55" height="25" fill="#0d1117" stroke="#ff6b6b" stroke-width="1" rx="4"/>
  <text x="782" y="347" text-anchor="middle" font-family="Arial" font-size="9" fill="#ff6b6b">Growth</text>
  <text x="740" y="370" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">Scale operations</text>
  
  <!-- Revenue Stats -->
  <text x="425" y="420" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#888">REVENUE INTELLIGENCE</text>
  
  <!-- Stat 1 -->
  <rect x="30" y="435" width="150" height="40" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="6"/>
  <text x="105" y="450" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">USD/HOUR</text>
  <text x="105" y="468" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">$47.50</text>
  
  <!-- Stat 2 -->
  <rect x="190" y="435" width="150" height="40" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="6"/>
  <text x="265" y="450" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">ACCEPTANCE RATE</text>
  <text x="265" y="468" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">84%</text>
  
  <!-- Stat 3 -->
  <rect x="350" y="435" width="150" height="40" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="6"/>
  <text x="425" y="450" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">AVG PAYOUT</text>
  <text x="425" y="468" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">$328</text>
  
  <!-- Stat 4 -->
  <rect x="510" y="435" width="150" height="40" fill="#0d1117" stroke="#ff6b6b" stroke-width="1" rx="6"/>
  <text x="585" y="450" text-anchor="middle" font-family="Arial" font-size="9" fill="#ff6b6b">TIME TO PAYOUT</text>
  <text x="585" y="468" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">14 days</text>
  
  <!-- Stat 5 -->
  <rect x="670" y="435" width="150" height="40" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="6"/>
  <text x="745" y="450" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">GROWTH RATE</text>
  <text x="745" y="468" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">+23%</text>
</svg>