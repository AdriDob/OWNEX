  <text x="115" y="515" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#0070d1">MODEL ROUTER</text>
  <text x="115" y="535" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">Ollama • FCC • OpenCode</text>
  <text x="115" y="550" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">OmniRoute • Failover</text>
  <text x="115" y="565" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">● Active</text>
  
  <!-- Support 2 -->
  <rect x="210" y="495" width="170" height="80" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="8"/>
  <text x="295" y="515" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#00ff88">EVENT BUS</text>
  <text x="295" y="535" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">Real-time events</text>
  <text x="295" y="550" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">Pub/Sub pattern</text>
  <text x="295" y="565" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">● 14 publishers</text>
  
  <!-- Support 3 -->
  <rect x="390" y="495" width="170" height="80" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="8"/>
  <text x="475" y="515" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#ffd700">KNOWLEDGE GRAPH</text>
  <text x="475" y="535" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">Structured memory</text>
  <text x="475" y="550" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">Entity relationships</text>
  <text x="475" y="565" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">● 2.3M nodes</text>
  
  <!-- Support 4 -->
  <rect x="570" y="495" width="170" height="80" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="8"/>
  <text x="655" y="515" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#0070d1">CREDENTIALS VAULT</text>
  <text x="655" y="535" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">Fernet encryption</text>
  <text x="655" y="550" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">Audit trail 1000+</text>
  <text x="655" y="565" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">● Secure</text>
  
  <!-- Support 5 -->
  <rect x="750" y="495" width="120" height="80" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="8"/>
  <text x="810" y="515" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#00ff88">SCHEDULER</text>
  <text x="810" y="535" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">23 jobs</text>
  <text x="810" y="550" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">4 cycles</text>
  <text x="810" y="565" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">● Running</text>
  
  <!-- Center Info -->
  <rect x="320" y="330" width="260" height="120" fill="#0d1117" stroke="#888" stroke-width="1" rx="12"/>
  <text x="450" y="355" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">WORKFLOW STATS</text>
  <text x="450" y="380" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">Avg Cycle Time: 2.5 hours</text>
  <text x="450" y="400" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">Success Rate: 87%</text>
  <text x="450" y="420" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">Autonomy Level: 92%</text>
  <text x="450" y="440" text-anchor="middle" font-family="Arial" font-size="10" fill="#00ff88">● 24/7 Operation</text>
</svg>