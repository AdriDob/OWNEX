<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="700" height="350">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="uiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0070d1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0070d1;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="backendGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="350" fill="url(#archBg)" rx="16"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="660" height="35" fill="#0d1117" rx="8" stroke="#0070d1" stroke-width="1" opacity="0.5"/>
  <circle cx="40" cy="37" r="10" fill="#0070d1"/>
  <text x="58" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">OWNEX OMEGA — Architecture Overview</text>
  
  <!-- Layer 1: Frontend (Top) -->
  <rect x="25" y="70" width="650" height="80" fill="url(#uiGradient)" stroke="#0070d1" stroke-width="2" rx="12"/>
  <text x="350" y="90" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">LAYER 1: FRONTEND (Vue 3 + TypeScript)</text>
  
  <!-- Frontend Components -->
  <rect x="40" y="100" width="100" height="40" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="6"/>
  <text x="90" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#0070d1">Mission Control</text>
  
  <rect x="150" y="100" width="100" height="40" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="6"/>
  <text x="200" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#0070d1">Task Hub</text>
  
  <rect x="260" y="100" width="100" height="40" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="6"/>
  <text x="310" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#0070d1">Security Cycle</text>
  
  <rect x="370" y="100" width="100" height="40" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="6"/>
  <text x="420" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#0070d1">Capital Dashboard</text>
  
  <rect x="480" y="100" width="100" height="40" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="6"/>
  <text x="530" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#0070d1">Trading View</text>
  
  <rect x="590" y="100" width="75" height="40" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="6"/>
  <text x="627" y="125" text-anchor="middle" font-family="Arial" font-size="10" fill="#0070d1">Terminal</text>
  
  <!-- Arrow down -->
  <path d="M350 150 L350 170" stroke="#0070d1" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Layer 2: Backend (Middle) -->
  <rect x="25" y="175" width="650" height="80" fill="url(#backendGradient)" stroke="#00ff88" stroke-width="2" rx="12"/>
  <text x="350" y="195" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">LAYER 2: BACKEND (Python + FastAPI)</text>
  
  <!-- Backend Components -->
  <rect x="40" y="205" width="120" height="40" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="6"/>
  <text x="100" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#00ff88">API Routers</text>
  
  <rect x="170" y="205" width="120" height="40" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="6"/>
  <text x="230" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#00ff88">Work Cycles</text>
  
  <rect x="300" y="205" width="120" height="40" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="6"/>
  <text x="360" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#00ff88">Opportunity Engine</text>
  
  <rect x="430" y="205" width="120" height="40" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="6"/>
  <text x="490" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#00ff88">Credentials Vault</text>
  
  <rect x="560" y="205" width="100" height="40" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="6"/>
  <text x="610" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#00ff88">Scheduler</text>
  
  <!-- Arrow down -->
  <path d="M350 255 L350 275" stroke="#00ff88" stroke-width="2"/>
  
  <!-- Layer 3: AI/Infrastructure (Bottom) -->
  <rect x="25" y="280" width="650" height="60" fill="url(#aiGradient)" stroke="#ffd700" stroke-width="2" rx="12"/>
  <text x="350" y="300" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">LAYER 3: AI & INFRASTRUCTURE</text>
  
  <!-- AI Components -->
  <rect x="40" y="310" width="100" height="25" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="4"/>
  <text x="90" y="327" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">ModelRouter</text>
  
  <rect x="150" y="310" width="100" height="25" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="4"/>
  <text x="200" y="327" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">EventBus</text>
  
  <rect x="260" y="310" width="100" height="25" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="4"/>
  <text x="310" y="327" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">Knowledge Graph</text>
  
  <rect x="370" y="310" width="100" height="25" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="4"/>
  <text x="420" y="327" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">Self-Improvement</text>
  
  <rect x="480" y="310" width="100" height="25" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="4"/>
  <text x="530" y="327" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">SQLite/PostgreSQL</text>
  
  <rect x="590" y="310" width="70" height="25" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="4"/>
  <text x="625" y="327" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">Tauri v2</text>
</svg>