<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="platformBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="devGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0070d1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0070d1;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="bugGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="hubGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0070d1;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="500" fill="url(#platformBg)" rx="16"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="860" height="40" fill="#0d1117" rx="10" stroke="#0070d1" stroke-width="2"/>
  <circle cx="50" cy="40" r="10" fill="#0070d1"/>
  <text x="70" y="46" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white">PLATFORM INTEGRATION — Unified Task Hub</text>
  
  <!-- Central Hub -->
  <rect x="350" y="220" width="200" height="100" fill="url(#hubGradient)" stroke="#0070d1" stroke-width="3" rx="12"/>
  <text x="450" y="250" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">TASK HUB</text>
  <text x="450" y="270" text-anchor="middle" font-family="Arial" font-size="11" fill="#00ff88">Unified Management</text>
  <text x="450" y="290" text-anchor="middle" font-family="Arial" font-size="10" fill="#888">Sync • Prioritize • Execute</text>
  <text x="450" y="310" text-anchor="middle" font-family="Arial" font-size="10" fill="#0070d1">12 Connected Platforms</text>
  
  <!-- Dev Bounty Platforms (Left) -->
  <text x="150" y="90" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#0070d1">DEV BOUNTY</text>
  
  <rect x="30" y="100" width="120" height="50" fill="url(#devGradient)" stroke="#0070d1" stroke-width="1" rx="8"/>
  <text x="90" y="120" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">GitHub</text>
  <text x="90" y="135" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">Issues • PRs</text>
  <text x="90" y="145" text-anchor="middle" font-family="Arial" font-size="8" fill="#00ff88">● Connected</text>
  
  <rect x="160" y="100" width="120" height="50" fill="url(#devGradient)" stroke="#0070d1" stroke-width="1" rx="8"/>
  <text x="220" y="120" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Algora</text>
  <text x="220" y="135" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">Bounties</text>
  <text x="220" y="145" text-anchor="middle" font-family="Arial" font-size="8" fill="#00ff88">● Connected</text>
  
  <rect x="30" y="160" width="120" height="50" fill="url(#devGradient)" stroke="#0070d1" stroke-width="1" rx="8"/>
  <text x="90" y="180" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Opire</text>
  <text x="90" y="195" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">Claim • Submit</text>
  <text x="90" y="205" text-anchor="middle" font-family="Arial" font-size="8" fill="#00ff88">● Connected</text>
  
  <rect x="160" y="160" width="120" height="50" fill="url(#devGradient)" stroke="#0070d1" stroke-width="1" rx="8"/>
  <text x="220" y="180" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">IssueHunt</text>
  <text x="220" y="195" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">PR Bounties</text>
  <text x="220" y="205" text-anchor="middle" font-family="Arial" font-size="8" fill="#00ff88">● Connected</text>
  
  <!-- Bug Bounty Platforms (Right) -->
  <text x="750" y="90" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#00ff88">BUG BOUNTY</text>
  
  <rect x="620" y="100" width="120" height="50" fill="url(#bugGradient)" stroke="#00ff88" stroke-width="1" rx="8"/>
  <text x="680" y="120" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">HackerOne</text>
  <text x="680" y="135" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">Programs</text>
  <text x="680" y="145" text-anchor="middle" font-family="Arial" font-size="8" fill="#00ff88">● Connected</text>
  
  <rect x="750" y="100" width="120" height="50" fill="url(#bugGradient)" stroke="#00ff88" stroke-width="1" rx="8"/>
  <text x="810" y="120" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Bugcrowd</text>
  <text x="810" y="135" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">Targets</text>
  <text x="810" y="145" text-anchor="middle" font-family="Arial" font-size="8" fill="#00ff88">● Connected</text>
  
  <rect x="620" y="160" width="120" height="50" fill="url(#bugGradient)" stroke="#00ff88" stroke-width="1" rx="8"/>
  <text x="680" y="180" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Intigriti</text>
  <text x="680" y="195" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">Programs</text>
  <text x="680" y="205" text-anchor="middle" font-family="Arial" font-size="8" fill="#00ff88">● Connected</text>
  
  <rect x="750" y="160" width="120" height="50" fill="url(#bugGradient)" stroke="#00ff88" stroke-width="1" rx="8"/>
  <text x="810" y="180" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">YesWeHack</text>
  <text x="810" y="195" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">Targets</text>
  <text x="810" y="205" text-anchor="middle" font-family="Arial" font-size="8" fill="#00ff88">● Connected</text>
  
  <!-- Data Entry Platforms (Bottom) -->
  <text x="450" y="380" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffd700">DATA ENTRY</text>
  
  <rect x="180" y="390" width="120" height="50" fill="url(#dataGradient)" stroke="#ffd700" stroke-width="1" rx="8"/>
  <text x="240" y="410" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Outlier</text>
  <text x="240" y="425" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">AI Tasks</text>
  <text x="240" y="435" text-anchor="middle" font-family="Arial" font-size="8" fill="#00ff88">● Connected</text>
  
  <rect x="310" y="390" width="120" height="50" fill="url(#dataGradient)" stroke="#ffd700" stroke-width="1" rx="8"/>
  <text x="370" y="410" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Mindrift</text>
  <text x="370" y="425" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">Browser Tasks</text>
  <text x="370" y="435" text-anchor="middle" font-family="Arial" font-size="8" fill="#00ff88">● Connected</text>
  
  <rect x="440" y="390" width="120" height="50" fill="url(#dataGradient)" stroke="#ffd700" stroke-width="1" rx="8"/>
  <text x="500" y="410" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">DataAnnotation</text>
  <text x="500" y="425" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">Labeling</text>
  <text x="500" y="435" text-anchor="middle" font-family="Arial" font-size="8" fill="#00ff88">● Connected</text>
  
  <rect x="570" y="390" width="120" height="50" fill="url(#dataGradient)" stroke="#ffd700" stroke-width="1" rx="8"/>
  <text x="630" y="410" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Remotasks</text>
  <text x="630" y="425" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">Microtasks</text>
  <text x="630" y="435" text-anchor="middle" font-family="Arial" font-size="8" fill="#00ff88">● Connected</text>
  
  <!-- Connection Lines -->
  <!-- Dev to Hub -->
  <path d="M140 210 L140 250 L350 250" stroke="#0070d1" stroke-width="2" stroke-dasharray="4"/>
  <path d="M270 210 L270 250 L350 250" stroke="#0070d1" stroke-width="2" stroke-dasharray="4"/>
  
  <!-- Bug to Hub -->
  <path d="M630 210 L630 250 L550 250" stroke="#00ff88" stroke-width="2" stroke-dasharray="4"/>
  <path d="M760 210 L760 250 L550 250" stroke="#00ff88" stroke-width="2" stroke-dasharray="4"/>
  
  <!-- Data to Hub -->
  <path d="M240 390 L240 350 L380 320" stroke="#ffd700" stroke-width="2" stroke-dasharray="4"/>
  <path d="M370 390 L370 350 L420 320" stroke="#ffd700" stroke-width="2" stroke-dasharray="4"/>
  <path d="M500 390 L500 350 L480 320" stroke="#ffd700" stroke-width="2" stroke-dasharray="4"/>
  <path d="M630 390 L630 350 L520 320" stroke="#ffd700" stroke-width="2" stroke-dasharray="4"/>
  
  <!-- Stats -->
  <rect x="30" y="230" width="140" height="40" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="6"/>
  <text x="100" y="245" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">DEV PLATFORMS</text>
  <text x="100" y="260" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">4</text>
  
  <rect x="730" y="230" width="140" height="40" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="6"/>
  <text x="800" y="245" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">BUG PLATFORMS</text>
  <text x="800" y="260" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">4</text>
  
  <rect x="385" y="460" width="130" height="30" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="6"/>
  <text x="450" y="475" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">DATA PLATFORMS</text>
  <text x="450" y="490" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">4</text>
</svg>