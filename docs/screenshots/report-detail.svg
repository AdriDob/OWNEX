  <rect x="36" y="400" width="356" height="52" rx="6" fill="rgba(255,255,255,0.02)"/>
  <text x="48" y="420" fill="#e0f0e0" font-size="10" font-weight="bold">RCE en /upload</text>
  <text x="48" y="436" fill="rgba(255,255,255,0.3)" font-size="9">starbucks.com — #RP-1020</text>
