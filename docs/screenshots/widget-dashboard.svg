    <line x1="295" y1="284" x2="277" y2="273" stroke="#a855f7" stroke-width="0.5" opacity="0.5"/>
    <line x1="319" y1="284" x2="333" y2="275" stroke="#a855f7" stroke-width="0.5" opacity="0.5"/>
