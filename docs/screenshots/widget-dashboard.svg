<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Courier New', monospace">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>
    <linearGradient id="scoreGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#00ff41" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff41" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="revenueGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a14"/>

  <!-- Retro grid background -->
  <g opacity="0.05" stroke="#a855f7" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="48" fill="#0d1117" stroke="#333" stroke-width="0.5" stroke-opacity="0.5"/>
  <text x="20" y="20" fill="#a855f7" font-size="12" font-weight="bold" filter="url(#glow)">ORION</text>
  <text x="70" y="20" fill="#888" font-size="10">Mission Control</text>

  <!-- Nav tabs -->
  <g font-size="9" fill="#666">
    <text x="300" y="20" fill="#00ffff">Dashboard</text>
    <text x="380" y="20">Pipeline</text>
    <text x="450" y="20">Targets</text>
    <text x="510" y="20">Reports</text>
    <text x="570" y="20">Settings</text>
