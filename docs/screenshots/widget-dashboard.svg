  <circle cx="760" cy="17" r="8" fill="#1a1a2e" stroke="#a855f7" stroke-width="1"/>
  <text x="760" y="21" text-anchor="middle" fill="#a855f7" font-size="8">A</text>

  <!-- Edit mode toggle -->
