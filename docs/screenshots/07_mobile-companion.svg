  <text x="420" y="180" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Biometric auth • Push notifications • Offline-first cache</text>
  
  <rect x="400" y="215" width="660" height="80" rx="8" fill="rgba(6,78,59,0.3)" stroke="#34d399"/>
  <text x="420" y="240" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">WEBSOCKET SYNC</text>
  <text x="420" y="260" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Real-time status updates • Approval requests push to device</text>
  <text x="420" y="275" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Auto-reconnect • Battery-efficient heartbeat</text>
  
  <rect x="400" y="310" width="660" height="80" rx="8" fill="rgba(76,29,149,0.2)" stroke="#a78bfa"/>
  <text x="420" y="335" fill="#a78bfa" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">NOTIFICATION HUB</text>
  <text x="420" y="355" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Critical findings • Approvals • Errors • Rate limits</text>
  <text x="420" y="370" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Priority-based filtering • Quiet hours</text>
  
