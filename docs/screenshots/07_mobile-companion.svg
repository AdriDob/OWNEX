  <text x="400" y="570" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="10">Biometric unlock • Session management</text>
  <text x="400" y="590" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="10">Settings sync • Offline mode for viewing</text>
  
