<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ce-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" rx="24"/>

  <!-- Outer ring -->
  <circle cx="200" cy="180" r="120" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.3"/>
  <circle cx="200" cy="180" r="100" fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.15"/>

  <!-- Orbital dots -->
  <circle cx="200" cy="60" r="3" fill="#a855f7" opacity="0.6"/>
  <circle cx="320" cy="180" r="3" fill="#00ffff" opacity="0.6"/>
  <circle cx="200" cy="300" r="3" fill="#a855f7" opacity="0.6"/>
  <circle cx="80" cy="180" r="3" fill="#00ffff" opacity="0.6"/>

  <!-- CATEYE "CE" logo mark -->
  <g filter="url(#glow)">
    <!-- C letter -->
    <path d="M170 140 Q170 120 190 120 L210 120 M170 140 L170 220 Q170 240 190 240 L210 240"
          fill="none" stroke="url(#ce-grad)" stroke-width="8" stroke-linecap="round"/>
    <!-- E letter -->
    <path d="M230 120 L260 120 M230 120 L230 240 M230 180 L255 180 M230 240 L260 240"
          fill="none" stroke="url(#ce-grad)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Small eye dot in center of CE -->
  <circle cx="200" cy="180" r="4" fill="#00ffff" opacity="0.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- ORION text -->
  <text x="200" y="340" text-anchor="middle" fill="#a855f7" font-family="'Courier New', monospace" font-size="14" letter-spacing="8" opacity="0.6">ORION</text>

  <!-- Tagline -->
  <text x="200" y="365" text-anchor="middle" fill="#6b6b80" font-family="'Courier New', monospace" font-size="8" letter-spacing="3">PRIVATE INTELLIGENCE OS</text>
</svg>