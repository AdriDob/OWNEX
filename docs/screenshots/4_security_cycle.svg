  <text x="335" y="178" text-anchor="middle" fill="#64748b" font-size="10">Vuln Detection</text>
  <text x="335" y="195" text-anchor="middle" fill="#64748b" font-size="10">Severity Scoring</text>
  <text x="335" y="212" text-anchor="middle" fill="#64748b" font-size="10">CVSS Mapping</text>
  <text x="335" y="232" text-anchor="middle" fill="#64748b" font-size="9">nuclei · custom</text>

  <line x1="420" y1="200" x2="445" y2="200" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 3: Exploit -->
  <rect x="450" y="130" width="170" height="140" rx="10" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="535" y="158" text-anchor="middle" fill="#fb7185" font-size="12" font-weight="bold">⚡ Exploit</text>
  <text x="535" y="178" text-anchor="middle" fill="#64748b" font-size="10">PoC Development</text>
  <text x="535" y="195" text-anchor="middle" fill="#64748b" font-size="10">Impact Analysis</text>
  <text x="535" y="212" text-anchor="middle" fill="#64748b" font-size="10">Chain Vulns</text>
  <text x="535" y="232" text-anchor="middle" fill="#64748b" font-size="9">custom scripts</text>

  <line x1="620" y1="200" x2="645" y2="200" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 4: Validate -->
  <rect x="650" y="130" width="170" height="140" rx="10" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="735" y="158" text-anchor="middle" fill="#fb7185" font-size="12" font-weight="bold">✅ Validate</text>
  <text x="735" y="178" text-anchor="middle" fill="#64748b" font-size="10">Evidence Gathering</text>
  <text x="735" y="195" text-anchor="middle" fill="#64748b" font-size="10">Reproduce Steps</text>
  <text x="735" y="212" text-anchor="middle" fill="#64748b" font-size="10">Screenshot Capture</text>
  <text x="735" y="232" text-anchor="middle" fill="#64748b" font-size="9">vision_gateway</text>

  <line x1="820" y1="200" x2="845" y2="200" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 5: Submit -->
  <rect x="850" y="130" width="195" height="140" rx="10" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="1.5"/>
