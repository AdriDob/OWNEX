  <text x="50" y="375" fill="#64748b" font-size="11">Targets scanned:</text>
  <text x="250" y="375" text-anchor="end" fill="#22d3ee" font-size="11">12</text>
  <text x="50" y="395" fill="#64748b" font-size="11">Vulnerabilities found:</text>
  <text x="250" y="395" text-anchor="end" fill="#fbbf24" font-size="11">7</text>
  <text x="50" y="415" fill="#64748b" font-size="11">Validated (P4-P1):</text>
  <text x="250" y="415" text-anchor="end" fill="#fb7185" font-size="11">3</text>
  <text x="50" y="435" fill="#64748b" font-size="11">Reports submitted:</text>
  <text x="250" y="435" text-anchor="end" fill="#34d399" font-size="11">2</text>

