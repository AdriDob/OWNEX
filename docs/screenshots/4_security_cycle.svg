  <text x="410" y="350" fill="#e2e8f0" font-size="13" font-weight="bold">🔬 Recent Findings</text>
  <text x="410" y="375" fill="#fb7185" font-size="11">●</text>
  <text x="428" y="375" fill="#e2e8f0" font-size="11">SQL Injection — login.php</text>
  <text x="710" y="375" text-anchor="end" fill="#fb7185" font-size="11">Critical</text>
  <text x="410" y="395" fill="#fbbf24" font-size="11">●</text>
  <text x="428" y="395" fill="#e2e8f0" font-size="11">XSS — profile endpoint</text>
  <text x="710" y="395" text-anchor="end" fill="#fbbf24" font-size="11">Medium</text>
  <text x="410" y="415" fill="#fbbf24" font-size="11">●</text>
  <text x="428" y="415" fill="#e2e8f0" font-size="11">IDOR — /api/users/:id</text>
  <text x="710" y="415" text-anchor="end" fill="#fbbf24" font-size="11">Medium</text>
  <text x="410" y="435" fill="#34d399" font-size="11">●</text>
  <text x="428" y="435" fill="#e2e8f0" font-size="11">Open Redirect — /r?url=</text>
  <text x="710" y="435" text-anchor="end" fill="#34d399" font-size="11">Low</text>

  <rect x="750" y="320" width="320" height="130" rx="10" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>
  <text x="770" y="350" fill="#e2e8f0" font-size="13" font-weight="bold">📈 Revenue Impact</text>
  <text x="770" y="380" fill="#64748b" font-size="11">Current month:</text>
  <text x="1050" y="380" text-anchor="end" fill="#34d399" font-size="11" font-weight="bold">$3,420</text>
  <text x="770" y="405" fill="#64748b" font-size="11">From security findings:</text>
  <text x="1050" y="405" text-anchor="end" fill="#34d399" font-size="11">$1,250</text>
  <text x="770" y="430" fill="#64748b" font-size="11">Acceptance rate:</text>
  <text x="1050" y="430" text-anchor="end" fill="#34d399" font-size="11">72%</text>

  <!-- Tools bar -->
  <rect x="30" y="470" width="1040" height="40" rx="8" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="495" fill="#64748b" font-size="11">Tools: amass · nmap · nuclei · httpx · subfinder · whatweb · sqlmap · custom scripts · AI agent</text>

  <rect x="30" y="525" width="1040" height="40" rx="8" fill="rgba(52,211,153,0.05)" stroke="#34d399" stroke-width="1"/>
  <text x="550" y="550" text-anchor="middle" fill="#34d399" font-size="12">🟢 Security pipeline operational · 24/7 autonomous scanning · No manual intervention needed</text>
</svg>
