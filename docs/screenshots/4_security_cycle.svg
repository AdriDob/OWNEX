  <text x="135" y="178" text-anchor="middle" fill="#64748b" font-size="10">Subdomain Enum</text>
  <text x="135" y="195" text-anchor="middle" fill="#64748b" font-size="10">Port Scanning</text>
  <text x="135" y="212" text-anchor="middle" fill="#64748b" font-size="10">Tech Fingerprint</text>
  <text x="135" y="232" text-anchor="middle" fill="#64748b" font-size="9">amass · nmap · whatweb</text>

  <line x1="220" y1="200" x2="245" y2="200" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 2: Analysis -->
  <rect x="250" y="130" width="170" height="140" rx="10" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1.5"/>
