  <text x="947" y="195" text-anchor="middle" fill="#64748b" font-size="10">VRT Classification</text>
  <text x="947" y="212" text-anchor="middle" fill="#64748b" font-size="10">Auto Submit</text>
  <text x="947" y="232" text-anchor="middle" fill="#64748b" font-size="9">HackerOne · Bugcrowd</text>

