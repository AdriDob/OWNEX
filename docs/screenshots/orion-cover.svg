<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#FFCC66"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF41"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round12"><rect width="1280" height="800" rx="12"/></clipPath>
    
  </defs>
  <rect width="1280" height="800" fill="#050508"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6D28D9" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="1280" height="800" fill="url(#grid)" opacity="0.4"/>
  <defs>
    <radialGradient id="coverGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="800" fill="#050508"/>
  <rect width="1280" height="800" fill="url(#coverGlow)"/>
  <pattern id="cgrid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6D28D9" stroke-width="0.3" opacity="0.12"/>
  </pattern>
  <rect width="1280" height="800" fill="url(#cgrid)"/>
  <g transform="translate(540, 80)">
    <circle cx="100" cy="100" r="80" fill="#A855F7" opacity="0.08"/>
    <ellipse cx="100" cy="100" rx="120" ry="40" fill="none" stroke="#6D28D9" stroke-width="1" transform="rotate(-25 100 100)" opacity="0.4"/>
    <ellipse cx="100" cy="100" rx="95" ry="32" fill="none" stroke="#8B5CF6" stroke-width="1.5" transform="rotate(20 100 100)" opacity="0.6"/>
    <ellipse cx="100" cy="100" rx="70" ry="24" fill="none" stroke="#A855F7" stroke-width="2.5" transform="rotate(-10 100 100)" filter="url(#glow)"/>
    <circle cx="40" cy="82" r="2" fill="#00FF41" opacity="0.8"/>
    <circle cx="160" cy="118" r="2" fill="#00FF41" opacity="0.6"/>
    <circle cx="65" cy="118" r="1.5" fill="#F5A623" opacity="0.7"/>
    <path d="M 100 100 L 180 50 A 110 110 0 0 1 195 90 Z" fill="#F5A623" opacity="0.08"/>
    <circle cx="100" cy="100" r="14" fill="#A855F7" filter="url(#glowStrong)"/>
    <circle cx="100" cy="100" r="5" fill="#FFF" opacity="0.9"/>
  </g>
  <text x="640" y="330" font-family="'Orbitron', sans-serif" font-size="72" font-weight="900" fill="#A855F7" letter-spacing="12">ORION</text>  <text x="640" y="365" font-family="'Orbitron', sans-serif" font-size="16" font-weight="400" fill="#8B5CF6" letter-spacing="8" opacity="0.7">SECURITY INTELLIGENCE OS</text>  <line x1="440" y1="385" x2="840" y2="385" stroke="#F5A623" stroke-width="1" opacity="0.3"/>  <text x="640" y="410" font-family="'JetBrains Mono', sans-serif" font-size="12" font-weight="400" fill="#64748B" letter-spacing="2">v4.7.0  |  STABLE</text>  <rect x="60" y="460" width="150" height="70" rx="8" fill="#121218" stroke="#A855F7" stroke-width="1"/>  <text x="135" y="486" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#A855F7" letter-spacing="1">AEGIS</text>  <text x="135" y="506" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#64748B">Security Layer</text>  <rect x="230" y="460" width="150" height="70" rx="8" fill="#121218" stroke="#FF1744" stroke-width="1"/>  <text x="305" y="486" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#FF1744" letter-spacing="1">CATEYE</text>  <text x="305" y="506" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#64748B">Bug Bounty Intel</text>  <rect x="400" y="460" width="150" height="70" rx="8" fill="#121218" stroke="#00FF41" stroke-width="1"/>  <text x="475" y="486" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#00FF41" letter-spacing="1">ATLAS</text>  <text x="475" y="506" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#64748B">Recon & Discovery</text>  <rect x="570" y="460" width="150" height="70" rx="8" fill="#121218" stroke="#F5A623" stroke-width="1"/>  <text x="645" y="486" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#F5A623" letter-spacing="1">ODYSSEY</text>  <text x="645" y="506" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#64748B">Revenue Intelligence</text>  <rect x="740" y="460" width="150" height="70" rx="8" fill="#121218" stroke="#8B5CF6" stroke-width="1"/>  <text x="815" y="486" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#8B5CF6" letter-spacing="1">MERLIN</text>  <text x="815" y="506" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#64748B">Automation</text>  <rect x="910" y="460" width="150" height="70" rx="8" fill="#121218" stroke="#00FFFF" stroke-width="1"/>  <text x="985" y="486" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#00FFFF" letter-spacing="1">COPILOT</text>  <text x="985" y="506" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#64748B">AI Assistant</text>  <rect x="1080" y="460" width="150" height="70" rx="8" fill="#121218" stroke="#FF6600" stroke-width="1"/>  <text x="1155" y="486" font-family="'Orbitron', sans-serif" font-size="13" font-weight="700" fill="#FF6600" letter-spacing="1">REVENUE</text>  <text x="1155" y="506" font-family="'Inter', sans-serif" font-size="9" font-weight="400" fill="#64748B">Economic Engine</text>  <rect x="240" y="560" width="800" height="80" rx="12" fill="rgba(12,12,18,0.92)" stroke="#6D28D9" stroke-width="0.5" opacity="0.9"/>
  <rect x="240" y="560" width="800" height="1" fill="#A855F7" opacity="0.15"/>  <text x="256" y="582" font-family="'Orbitron', sans-serif" font-size="10" font-weight="600" fill="#A855F7" letter-spacing="2">SYSTEM STATUS</text>  <circle cx="270" cy="610" r="4" fill="#00FF41" filter="url(#glow)"/>  <text x="282" y="614" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#E2E8F0">Backend</text>  <circle cx="390" cy="610" r="4" fill="#00FF41" filter="url(#glow)"/>  <text x="402" y="614" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#E2E8F0">EventBus</text>  <circle cx="510" cy="610" r="4" fill="#00FF41" filter="url(#glow)"/>  <text x="522" y="614" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#E2E8F0">Scheduler</text>  <circle cx="630" cy="610" r="4" fill="#00FF41" filter="url(#glow)"/>  <text x="642" y="614" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#E2E8F0">Agents</text>  <circle cx="750" cy="610" r="4" fill="#00FF41" filter="url(#glow)"/>  <text x="762" y="614" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#E2E8F0">Database</text>  <circle cx="870" cy="610" r="4" fill="#00FF41" filter="url(#glow)"/>  <text x="882" y="614" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#E2E8F0">355 Tests</text>  <text x="640" y="680" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#64748B" letter-spacing="2">Modular Monolith  |  Event-Driven  |  AI-Powered  |  100% Local</text>  <text x="640" y="710" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#8B5CF6" letter-spacing="1" opacity="0.6">Built for Bug Bounty Hunters  |  by CATEYE</text>  <line x1="20" y1="20" x2="80" y2="20" stroke="#A855F7" stroke-width="1" opacity="0.3"/>
