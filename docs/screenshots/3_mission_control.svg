  <!-- Health Score Card -->
  <rect x="30" y="90" width="250" height="100" rx="10" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="115" fill="#64748b" font-size="11">System Health</text>
  <text x="50" y="145" fill="#34d399" font-size="36" font-weight="bold">98%</text>
  <text x="50" y="170" fill="#64748b" font-size="11">🟢 All systems operational</text>

  <!-- Active Modules Card -->
  <rect x="300" y="90" width="250" height="100" rx="10" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>
  <text x="320" y="115" fill="#64748b" font-size="11">Active Modules</text>
  <text x="320" y="145" fill="#22d3ee" font-size="36" font-weight="bold">24</text>
  <text x="320" y="170" fill="#64748b" font-size="11">8 Forge · 5 Pulse · 4 Vault · 7 Atlas</text>

  <!-- Revenue Card -->
  <rect x="570" y="90" width="250" height="100" rx="10" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>
  <text x="590" y="115" fill="#64748b" font-size="11">Revenue This Month</text>
  <text x="590" y="145" fill="#34d399" font-size="36" font-weight="bold">$3,420</text>
  <text x="590" y="170" fill="#64748b" font-size="11">↑ 24% vs last month</text>

  <!-- Uptime Card -->
  <rect x="840" y="90" width="230" height="100" rx="10" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>
  <text x="860" y="115" fill="#64748b" font-size="11">Uptime</text>
  <text x="860" y="145" fill="#a78bfa" font-size="36" font-weight="bold">99.7%</text>
  <text x="860" y="170" fill="#64748b" font-size="11">Scheduler uptime · 72h</text>

  <!-- Cycle Status -->
  <rect x="30" y="210" width="520" height="170" rx="10" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="240" fill="#e2e8f0" font-size="14" font-weight="bold">🔄 Active Cycles</text>

  <rect x="50" y="255" width="230" height="50" rx="6" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="65" y="278" fill="#22d3ee" font-size="13"><tspan font-weight="bold">🔄 FORGE</tspan></text>
  <text x="240" y="278" text-anchor="end" fill="#34d399" font-size="12">● Running</text>
  <text x="65" y="295" fill="#64748b" font-size="10">Cron 30m · 23 opportunities · 302 scored</text>

  <rect x="300" y="255" width="230" height="50" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="315" y="278" fill="#34d399" font-size="13"><tspan font-weight="bold">⚡ PULSE</tspan></text>
  <text x="500" y="278" text-anchor="end" fill="#fbbf24" font-size="12">● Waiting</text>
  <text x="315" y="295" fill="#64748b" font-size="10">Cron 2h · Next: 16:00 UTC</text>

  <rect x="50" y="315" width="230" height="50" rx="6" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="65" y="338" fill="#a78bfa" font-size="13"><tspan font-weight="bold">💰 VAULT</tspan></text>
  <text x="240" y="338" text-anchor="end" fill="#34d399" font-size="12">● Running</text>
  <text x="65" y="355" fill="#64748b" font-size="10">Interval 6h · Backup · Revenue · Health</text>

  <rect x="300" y="315" width="230" height="50" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
  <text x="315" y="338" fill="#fb7185" font-size="13"><tspan font-weight="bold">🛡️ ATLAS</tspan></text>
  <text x="500" y="338" text-anchor="end" fill="#34d399" font-size="12">● Running</text>
  <text x="315" y="355" fill="#64748b" font-size="10">Interval 1h · Health · Model · Disk</text>

  <!-- Recent Activity -->
  <rect x="570" y="210" width="500" height="170" rx="10" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>
