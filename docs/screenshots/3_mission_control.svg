  <text x="590" y="270" fill="#22d3ee" font-size="11">●</text>
  <text x="610" y="270" fill="#e2e8f0" font-size="11">Opire: new bounty $500</text>
  <text x="1050" y="270" text-anchor="end" fill="#64748b" font-size="10">2m ago</text>

  <text x="590" y="295" fill="#34d399" font-size="11">●</text>
  <text x="610" y="295" fill="#e2e8f0" font-size="11">Atlas health: all checks OK</text>
  <text x="1050" y="295" text-anchor="end" fill="#64748b" font-size="10">15m ago</text>

  <text x="590" y="320" fill="#a78bfa" font-size="11">●</text>
  <text x="610" y="320" fill="#e2e8f0" font-size="11">Vault backup: completed</text>
  <text x="1050" y="320" text-anchor="end" fill="#64748b" font-size="10">1h ago</text>

  <text x="590" y="345" fill="#fbbf24" font-size="11">●</text>
  <text x="610" y="345" fill="#e2e8f0" font-size="11">Forge: 4 new opportunities</text>
  <text x="1050" y="345" text-anchor="end" fill="#64748b" font-size="10">2h ago</text>

  <text x="590" y="370" fill="#fb7185" font-size="11">●</text>
  <text x="610" y="370" fill="#e2e8f0" font-size="11">Security scan: 0 vulns</text>
  <text x="1050" y="370" text-anchor="end" fill="#64748b" font-size="10">3h ago</text>

  <!-- Pipeline Diagram -->
  <rect x="30" y="400" width="1040" height="180" rx="10" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>
  <text x="50" y="430" fill="#e2e8f0" font-size="14" font-weight="bold">⚙️ Autonomous Pipeline</text>

  <!-- Pipeline stages -->
  <rect x="50" y="455" width="165" height="55" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="132" y="480" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="bold">🔍 Discovery</text>
  <text x="132" y="497" text-anchor="middle" fill="#64748b" font-size="9">Forge Adapters</text>

  <line x1="215" y1="482" x2="240" y2="482" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="245" y="455" width="165" height="55" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="327" y="480" text-anchor="middle" fill="#34d399" font-size="11" font-weight="bold">⚡ Analysis</text>
  <text x="327" y="497" text-anchor="middle" fill="#64748b" font-size="9">Scoring + Priority</text>

  <line x1="410" y1="482" x2="435" y2="482" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="440" y="455" width="165" height="55" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="522" y="480" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">🤖 Execution</text>
  <text x="522" y="497" text-anchor="middle" fill="#64748b" font-size="9">CoderAgent</text>

  <line x1="605" y1="482" x2="630" y2="482" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="635" y="455" width="165" height="55" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="717" y="480" text-anchor="middle" fill="#fb7185" font-size="11" font-weight="bold">📋 Review</text>
  <text x="717" y="497" text-anchor="middle" fill="#64748b" font-size="9">Validation</text>

  <line x1="800" y1="482" x2="825" y2="482" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="830" y="455" width="160" height="55" rx="8" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="910" y="480" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">💰 Revenue</text>
  <text x="910" y="497" text-anchor="middle" fill="#64748b" font-size="9">Payout + Track</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
