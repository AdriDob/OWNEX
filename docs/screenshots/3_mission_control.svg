  <!-- Status Bar -->
  <rect x="30" y="600" width="1040" height="40" rx="8" fill="rgba(52,211,153,0.05)" stroke="#34d399" stroke-width="1"/>
  <text x="550" y="625" text-anchor="middle" fill="#34d399" font-size="12">🟢 Sistema operacional autónomo · 23/23 jobs registrados · PIPELINE OPERATIONAL</text>
</svg>
