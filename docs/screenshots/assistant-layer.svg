<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Courier New', monospace">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="brainGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a14"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#a855f7" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="url(#headerGrad)" font-size="15" font-weight="bold" filter="url(#glow)">ORION ASSISTANT LAYER — 7 CHARACTERS</text>
  <text x="400" y="48" text-anchor="middle" fill="#666" font-size="9">Contextual hints · Onboarding bubbles · Spotlight guidance · All dismissable</text>

  <!-- Central Brain -->
  <circle cx="400" cy="300" r="60" fill="url(#brainGlow)"/>
  <circle cx="400" cy="300" r="45" fill="#0d1117" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
  <circle cx="400" cy="300" r="35" fill="#1a1a2e" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
  <!-- Brain icon (simple) -->
  <text x="400" y="295" text-anchor="middle" fill="#a855f7" font-size="22" filter="url(#glow)">⟐</text>
  <text x="400" y="315" text-anchor="middle" fill="#a855f7" font-size="10" font-weight="bold">ORION</text>
  <text x="400" y="355" text-anchor="middle" fill="#888" font-size="8">Assistant Layer</text>

  <!-- Character 1: MERLIN (top-left) -->
  <g>
    <!-- Connection line -->
    <line x1="365" y1="270" x2="180" y2="140" stroke="#a855f7" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
    <!-- Dot (pixel-art style) -->
    <circle cx="160" cy="120" r="18" fill="#0d1117" stroke="#a855f7" stroke-width="2"/>
    <text x="160" y="124" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="bold">M</text>
    <!-- Name -->
    <text x="160" y="150" text-anchor="middle" fill="#a855f7" font-size="10" font-weight="bold">MERLIN</text>
    <text x="160" y="163" text-anchor="middle" fill="#888" font-size="7">The Wizard</text>
    <!-- Speech bubble -->
    <rect x="195" y="85" width="160" height="35" rx="6" fill="#1a1a2e" stroke="#a855f7" stroke-width="0.8"/>
    <polygon points="195,105 185,110 195,115" fill="#1a1a2e" stroke="#a855f7" stroke-width="0.8"/>
    <rect x="196" y="86" width="158" height="33" rx="5" fill="#1a1a2e"/>
    <text x="275" y="100" text-anchor="middle" fill="#ccc" font-size="7">"This SSRF hypothesis has</text>
    <text x="275" y="111" text-anchor="middle" fill="#ccc" font-size="7">  73% acceptance probability"</text>
  </g>

  <!-- Character 2: CLIPPY (top-right) -->
  <g>
    <line x1="435" y1="270" x2="620" y2="140" stroke="#f5a623" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
    <circle cx="640" cy="120" r="18" fill="#0d1117" stroke="#f5a623" stroke-width="2"/>
    <text x="640" y="124" text-anchor="middle" fill="#f5a623" font-size="14" font-weight="bold">C</text>
    <text x="640" y="150" text-anchor="middle" fill="#f5a623" font-size="10" font-weight="bold">CLIPPY</text>
    <text x="640" y="163" text-anchor="middle" fill="#888" font-size="7">The Helper</text>
    <rect x="450" y="85" width="160" height="35" rx="6" fill="#1a1a2e" stroke="#f5a623" stroke-width="0.8"/>
    <polygon points="610,105 620,110 610,115" fill="#1a1a2e" stroke="#f5a623" stroke-width="0.8"/>
    <rect x="451" y="86" width="158" height="33" rx="5" fill="#1a1a2e"/>
    <text x="530" y="100" text-anchor="middle" fill="#ccc" font-size="7">"Looks like you're writing</text>
    <text x="530" y="111" text-anchor="middle" fill="#ccc" font-size="7">  a report. Need templates?"</text>
  </g>

  <!-- Character 3: ROVER (left) -->
  <g>
    <line x1="360" y1="300" x2="130" y2="290" stroke="#00ffff" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
    <circle cx="110" cy="290" r="18" fill="#0d1117" stroke="#00ffff" stroke-width="2"/>
    <text x="110" y="294" text-anchor="middle" fill="#00ffff" font-size="14" font-weight="bold">R</text>
    <text x="110" y="320" text-anchor="middle" fill="#00ffff" font-size="10" font-weight="bold">ROVER</text>
    <text x="110" y="333" text-anchor="middle" fill="#888" font-size="7">The Explorer</text>
    <rect x="15" y="245" width="160" height="35" rx="6" fill="#1a1a2e" stroke="#00ffff" stroke-width="0.8"/>
    <polygon points="130,270 140,275 130,280" fill="#1a1a2e" stroke="#00ffff" stroke-width="0.8"/>
    <rect x="16" y="246" width="158" height="33" rx="5" fill="#1a1a2e"/>
    <text x="95" y="260" text-anchor="middle" fill="#ccc" font-size="7">"Found 3 new subdomains</text>
    <text x="95" y="271" text-anchor="middle" fill="#ccc" font-size="7">  on example.com via crt.sh"</text>
  </g>

  <!-- Character 4: LINKS (right) -->
  <g>
    <line x1="440" y1="300" x2="670" y2="290" stroke="#00ff41" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
    <circle cx="690" cy="290" r="18" fill="#0d1117" stroke="#00ff41" stroke-width="2"/>
    <text x="690" y="294" text-anchor="middle" fill="#00ff41" font-size="14" font-weight="bold">L</text>
    <text x="690" y="320" text-anchor="middle" fill="#00ff41" font-size="10" font-weight="bold">LINKS</text>
    <text x="690" y="333" text-anchor="middle" fill="#888" font-size="7">The Connector</text>
    <rect x="625" y="245" width="160" height="35" rx="6" fill="#1a1a2e" stroke="#00ff41" stroke-width="0.8"/>
    <polygon points="660,270 650,275 660,280" fill="#1a1a2e" stroke="#00ff41" stroke-width="0.8"/>
    <rect x="626" y="246" width="158" height="33" rx="5" fill="#1a1a2e"/>
    <text x="705" y="260" text-anchor="middle" fill="#ccc" font-size="7">"HackerOne program scope</text>
    <text x="705" y="271" text-anchor="middle" fill="#ccc" font-size="7">  expanded. Check new assets"</text>
  </g>

  <!-- Character 5: DOT (bottom-left) -->
  <g>
    <line x1="370" y1="335" x2="200" y2="440" stroke="#ff3366" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
    <circle cx="180" cy="460" r="18" fill="#0d1117" stroke="#ff3366" stroke-width="2"/>
    <text x="180" y="464" text-anchor="middle" fill="#ff3366" font-size="14" font-weight="bold">D</text>
    <text x="180" y="490" text-anchor="middle" fill="#ff3366" font-size="10" font-weight="bold">DOT</text>
    <text x="180" y="503" text-anchor="middle" fill="#888" font-size="7">The Monitor</text>
    <rect x="30" y="425" width="160" height="35" rx="6" fill="#1a1a2e" stroke="#ff3366" stroke-width="0.8"/>
    <polygon points="145,450 155,455 145,460" fill="#1a1a2e" stroke="#ff3366" stroke-width="0.8"/>
    <rect x="31" y="426" width="158" height="33" rx="5" fill="#1a1a2e"/>
    <text x="110" y="440" text-anchor="middle" fill="#ccc" font-size="7">"Health check: 98/100.</text>
    <text x="110" y="451" text-anchor="middle" fill="#ccc" font-size="7">  All systems green."</text>
  </g>

  <!-- Character 6: F1 (bottom-center) -->
  <g>
    <line x1="400" y1="345" x2="400" y2="440" stroke="#f5a623" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
    <circle cx="400" cy="460" r="18" fill="#0d1117" stroke="#f5a623" stroke-width="2"/>
    <text x="400" y="464" text-anchor="middle" fill="#f5a623" font-size="14" font-weight="bold">F1</text>
    <text x="400" y="490" text-anchor="middle" fill="#f5a623" font-size="10" font-weight="bold">F1 MERLIN</text>
    <text x="400" y="503" text-anchor="middle" fill="#888" font-size="7">The Automator</text>
    <rect x="320" y="525" width="160" height="35" rx="6" fill="#1a1a2e" stroke="#f5a623" stroke-width="0.8"/>
    <polygon points="380,525 390,518 400,525" fill="#1a1a2e" stroke="#f5a623" stroke-width="0.8"/>
    <rect x="321" y="526" width="158" height="33" rx="5" fill="#1a1a2e"/>
    <text x="400" y="540" text-anchor="middle" fill="#ccc" font-size="7">"Backup completed. SHA256</text>
    <text x="400" y="551" text-anchor="middle" fill="#ccc" font-size="7">  verified. 88MB, 127 files."</text>
  </g>

  <!-- Character 7: PEPE (bottom-right) -->
  <g>
    <line x1="430" y1="335" x2="600" y2="440" stroke="#a855f7" stroke-width="1" opacity="0.4" stroke-dasharray="4,3"/>
    <circle cx="620" cy="460" r="18" fill="#0d1117" stroke="#a855f7" stroke-width="2"/>
    <text x="620" y="464" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="bold">P</text>
    <text x="620" y="490" text-anchor="middle" fill="#a855f7" font-size="10" font-weight="bold">PEPE</text>
    <text x="620" y="503" text-anchor="middle" fill="#888" font-size="7">The Strategist</text>
    <rect x="610" y="525" width="160" height="35" rx="6" fill="#1a1a2e" stroke="#a855f7" stroke-width="0.8"/>
    <polygon points="640,525 630,518 620,525" fill="#1a1a2e" stroke="#a855f7" stroke-width="0.8"/>
    <rect x="611" y="526" width="158" height="33" rx="5" fill="#1a1a2e"/>
    <text x="690" y="540" text-anchor="middle" fill="#ccc" font-size="7">"Target ROI analysis: focus</text>
    <text x="690" y="551" text-anchor="middle" fill="#ccc" font-size="7">  on Immunefi bounties >$50K"</text>
  </g>

  <!-- Legend -->
  <rect x="20" y="565" width="760" height="28" rx="4" fill="#0d1117" stroke="#333" stroke-width="0.5"/>
  <text x="400" y="583" text-anchor="middle" fill="#666" font-size="8">Each character specializes in a domain. Context-aware hints appear per page. All messages dismissable via X or keyboard shortcut.</text>
</svg>