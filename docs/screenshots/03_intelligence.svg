  <text x="620" y="480" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="11">Acceptance Predictor</text>
  <rect x="800" y="470" width="200" height="10" rx="5" fill="rgba(30,41,59,0.8)"/>
  <rect x="800" y="470" width="144" height="10" rx="5" fill="#34d399"/>
  <text x="1010" y="480" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="10">72%</text>
  
  <text x="620" y="515" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="11">Success Rate Estimator</text>
  <rect x="800" y="505" width="200" height="10" rx="5" fill="rgba(30,41,59,0.8)"/>
  <rect x="800" y="505" width="170" height="10" rx="5" fill="#22d3ee"/>
  <text x="1010" y="515" fill="#22d3ee" font-family="system-ui,-apple-system,sans-serif" font-size="10">85%</text>
  
  <text x="620" y="550" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="11">Risk Assessment Model</text>
  <rect x="800" y="540" width="200" height="10" rx="5" fill="rgba(30,41,59,0.8)"/>
  <rect x="800" y="540" width="120" height="10" rx="5" fill="#fbbf24"/>
  <text x="1010" y="550" fill="#fbbf24" font-family="system-ui,-apple-system,sans-serif" font-size="10">60%</text>
  
  <text x="620" y="585" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="11">Evidence Quality Scorer</text>
  <rect x="800" y="575" width="200" height="10" rx="5" fill="rgba(30,41,59,0.8)"/>
  <rect x="800" y="575" width="180" height="10" rx="5" fill="#a78bfa"/>
  <text x="1010" y="585" fill="#a78bfa" font-family="system-ui,-apple-system,sans-serif" font-size="10">90%</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="620" width="1100" height="30" fill="rgba(15,23,42,0.8)"/>
  <text x="20" y="640" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="10">UnifiedMemoryStore (SQLite) • KnowledgeCapture • DecisionJournal • AdaptiveSuccessRate</text>
