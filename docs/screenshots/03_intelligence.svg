  <text x="600" y="235" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600">DECISION JOURNAL</text>
  
  <rect x="600" y="250" width="460" height="160" rx="8" fill="rgba(15,23,42,0.6)" stroke="#1e293b"/>
  
  <text x="620" y="280" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="11">2026-08-04 14:32 — Pipeline promoted to Phase 2</text>
  <text x="620" y="300" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="10">Reason: 30 days profit &gt; $500, consistency score 0.87</text>
  
  <text x="620" y="330" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="11">2026-08-04 09:15 — Acceptance learner updated</text>
  <text x="620" y="350" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="10">Reason: HackerOne acceptance rate increased to 72% after evidence quality threshold raised</text>
  
  <text x="620" y="380" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="11">2026-08-03 22:47 — Auto-submit threshold adjusted</text>
  <text x="620" y="400" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="10">Reason: 3 false positives in medium findings — threshold 80 → 85</text>
  
