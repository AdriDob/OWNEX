  <circle cx="150" cy="540" r="8" fill="#22d3ee"/>
  <text x="170" y="544" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="11">Auth bypass via path traversal</text>
  <text x="170" y="560" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="9">Pending • 1 occurrence • needs validation</text>
  
