<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <rect width="1100" height="650" fill="#0b1120"/>
  
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0L0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <rect width="1100" height="650" fill="url(#grid)"/>
  
  <!-- Top bar -->
  <rect x="0" y="0" width="1100" height="48" fill="rgba(15,23,42,0.8)"/>
  <text x="24" y="30" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600">OWNEX — Intelligence &amp; Memory</text>
  
  <!-- Knowledge Engine -->
  <text x="80" y="80" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600">KNOWLEDGE ENGINE</text>
  <text x="80" y="100" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="11">Persistent memory that survives restarts and evolves with every operation</text>
  
  <!-- Memory Stats -->
  <rect x="80" y="120" width="220" height="80" rx="8" fill="rgba(15,23,42,0.6)" stroke="#1e293b"/>
  <text x="100" y="145" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="11">LEARNINGS STORED</text>
  <text x="100" y="178" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="bold">1,247</text>
  
  <rect x="320" y="120" width="220" height="80" rx="8" fill="rgba(15,23,42,0.6)" stroke="#1e293b"/>
  <text x="340" y="145" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="11">PATTERNS RECOGNIZED</text>
  <text x="340" y="178" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="bold">89</text>
  
  <rect x="560" y="120" width="220" height="80" rx="8" fill="rgba(15,23,42,0.6)" stroke="#1e293b"/>
  <text x="580" y="145" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="11">SUCCESS MODELS</text>
  <text x="580" y="178" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="bold">12</text>
  
  <rect x="800" y="120" width="260" height="80" rx="8" fill="rgba(15,23,42,0.6)" stroke="#1e293b"/>
  <text x="820" y="145" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="11">EVOLUTION CYCLES</text>
  <text x="820" y="178" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="bold">3 active</text>
  
  <!-- Knowledge graph visualization -->
  <text x="80" y="235" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600">KNOWLEDGE GRAPH — Recent Captures</text>
  
  <rect x="80" y="250" width="480" height="350" rx="8" fill="rgba(15,23,42,0.6)" stroke="#1e293b"/>
  
  <!-- Knowledge nodes -->
  <circle cx="150" cy="300" r="8" fill="#22d3ee"/>
  <text x="170" y="304" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="11">SQLi pattern on REST APIs</text>
  <text x="170" y="320" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="9">HackerOne • 3 occurrences • 100% repro</text>
  
  <circle cx="150" cy="360" r="8" fill="#34d399"/>
  <text x="170" y="364" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="11">IDOR via predictable IDs</text>
  <text x="170" y="380" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="9">Bugcrowd • 5 findings • $2,400 earned</text>
  
  <circle cx="150" cy="420" r="8" fill="#fbbf24"/>
  <text x="170" y="424" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="11">XSS in markdown renderers</text>
  <text x="170" y="440" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="9">Intigriti • 2 occurrences • filter bypass</text>
  
  <circle cx="150" cy="480" r="8" fill="#a78bfa"/>
  <text x="170" y="484" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="11">SSRF via webhook endpoints</text>
