  <text x="540" y="130" fill="#22d3ee" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600">PHASE 2</text>
  <text x="540" y="150" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Multi-Platform</text>
  <text x="540" y="170" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="9">+ Freelance</text>
  <text x="540" y="185" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="9">+ Dev bounties</text>
  <text x="540" y="200" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="9">+ Auto-apply</text>
  <text x="540" y="215" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="9">$2k+/month</text>
  
