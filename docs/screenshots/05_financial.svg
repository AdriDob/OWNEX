  <line x1="500" y1="160" x2="518" y2="160" stroke="#22d3ee" stroke-width="1.5"/>
  <line x1="720" y1="160" x2="738" y2="160" stroke="#34d399" stroke-width="1.5"/>
  
  <!-- Risk Guardian -->
