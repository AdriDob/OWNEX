  <text x="100" y="280" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600">RISK GUARDIAN</text>
  <text x="100" y="300" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Max drawdown: 15% (warning) / 25% (critical)</text>
  <text x="100" y="320" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Position sizing: Kelly criterion + volatility adjustment</text>
  <text x="100" y="340" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Auto-rebalance when correlation > 0.7</text>
  <text x="100" y="360" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Daily VaR limit: 5% of total capital</text>
  <text x="100" y="380" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="10">Phase downgrade on consecutive losses</text>
  <text x="100" y="400" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="10">0% loss days in current streak</text>
  
