  <!-- Title -->
  <text x="80" y="80" fill="#e2e8f0" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="600">PROGRESSIVE SCALING — 4 PHASES</text>
  
  <!-- Phase 0 -->
  <rect x="80" y="100" width="200" height="120" rx="8" fill="rgba(136,19,55,0.2)" stroke="#e82127"/>
  <text x="100" y="130" fill="#e82127" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600">PHASE 0</text>
  <text x="100" y="150" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Survival Mode</text>
  <text x="100" y="170" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="9">Data annotation</text>
  <text x="100" y="185" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="9">AI training</text>
  <text x="100" y="200" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="9">Fiverr (1-2 days)</text>
  <text x="100" y="215" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="9">cash_speed >= 0.85</text>
  
  <!-- Phase 1 -->
  <rect x="300" y="100" width="200" height="120" rx="8" fill="rgba(120,53,15,0.15)" stroke="#fbbf24"/>
  <text x="320" y="130" fill="#fbbf24" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600">PHASE 1</text>
  <text x="320" y="150" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Bug Bounty</text>
  <text x="320" y="170" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="9">HackerOne</text>
  <text x="320" y="185" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="9">Bugcrowd</text>
  <text x="320" y="200" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="9">Intigriti</text>
  <text x="320" y="215" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="9">$500+/month</text>
  
