  <rect x="80" y="460" width="940" height="150" rx="8" fill="rgba(15,23,42,0.6)" stroke="#1e293b"/>
  
  <text x="100" y="490" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="11">Platform acceptance rates (rolling 30-day window)</text>
  
  <text x="100" y="520" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">HackerOne</text>
