  <text x="600" y="320" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Rebalance weekly or on &gt;20% allocation drift</text>
  
  <!-- Allocation bars -->
  <text x="600" y="350" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Bug Bounty</text>
  <rect x="700" y="340" width="200" height="10" rx="5" fill="rgba(30,41,59,0.8)"/>
  <rect x="700" y="340" width="120" height="10" rx="5" fill="#22d3ee"/>
  <text x="910" y="350" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">60%</text>
  
  <text x="600" y="375" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Freelance</text>
  <rect x="700" y="365" width="200" height="10" rx="5" fill="rgba(30,41,59,0.8)"/>
  <rect x="700" y="365" width="60" height="10" rx="5" fill="#34d399"/>
  <text x="910" y="375" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">30%</text>
  
  <text x="600" y="400" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Investment</text>
  <rect x="700" y="390" width="200" height="10" rx="5" fill="rgba(30,41,59,0.8)"/>
