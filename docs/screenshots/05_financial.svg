  <rect x="200" y="510" width="144" height="10" rx="5" fill="#34d399"/>
  <text x="410" y="520" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="10">72%</text>
  
  <text x="450" y="520" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Bugcrowd</text>
  <rect x="550" y="510" width="200" height="10" rx="5" fill="rgba(30,41,59,0.8)"/>
  <rect x="550" y="510" width="100" height="10" rx="5" fill="#fbbf24"/>
  <text x="760" y="520" fill="#fbbf24" font-family="system-ui,-apple-system,sans-serif" font-size="10">50%</text>
  
  <text x="100" y="550" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Intigriti</text>
  <rect x="200" y="540" width="200" height="10" rx="5" fill="rgba(30,41,59,0.8)"/>
  <rect x="200" y="540" width="160" height="10" rx="5" fill="#22d3ee"/>
  <text x="410" y="550" fill="#22d3ee" font-family="system-ui,-apple-system,sans-serif" font-size="10">80%</text>
  
  <text x="450" y="550" fill="#94a3b8" font-family="system-ui,-apple-system,sans-serif" font-size="10">Upwork</text>
  <rect x="550" y="540" width="200" height="10" rx="5" fill="rgba(30,41,59,0.8)"/>
  <rect x="550" y="540" width="130" height="10" rx="5" fill="#a78bfa"/>
  <text x="760" y="550" fill="#a78bfa" font-family="system-ui,-apple-system,sans-serif" font-size="10">65%</text>
  
  <text x="100" y="585" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="10">System adapts submission strategy based on historical acceptance data. Low-acceptance platforms deprioritized automatically.</text>
  
  <!-- Bottom bar -->
