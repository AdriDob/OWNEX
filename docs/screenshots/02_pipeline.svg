  <text x="280" y="155" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="10" text-anchor="middle">Endpoint</text>
  <text x="280" y="170" fill="#64748b" font-family="system-ui,-apple-system,sans-serif" font-size="10" text-anchor="middle">discovery</text>
  <text x="280" y="185" fill="#34d399" font-family="system-ui,-apple-system,sans-serif" font-size="9" text-anchor="middle">847 found</text>
  
