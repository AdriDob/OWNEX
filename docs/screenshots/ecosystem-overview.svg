<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="'Courier New', monospace">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0a0a14"/>
  <rect width="800" height="600" fill="url(#centerGlow)"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.06" stroke="#a855f7" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="url(#headerGrad)" font-size="16" font-weight="bold" filter="url(#glow)">ORION ECOSYSTEM — ARCHITECTURE OVERVIEW</text>
  <text x="400" y="52" text-anchor="middle" fill="#666" font-size="10">v4.6.0 · All-in-one intelligence operating system</text>

  <!-- FRONTEND LAYER -->
  <g filter="url(#glow)">
    <rect x="250" y="68" width="300" height="42" rx="6" fill="#0d1117" stroke="#00ffff" stroke-width="1.5"/>
    <text x="400" y="87" text-anchor="middle" fill="#00ffff" font-size="12" font-weight="bold">FRONTEND</text>
    <text x="400" y="102" text-anchor="middle" fill="#888" font-size="9">Vue 3 SPA · 58 pages · Pinia · Tailwind CSS v4</text>
  </g>

  <!-- Arrow down from Frontend -->
  <line x1="400" y1="110" x2="400" y2="135" stroke="#00ffff" stroke-width="1" opacity="0.5" marker-end="url(#arrowCyan)"/>

  <!-- ORION CORE — center box -->
  <rect x="170" y="140" width="460" height="160" rx="10" fill="#0d1117" stroke="#a855f7" stroke-width="2"/>
  <rect x="172" y="142" width="456" height="156" rx="9" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.3"/>
  <text x="400" y="162" text-anchor="middle" fill="#a855f7" font-size="14" font-weight="bold" filter="url(#glow)">⟐ ORION CORE ⟐</text>
  <line x1="200" y1="170" x2="600" y2="170" stroke="#a855f7" stroke-width="0.5" opacity="0.3"/>

  <!-- Core modules grid -->
  <g font-size="9" fill="#ccc">
    <!-- Row 1 -->
    <rect x="190" y="180" width="100" height="42" rx="4" fill="#1a1a2e" stroke="#a855f7" stroke-width="0.8"/>
    <text x="240" y="197" text-anchor="middle" fill="#a855f7" font-size="9" font-weight="bold">EventBus</text>
    <text x="240" y="212" text-anchor="middle" fill="#888" font-size="7">Pub/sub · SQLite</text>

    <rect x="305" y="180" width="100" height="42" rx="4" fill="#1a1a2e" stroke="#a855f7" stroke-width="0.8"/>
    <text x="355" y="197" text-anchor="middle" fill="#a855f7" font-size="9" font-weight="bold">Scheduler</text>
    <text x="355" y="212" text-anchor="middle" fill="#888" font-size="7">Pipeline · Priority</text>

    <rect x="420" y="180" width="100" height="42" rx="4" fill="#1a1a2e" stroke="#a855f7" stroke-width="0.8"/>
    <text x="470" y="197" text-anchor="middle" fill="#a855f7" font-size="9" font-weight="bold">Copilot</text>
    <text x="470" y="212" text-anchor="middle" fill="#888" font-size="7">5 levels · 4 bands</text>

    <rect x="535" y="180" width="80" height="42" rx="4" fill="#1a1a2e" stroke="#a855f7" stroke-width="0.8"/>
    <text x="575" y="197" text-anchor="middle" fill="#a855f7" font-size="9" font-weight="bold">Memory</text>
    <text x="575" y="212" text-anchor="middle" fill="#888" font-size="7">10 namespaces</text>

    <!-- Row 2 -->
    <rect x="190" y="232" width="100" height="42" rx="4" fill="#1a1a2e" stroke="#00ffff" stroke-width="0.8"/>
    <text x="240" y="249" text-anchor="middle" fill="#00ffff" font-size="9" font-weight="bold">Health</text>
    <text x="240" y="264" text-anchor="middle" fill="#888" font-size="7">Score · Snapshots</text>

    <rect x="305" y="232" width="100" height="42" rx="4" fill="#1a1a2e" stroke="#00ffff" stroke-width="0.8"/>
    <text x="355" y="249" text-anchor="middle" fill="#00ffff" font-size="9" font-weight="bold">Secrets</text>
    <text x="355" y="264" text-anchor="middle" fill="#888" font-size="7">AES-256-GCM</text>

    <rect x="420" y="232" width="100" height="42" rx="4" fill="#1a1a2e" stroke="#00ffff" stroke-width="0.8"/>
    <text x="470" y="249" text-anchor="middle" fill="#00ffff" font-size="9" font-weight="bold">Extensions</text>
    <text x="470" y="264" text-anchor="middle" fill="#888" font-size="7">SDK · Hot reload</text>

    <rect x="535" y="232" width="80" height="42" rx="4" fill="#1a1a2e" stroke="#00ffff" stroke-width="0.8"/>
    <text x="575" y="249" text-anchor="middle" fill="#00ffff" font-size="9" font-weight="bold">Workflows</text>
    <text x="575" y="264" text-anchor="middle" fill="#888" font-size="7">YAML · Engine</text>
  </g>

  <!-- Arrows from Core down to Apps -->
  <line x1="400" y1="300" x2="400" y2="325" stroke="#a855f7" stroke-width="1.5" opacity="0.6"/>

  <!-- APPS LAYER -->
  <text x="400" y="338" text-anchor="middle" fill="#666" font-size="9">APPS LAYER</text>

  <!-- AEGIS -->
  <g filter="url(#glow)">
    <rect x="30" y="350" width="130" height="80" rx="8" fill="#0d1117" stroke="#00ff41" stroke-width="1.5"/>
    <text x="95" y="372" text-anchor="middle" fill="#00ff41" font-size="11" font-weight="bold">AEGIS</text>
    <text x="95" y="387" text-anchor="middle" fill="#888" font-size="8">Pentesting</text>
    <text x="95" y="400" text-anchor="middle" fill="#666" font-size="7">subfinder · httpx · katana</text>
    <text x="95" y="413" text-anchor="middle" fill="#666" font-size="7">nuclei · ffuf · dalfox</text>
    <text x="95" y="426" text-anchor="middle" fill="#00ff41" font-size="7">10 platform connectors</text>
  </g>

  <!-- CATEYE -->
  <g filter="url(#glow)">
    <rect x="175" y="350" width="130" height="80" rx="8" fill="#0d1117" stroke="#f5a623" stroke-width="1.5"/>
    <text x="240" y="372" text-anchor="middle" fill="#f5a623" font-size="11" font-weight="bold">CATEYE</text>
    <text x="240" y="387" text-anchor="middle" fill="#888" font-size="8">Bug Bounty</text>
    <text x="240" y="400" text-anchor="middle" fill="#666" font-size="7">ORION Score · EVH</text>
    <text x="240" y="413" text-anchor="middle" fill="#666" font-size="7">Pipeline E2E · Challenger</text>
    <text x="240" y="426" text-anchor="middle" fill="#f5a623" font-size="7">8 hypothesis generators</text>
  </g>

  <!-- ATLAS -->
  <g filter="url(#glow)">
    <rect x="320" y="350" width="130" height="80" rx="8" fill="#0d1117" stroke="#00ffff" stroke-width="1.5"/>
    <text x="385" y="372" text-anchor="middle" fill="#00ffff" font-size="11" font-weight="bold">ATLAS</text>
    <text x="385" y="387" text-anchor="middle" fill="#888" font-size="8">Finances</text>
    <text x="385" y="400" text-anchor="middle" fill="#666" font-size="7">CoinGecko · Takenos</text>
    <text x="385" y="413" text-anchor="middle" fill="#666" font-size="7">Binance · Coinbase · Kraken</text>
    <text x="385" y="426" text-anchor="middle" fill="#00ffff" font-size="7">Portfolio dashboard</text>
  </g>

  <!-- ODYSSEY -->
  <g filter="url(#glow)">
    <rect x="465" y="350" width="130" height="80" rx="8" fill="#0d1117" stroke="#a855f7" stroke-width="1.5"/>
    <text x="530" y="372" text-anchor="middle" fill="#a855f7" font-size="11" font-weight="bold">ODYSSEY</text>
    <text x="530" y="387" text-anchor="middle" fill="#888" font-size="8">Strategy</text>
    <text x="530" y="400" text-anchor="middle" fill="#666" font-size="7">Predictive markets</text>
    <text x="530" y="413" text-anchor="middle" fill="#666" font-size="7">Bankroll · Bets</text>
    <text x="530" y="426" text-anchor="middle" fill="#a855f7" font-size="7">Research engine</text>
  </g>

  <!-- F1 MERLIN -->
  <g filter="url(#glow)">
    <rect x="610" y="350" width="160" height="80" rx="8" fill="#0d1117" stroke="#ff3366" stroke-width="1.5"/>
    <text x="690" y="372" text-anchor="middle" fill="#ff3366" font-size="11" font-weight="bold">F1 MERLIN</text>
    <text x="690" y="387" text-anchor="middle" fill="#888" font-size="8">Automation</text>
    <text x="690" y="400" text-anchor="middle" fill="#666" font-size="7">System automation</text>
    <text x="690" y="413" text-anchor="middle" fill="#666" font-size="7">Backup · Health · Status</text>
    <text x="690" y="426" text-anchor="middle" fill="#ff3366" font-size="7">Safe mode + permissions</text>
  </g>

  <!-- Connection lines from Core to each App -->
  <g stroke="#a855f7" stroke-width="0.8" opacity="0.4" stroke-dasharray="4,3">
    <line x1="300" y1="300" x2="95" y2="350"/>
    <line x1="340" y1="300" x2="240" y2="350"/>
    <line x1="400" y1="300" x2="385" y2="350"/>
    <line x1="460" y1="300" x2="530" y2="350"/>
    <line x1="520" y1="300" x2="690" y2="350"/>
  </g>

  <!-- DATABASE LAYER -->
  <rect x="200" y="455" width="400" height="50" rx="8" fill="#0d1117" stroke="#00ff41" stroke-width="1.5"/>
  <text x="400" y="477" text-anchor="middle" fill="#00ff41" font-size="11" font-weight="bold">DATABASE</text>
  <text x="400" y="495" text-anchor="middle" fill="#888" font-size="8">SQLite WAL · 36+ tables · 6 databases · AES-256-GCM encryption · integrity check</text>

  <!-- Arrow from Apps to DB -->
  <line x1="400" y1="430" x2="400" y2="455" stroke="#00ff41" stroke-width="1" opacity="0.4" stroke-dasharray="3,3"/>

  <!-- Connection lines from Apps to DB -->
  <g stroke="#00ff41" stroke-width="0.5" opacity="0.3">
    <line x1="95" y1="430" x2="250" y2="455"/>
    <line x1="240" y1="430" x2="320" y2="455"/>
    <line x1="385" y1="430" x2="400" y2="455"/>
    <line x1="530" y1="430" x2="480" y2="455"/>
    <line x1="690" y1="430" x2="550" y2="455"/>
  </g>

  <!-- API LAYER label -->
  <rect x="150" y="515" width="500" height="30" rx="4" fill="#0d1117" stroke="#666" stroke-width="0.8"/>
  <text x="400" y="534" text-anchor="middle" fill="#666" font-size="9">API LAYER — FastAPI · 60+ endpoints · Auth · CSRF · Rate Limiting · Extension API</text>

  <!-- Bottom decorative line -->
  <line x1="100" y1="560" x2="700" y2="560" stroke="url(#headerGrad)" stroke-width="1" opacity="0.3"/>
  <text x="400" y="580" text-anchor="middle" fill="#444" font-size="8">ORION · v4.6.0 · 100% local · Private · Autonomous · Built in Argentina</text>
</svg>