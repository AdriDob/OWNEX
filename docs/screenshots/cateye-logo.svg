<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="'JetBrains Mono','Fira Code',monospace">
  <defs>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="40%" stop-color="#00cc33"/>
      <stop offset="70%" stop-color="#009922"/>
      <stop offset="100%" stop-color="#005511"/>
    </radialGradient>
    <radialGradient id="pupilGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="eyeGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0f0a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="20"/>
  <rect x="2" y="2" width="396" height="396" fill="none" stroke="rgba(0,255,65,0.08)" stroke-width="1" rx="18"/>

  <!-- Scanlines -->
  <pattern id="scanlines" patternUnits="userSpaceOnUse" width="400" height="3">
    <line x1="0" y1="0" x2="400" y2="0" stroke="rgba(0,255,65,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="400" height="400" fill="url(#scanlines)" opacity="0.5"/>

  <!-- Outer glow aura -->
  <ellipse cx="200" cy="180" rx="130" ry="90" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.08" filter="url(#outerGlow)">
    <animate attributeName="opacity" values="0.08;0.15;0.08" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="130;140;130" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="90;95;90" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Eye shape (almond) -->
  <g filter="url(#eyeGlow)">
    <path d="M200,120 
             C260,120 310,155 330,180 
             C350,205 350,220 330,230 
             C310,240 260,250 200,250 
             C140,250 90,240 70,230 
             C50,220 50,205 70,180 
             C90,155 140,120 200,120 Z" 
          fill="#001a00" stroke="#00ff41" stroke-width="3">
      <animate attributeName="stroke-opacity" values="1;0.7;1" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Iris (green) -->
  <ellipse cx="200" cy="185" rx="60" ry="55" fill="url(#irisGrad)" opacity="0.95">
    <animate attributeName="ry" values="55;53;55" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Iris texture - subtle lines -->
  <g opacity="0.15">
    <line x1="200" y1="130" x2="200" y2="240" stroke="#00ff41" stroke-width="0.5"/>
    <line x1="150" y1="140" x2="160" y2="235" stroke="#00ff41" stroke-width="0.5"/>
    <line x1="250" y1="140" x2="240" y2="235" stroke="#00ff41" stroke-width="0.5"/>
    <line x1="145" y1="170" x2="255" y2="200" stroke="#00ff41" stroke-width="0.5"/>
    <line x1="145" y1="200" x2="255" y2="170" stroke="#00ff41" stroke-width="0.5"/>
  </g>

  <!-- Slitted pupil (hunter mode) - vertical slit -->
  <path d="M192,140 
           C192,140 194,165 194,165 
           C194,175 194,195 194,205 
           C194,215 192,240 192,240 
           L208,240 
           C208,240 206,215 206,205 
           C206,195 206,175 206,165 
           C206,165 208,140 208,140 Z" 
        fill="url(#pupilGrad)">
    <animate attributeName="d" 
             values="M192,140 C192,140 194,165 194,165 C194,175 194,195 194,205 C194,215 192,240 192,240 L208,240 C208,240 206,215 206,205 C206,195 206,175 206,165 C206,165 208,140 208,140 Z;
                     M194,145 C194,145 195,165 195,165 C195,175 195,195 195,205 C195,215 194,235 194,235 L206,235 C206,235 205,215 205,205 C205,195 205,175 205,165 C205,165 206,145 206,145 Z;
                     M192,140 C192,140 194,165 194,165 C194,175 194,195 194,205 C194,215 192,240 192,240 L208,240 C208,240 206,215 206,205 C206,195 206,175 206,165 C206,165 208,140 208,140 Z" 
             dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Eye highlight/reflection -->
  <ellipse cx="175" cy="160" rx="12" ry="8" fill="white" opacity="0.25" transform="rotate(-20,175,160)">
    <animate attributeName="opacity" values="0.25;0.35;0.25" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="172" cy="155" rx="5" ry="3" fill="white" opacity="0.4" transform="rotate(-20,172,155)"/>

  <!-- Name -->
  <text x="200" y="315" font-size="36" font-weight="bold" fill="#00ff41" text-anchor="middle" filter="url(#eyeGlow)" letter-spacing="6">
    CATEYE
    <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="200" y="345" font-size="12" fill="rgba(255,255,255,0.3)" text-anchor="middle" letter-spacing="4">
    SECURITY INTELLIGENCE OS
  </text>

  <!-- Status line -->
  <line x1="100" y1="360" x2="300" y2="360" stroke="rgba(0,255,65,0.1)" stroke-width="1"/>

  <text x="200" y="378" font-size="9" fill="rgba(255,255,255,0.15)" text-anchor="middle" letter-spacing="2">v1.6.0 · HUNTER MODE</text>
</svg>
