  <rect x="30" y="500" width="1040" height="130" rx="10" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>

  <rect x="50" y="518" width="185" height="45" rx="6" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="142" y="540" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="bold">12</text>
  <text x="142" y="555" text-anchor="middle" fill="#64748b" font-size="9">Issues Analyzed</text>

  <rect x="250" y="518" width="185" height="45" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="342" y="540" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">8</text>
  <text x="342" y="555" text-anchor="middle" fill="#64748b" font-size="9">Patches Generated</text>

  <rect x="450" y="518" width="185" height="45" rx="6" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1"/>
  <text x="542" y="540" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">6</text>
  <text x="542" y="555" text-anchor="middle" fill="#64748b" font-size="9">Tests Passed</text>

  <rect x="650" y="518" width="185" height="45" rx="6" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="1"/>
  <text x="742" y="540" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">4</text>
  <text x="742" y="555" text-anchor="middle" fill="#64748b" font-size="9">PRs Submitted</text>

  <rect x="850" y="518" width="195" height="45" rx="6" fill="rgba(52,211,153,0.05)" stroke="#34d399" stroke-width="1"/>
  <text x="947" y="540" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">$2,000</text>
