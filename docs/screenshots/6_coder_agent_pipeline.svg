  <text x="320" y="175" text-anchor="middle" fill="#64748b" font-size="10">NLP classification</text>
  <text x="320" y="192" text-anchor="middle" fill="#64748b" font-size="10">Effort estimation</text>
  <text x="320" y="209" text-anchor="middle" fill="#64748b" font-size="10">Skill matching</text>
  <text x="320" y="226" text-anchor="middle" fill="#64748b" font-size="10">Priority scoring</text>
  <text x="320" y="248" text-anchor="middle" fill="#6366f1" font-size="9">issue_analyzer.py</text>

