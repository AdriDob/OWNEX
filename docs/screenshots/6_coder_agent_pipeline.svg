  <text x="580" y="416" fill="#64748b" font-size="10">$300 · repo: owner/api · Python · Status: Issue Analyzer</text>

  <rect x="50" y="430" width="490" height="45" rx="6" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1"/>
