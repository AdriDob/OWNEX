  <!-- Pipeline visualization -->
  <rect x="30" y="90" width="1040" height="220" rx="10" fill="rgba(15,23,42,0.6)" stroke="#1e293b" stroke-width="1"/>

  <!-- Stage 1: Repo Analyzer -->
  <rect x="50" y="120" width="160" height="160" rx="10" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
