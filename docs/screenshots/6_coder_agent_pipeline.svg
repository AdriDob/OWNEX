  <text x="130" y="226" text-anchor="middle" fill="#64748b" font-size="10">Dependency map</text>
  <text x="130" y="248" text-anchor="middle" fill="#6366f1" font-size="9">repo_analyzer.py</text>

  <line x1="210" y1="200" x2="235" y2="200" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arr)"/>

