<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" style="background:#0b1120;font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b1120"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0L0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
  </defs>
  <rect width="1100" height="650" fill="url(#bg)"/>
  <rect width="1100" height="650" fill="url(#grid)"/>

  <text x="30" y="40" fill="#e2e8f0" font-size="22" font-weight="bold">🤖 CoderAgent — AI Autonomous Developer</text>
