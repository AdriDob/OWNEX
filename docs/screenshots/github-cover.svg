<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#0a0a18"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="neon-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#00cc33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg-grad)"/>

  <!-- Grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="880" y1="0" x2="880" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="1040" y1="0" x2="1040" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="1120" y1="0" x2="1120" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="640" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="80" x2="1280" y2="80" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="560" x2="1280" y2="560" stroke="#a855f7" stroke-width="1"/>
  </g>

  <!-- Decorative ring (top-left) -->
  <circle cx="180" cy="220" r="140" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.1"/>
  <circle cx="180" cy="220" r="120" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.08"/>

  <!-- ORION logo mark -->
  <g filter="url(#glow)">
    <!-- C -->
    <path d="M150 180 Q150 155 170 155 L190 155 M150 180 L150 260 Q150 285 170 285 L190 285"
          fill="none" stroke="#a855f7" stroke-width="10" stroke-linecap="round"/>
    <!-- E -->
    <path d="M210 155 L240 155 M210 155 L210 285 M210 220 L235 220 M210 285 L240 285"
          fill="none" stroke="#a855f7" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Eye dot -->
  <circle cx="180" cy="220" r="5" fill="#00ffff" opacity="0.9" filter="url(#soft-glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Main title -->
  <text x="420" y="195" fill="#e8e8f0" font-family="'Courier New', monospace" font-size="52" font-weight="bold" letter-spacing="12">ORION</text>
  <text x="420" y="235" fill="#6b6b80" font-family="'Courier New', monospace" font-size="18" letter-spacing="6">PRIVATE INTELLIGENCE OS</text>

  <!-- Tagline -->
  <text x="420" y="285" fill="#a855f7" font-family="'Courier New', monospace" font-size="13" letter-spacing="4" opacity="0.8">Autonomous Bug Bounty · Financial Intelligence · Security Operations</text>

  <!-- Feature badges -->
  <g transform="translate(420, 330)">
    <rect x="0" y="0" width="180" height="36" rx="6" fill="none" stroke="#00ff41" stroke-width="1.5" opacity="0.3"/>
    <text x="90" y="23" text-anchor="middle" fill="#00ff41" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">1400+ TESTS</text>

    <rect x="200" y="0" width="180" height="36" rx="6" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.3"/>
    <text x="290" y="23" text-anchor="middle" fill="#00ffff" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">100% LOCAL</text>

    <rect x="400" y="0" width="180" height="36" rx="6" fill="none" stroke="#f5a623" stroke-width="1.5" opacity="0.3"/>
    <text x="490" y="23" text-anchor="middle" fill="#f5a623" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">V4.6.0 STABLE</text>
  </g>

  <!-- App icons row -->
  <g transform="translate(420, 410)">
    <text x="0" y="15" fill="#6b6b80" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">APPS:</text>

    <!-- AEGIS -->
    <rect x="80" y="-10" width="100" height="40" rx="8" fill="#0c0c14" stroke="#ff1744" stroke-width="1" opacity="0.8"/>
    <text x="130" y="17" text-anchor="middle" fill="#ff1744" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">AEGIS</text>

    <!-- CATEYE -->
    <rect x="195" y="-10" width="100" height="40" rx="8" fill="#0c0c14" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
    <text x="245" y="17" text-anchor="middle" fill="#a855f7" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">CATEYE</text>

    <!-- ATLAS -->
    <rect x="310" y="-10" width="100" height="40" rx="8" fill="#0c0c14" stroke="#00ffff" stroke-width="1" opacity="0.8"/>
    <text x="360" y="17" text-anchor="middle" fill="#00ffff" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">ATLAS</text>

    <!-- ODYSSEY -->
    <rect x="425" y="-10" width="100" height="40" rx="8" fill="#0c0c14" stroke="#f5a623" stroke-width="1" opacity="0.8"/>
    <text x="475" y="17" text-anchor="middle" fill="#f5a623" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">ODYSSEY</text>

    <!-- MERLIN -->
    <rect x="540" y="-10" width="100" height="40" rx="8" fill="#0c0c14" stroke="#00ff41" stroke-width="1" opacity="0.8"/>
    <text x="590" y="17" text-anchor="middle" fill="#00ff41" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">MERLIN</text>
  </g>

  <!-- Bottom tech stack bar -->
  <g transform="translate(0, 560)">
    <rect width="1280" height="80" fill="#0c0c14" opacity="0.6"/>
    <text x="80" y="30" fill="#6b6b80" font-family="'Courier New', monospace" font-size="9" letter-spacing="2">STACK:</text>
    <text x="80" y="55" fill="#8a8aa0" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">Python</text>
    <text x="180" y="55" fill="#8a8aa0" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">FastAPI</text>
    <text x="280" y="55" fill="#8a8aa0" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">SQLAlchemy</text>
    <text x="410" y="55" fill="#8a8aa0" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">Vue 3</text>
    <text x="490" y="55" fill="#8a8aa0" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">TypeScript</text>
    <text x="590" y="55" fill="#8a8aa0" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">Tailwind v4</text>
    <text x="700" y="55" fill="#8a8aa0" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">SQLite WAL</text>
    <text x="800" y="55" fill="#8a8aa0" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">Ruff</text>
    <text x="860" y="55" fill="#8a8aa0" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">pytest</text>
    <text x="930" y="55" fill="#8a8aa0" font-family="'Courier New', monospace" font-size="10" letter-spacing="2">AES-256-GCM</text>

    <!-- Copyright -->
    <text x="1150" y="55" text-anchor="end" fill="#4a4a60" font-family="'Courier New', monospace" font-size="8" letter-spacing="2">Hecho en ARG · 2026</text>
  </g>

  <!-- Decorative scanline -->
  <rect x="0" y="0" width="1280" height="640" fill="url(#bg-grad)" opacity="0"/>
</svg>