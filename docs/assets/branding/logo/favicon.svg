<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121218"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="1.5"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- Ring 1 (inner) -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#A855F7" stroke-width="2"
           transform="rotate(-12 32 32)" filter="url(#g)"/>

  <!-- Ring 2 (outer) -->
  <ellipse cx="32" cy="32" rx="28" ry="10" fill="none" stroke="#7C3AED" stroke-width="1.2"
           transform="rotate(20 32 32)" opacity="0.6"/>

  <!-- Core -->
  <circle cx="32" cy="32" r="5" fill="#A855F7"/>
  <circle cx="32" cy="32" r="2" fill="#FFFFFF" opacity="0.9"/>

  <!-- Gold dot -->
  <circle cx="18" cy="26" r="1" fill="#F5A623" opacity="0.7"/>
</svg>
