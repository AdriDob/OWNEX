<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- OWNEX Horizontal Logo - Mark + Wordmark -->
  <rect width="320" height="80" fill="#0B0B0B"/>

  <!-- Logo Mark (24x24) -->
  <g transform="translate(12, 28)">
    <circle cx="12" cy="12" r="12" fill="none" stroke="#2D7FF9" stroke-width="0.8" opacity="0.3"/>
    <g stroke="#2D7FF9" stroke-width="0.8" fill="none">
      <path d="M12 4 L12 7"/>
      <path d="M12 17 L12 20"/>
      <path d="M4 12 L7 12"/>
      <path d="M17 12 L20 12"/>
      <path d="M5.5 5.5 L7.5 7.5"/>
      <path d="M14.5 5.5 L16.5 7.5"/>
      <path d="M5.5 16.5 L7.5 14.5"/>
      <path d="M14.5 14.5 L16.5 12.5"/>
    </g>
    <polygon points="12,-10 20.8,-5 20.8,5 12,10 3.2,5 3.2,-5"
             fill="none" stroke="#2D7FF9" stroke-width="1.2" transform="translate(0, 12) scale(0.5)"/>
    <circle cx="12" cy="12" r="2" fill="#2D7FF9" transform="translate(0, 12) scale(0.5)"/>
    <circle cx="12" cy="12" r="9" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="4 2" transform="translate(0, 12) scale(0.5)"/>
  </g>

  <!-- Wordmark "OWNEX" -->
  <text x="52" y="52" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="36" font-weight="300" letter-spacing="2" fill="#FFFFFF">
    OWNEX
  </text>

  <!-- Subtle accent line under wordmark -->
  <line x1="52" y1="56" x2="180" y2="56" stroke="#2D7FF9" stroke-width="1.5" opacity="0.6"/>
  <line x1="52" y1="56" x2="85" y2="56" stroke="#D4AF37" stroke-width="2"/>
</svg>