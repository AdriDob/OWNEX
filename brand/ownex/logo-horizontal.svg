<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <defs>
    <!-- Dark background -->
    <linearGradient id="bgGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080B"/>
      <stop offset="100%" stop-color="#0A0C12"/>
    </linearGradient>

    <!-- Primary blue glow -->
    <radialGradient id="blueGlowH" cx="48" cy="80" r="80">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0"/>
    </radialGradient>

    <!-- O gradient -->
    <linearGradient id="oGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Gold accent -->
    <linearGradient id="goldGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Text glow -->
    <filter id="textGlowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="160" rx="20" fill="url(#bgGradH)"/>

  <!-- Ambient glow behind icon -->
  <circle cx="48" cy="80" r="60" fill="url(#blueGlowH)"/>

  <!-- ═══ LOGOMARK ═══ -->
  <g transform="translate(48,80)">
    <!-- O ring -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#oGradH)" stroke-width="3.5" opacity="0.9"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>
    <!-- Inner cutout -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#60A5FA" stroke-width="0.8" opacity="0.25"/>
    <!-- Gold dot (top-right) -->
    <circle cx="24" cy="-24" r="2.5" fill="url(#goldGradH)" opacity="0.8"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="#60A5FA" opacity="0.4"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" opacity="0.9"/>
    <!-- Scanline -->
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#60A5FA" stroke-width="0.4" opacity="0.12"/>
  </g>

  <!-- ═══ LOGOTYPE ═══ -->
  <text x="100" y="88" 
        font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" 
        font-size="52" 
        font-weight="700" 
        fill="#FFFFFF" 
        letter-spacing="3"
        filter="url(#textGlowH)">
    OWNEX
  </text>

  <!-- Gold underline accent -->
  <line x1="100" y1="100" x2="310" y2="100" stroke="url(#goldGradH)" stroke-width="2" opacity="0.5"/>

  <!-- Tagline -->
  <text x="100" y="118" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="11" 
        font-weight="500" 
        fill="#64748B" 
        letter-spacing="5">
    AUTONOMOUS WORK OS
  </text>
</svg>