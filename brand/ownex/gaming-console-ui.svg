<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Dark gaming console background -->
    <linearGradient id="conBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05060A"/>
      <stop offset="50%" stop-color="#080B15"/>
      <stop offset="100%" stop-color="#030408"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="conGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.3" opacity="0.3"/>
    </pattern>

    <!-- Scanline overlay -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000000" opacity="0.03"/>
    </pattern>

    <!-- Blue glow -->
    <radialGradient id="conBlue" cx="25%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold glow -->
    <radialGradient id="conGold" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Card glass -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.5)"/>
      <stop offset="100%" stop-color="rgba(15,23,42,0.2)"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="conGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="conGlowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#conBg)"/>
  <rect width="1920" height="1080" fill="url(#conGrid)"/>
  <rect width="1920" height="1080" fill="url(#scanlines)"/>
  <rect width="1920" height="1080" fill="url(#conBlue)"/>
  <rect width="1920" height="1080" fill="url(#conGold)"/>

  <!-- ═══ TOP BAR ═══ -->
