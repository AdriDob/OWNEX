<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark command center background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080B"/>
      <stop offset="50%" stop-color="#0A0C12"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Primary blue glow -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#1E40AF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Core O gradient -->
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Gold accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0L0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.4" opacity="0.3"/>
    </pattern>

    <!-- Glow filters -->
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="96" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <circle cx="256" cy="256" r="200" fill="url(#blueGlow)"/>

  <!-- Outer orbital ring -->
  <ellipse cx="256" cy="256" rx="170" ry="52" fill="none" stroke="#3B82F6" stroke-width="0.8" 
           transform="rotate(-12 256 256)" opacity="0.25"/>
  <ellipse cx="256" cy="256" rx="170" ry="52" fill="none" stroke="#3B82F6" stroke-width="0.8"
           stroke-dasharray="4 12" transform="rotate(168 256 256)" opacity="0.15"/>

  <!-- Middle orbital ring -->
  <ellipse cx="256" cy="256" rx="140" ry="44" fill="none" stroke="#60A5FA" stroke-width="1.2"
           transform="rotate(8 256 256)" opacity="0.35"/>
  <circle cx="172" cy="228" r="2" fill="#F59E0B" opacity="0.6"/>
  <circle cx="340" cy="284" r="2" fill="#60A5FA" opacity="0.6"/>

  <!-- Inner orbital ring -->
  <ellipse cx="256" cy="256" rx="110" ry="34" fill="none" stroke="#93C5FD" stroke-width="1.5"
           transform="rotate(-5 256 256)" opacity="0.4"/>

  <!-- Radar sweep -->
  <path d="M256 256 L420 160 A 180 180 0 0 1 430 220 Z" fill="url(#goldGrad)" opacity="0.06"/>

  <!-- Constellation dots -->
  <g fill="#60A5FA" opacity="0.2">
    <circle cx="90" cy="120" r="1"/>
    <circle cx="420" cy="390" r="1"/>
    <circle cx="140" cy="400" r="0.8"/>
    <circle cx="370" cy="110" r="0.8"/>
    <circle cx="80" cy="280" r="0.7"/>
    <circle cx="432" cy="230" r="0.7"/>
  </g>
  <line x1="90" y1="120" x2="172" y2="228" stroke="#3B82F6" stroke-width="0.3" opacity="0.08"/>
  <line x1="420" y1="390" x2="340" y2="284" stroke="#3B82F6" stroke-width="0.3" opacity="0.08"/>

  <!-- ═══ CORE O LOGOMARK ═══ -->
  <g transform="translate(256,256)">

    <!-- Outer glow -->
    <circle cx="0" cy="0" r="62" fill="#3B82F6" opacity="0.06" filter="url(#glowStrong)"/>

    <!-- O ring (outer) -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="url(#oGrad)" stroke-width="5" opacity="0.9" filter="url(#glowSoft)"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.15"/>

    <!-- O ring (inner cutout) -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#60A5FA" stroke-width="1" opacity="0.3"/>

    <!-- Gold accent dot (top-right of O) -->
    <circle cx="36" cy="-36" r="4" fill="url(#goldGrad)" opacity="0.8" filter="url(#glowSoft)"/>
    <circle cx="36" cy="-36" r="1.5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Inner pulsing dot -->
    <circle cx="0" cy="0" r="10" fill="#3B82F6" opacity="0.15" filter="url(#glowStrong)"/>
    <circle cx="0" cy="0" r="6" fill="#60A5FA" opacity="0.4"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-1" cy="-1" r="1" fill="#FFFFFF" opacity="1"/>

    <!-- Scanline across O -->
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#60A5FA" stroke-width="0.5" opacity="0.15"/>
  </g>
</svg>