<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A0A0E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="blueCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="35%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="centerDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="12" fill="url(#bgGlow)"/>
  
  <!-- Ambient glow -->
  <circle cx="32" cy="32" r="28" fill="url(#blueCore)" opacity="0.1"/>
  
  <!-- Orbital Ring 2 -->
  <ellipse cx="32" cy="32" rx="26" ry="8" fill="none" stroke="url(#ring2)" stroke-width="0.8" 
           transform="rotate(12 32 32)" opacity="0.5" filter="url(#glowSoft)"/>
  
  <!-- Orbital Ring 1 -->
  <ellipse cx="32" cy="32" rx="18" ry="6" fill="none" stroke="url(#ring1)" stroke-width="1.2" 
           transform="rotate(-8 32 32)" filter="url(#glowSoft)"/>
  
  <!-- Gold accent dot -->
  <circle cx="18" cy="26" r="1.2" fill="#F59E0B" opacity="0.7" filter="url(#glowSoft)"/>
  <circle cx="46" cy="38" r="1" fill="#60A5FA" opacity="0.6"/>
  
  <!-- Core -->
  <circle cx="32" cy="32" r="5" fill="url(#centerDot)" filter="url(#coreGlow)"/>
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="31" cy="31" r="1" fill="#60A5FA" opacity="1"/>
</svg>