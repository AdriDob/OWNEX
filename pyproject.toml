[project]
name = "cateye"
version = "4.6.0"
description = "Private intelligence system for bug bounty"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "E731", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["SIM"]
"desktop/service.py" = ["N802"]
"alembic/*" = ["E402", "UP035", "UP007", "W291", "I001"]
"database/db.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = false
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "skip"

# Platform-specific false positives
[[tool.mypy.overrides]]
module = [
    "desktop.main_desktop",
    "desktop.updater",
    "cores.license.hardware",
    "cores.platform.system",
]
ignore_errors = true

# Known false positives in agent system
[[tool.mypy.overrides]]
module = [
    "cores.agents.financial",
    "cores.agents.memory",
    "cores.agents.coordinator",
    "cores.agents.exploit",
    "cores.agents.documentation",
    "cores.agents.research",
    "cores.agents.base",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
