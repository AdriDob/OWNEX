[project]
name = "ownex-omega"
version = "7.0.0"
description = "OWNEX OMEGA — Autonomous Work Operating Platform"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.19.0",
]

[tool.setuptools.packages.find]
include = ["core*", "cores*", "api*", "database*", "extensions*"]
exclude = ["extensions.*.*"]

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "E731", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["SIM"]
"desktop/service.py" = ["N802"]
"alembic/*" = ["E402", "UP035", "UP007", "W291", "I001"]
"database/db.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = false
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "skip"

# Platform-specific false positives
[[tool.mypy.overrides]]
module = [
    "desktop.main_desktop",
    "desktop.updater",
    "cores.license.hardware",
    "cores.platform.system",
]
ignore_errors = true

# Known false positives in agent system
[[tool.mypy.overrides]]
module = [
    "cores.agents.financial",
    "cores.agents.memory",
    "cores.agents.coordinator",
    "cores.agents.exploit",
    "cores.agents.documentation",
    "cores.agents.research",
    "cores.agents.base",
]
ignore_errors = true

# Gradual type checking - enable for safer modules
[[tool.mypy.overrides]]
module = [
    "cores.obsidian",
    "cores.wear_os",
    "cores.productivity",
    "cores.onboarding",
    "cores.setup.steps.enhanced_personalization",
]
check_untyped_defs = true
disallow_any_unimported = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --timeout=60"
markers = [
    "integration: end-to-end pipeline tests that may need external services",
    "slow: long-running tests (network/recon); use -m 'not slow' for CI smoke",
    "network: tests that require internet access",
    "serial: tests that must run sequentially (not parallel-safe)",
]