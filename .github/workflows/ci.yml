name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.6"
          args: "check ."

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -q
      - run: python -m mypy core/opportunity/scoring.py core/scheduler/scheduler.py core/scheduler/jobs.py api/main.py

  test-fast:
    name: Fast Tests (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -q
      - run: |
          python scripts/dev test-fast
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fast
          path: htmlcov/

  test-core:
    name: Core Tests (parallel, no network)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: pip install -r requirements.txt -q
      - name: Build frontend artifacts required by packaging tests
        run: npm ci --silent && npm run build
      - name: Install recon binaries used by tool-resolution tests
        run: |
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/katana/cmd/katana@latest
          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: System deps for desktop tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 xvfb
      - env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a python -m pytest -n auto \
            --ignore=tests/test_security.py \
            --ignore=tests/test_vision_gateway.py \
            --ignore=tests/test_scheduler.py \
            --ignore=tests/test_api_endpoints.py \
            --cov=cores --cov=core --cov-report=term-missing:skip-covered \
            --cov-fail-under=80 \
            --timeout=60 -q tests/
  test-frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent
        working-directory: ${{ github.workspace }}
      - run: npm run lint --if-present
      - run: npm run build --if-present

  verify:
    name: Verify System
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, test-fast, test-core, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -q
      - run: python -m core.scripts.verify_system --quick
      - run: 'test -f frontend/dist/index.html && echo "frontend/dist/index.html: OK"'