name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-ruff@v2
        with:
          version: "0.15"
      - run: ruff check . --select=E,F,W,I,N,UP,B,SIM

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -q
      - run: python -m mypy core/opportunity/scoring.py core/scheduler/scheduler.py core/scheduler/jobs.py api/main.py

  test-fast:
    name: Fast Tests (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -q
      - run: |
          python scripts/dev test-fast
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fast
          path: htmlcov/

  test-core:
    name: Core Tests (parallel, no network)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -q
      - name: System deps para Qt offscreen (test_desktop_native)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0
      - env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -n auto \
            --ignore=tests/test_security.py \
            --ignore=tests/test_vision_gateway.py \
            --ignore=tests/test_scheduler.py \
            --ignore=tests/test_api_endpoints.py \
            --cov=cores --cov=core --cov-report=term-missing:skip-covered \
            --cov-fail-under=80 \
            --timeout=60 -q tests/

  test-frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --silent
        working-directory: ${{ github.workspace }}
      - run: npm run lint --if-present
      - run: npm run build --if-present

  verify:
    name: Verify System
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, test-fast, test-core, test-frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -q
      - run: python -m core.scripts.verify_system --quick
      - run: 'test -f frontend/dist/index.html && echo "frontend/dist/index.html: OK"'