name: OWNEX Tauri Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js (for frontend + Tauri CLI) ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # ── Rust (for Tauri) ──
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # ── Python (for backend sidecar) ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt
          .venv\Scripts\python.exe -m pip install pyinstaller

      # ── Build frontend ──
      - name: Build frontend (Vue + Vite)
        run: |
          cd frontend
          npm run build
          cd ..
        env:
          VITE_API_URL: ''

      # ── Build backend sidecar ──
      - name: Build backend sidecar (PyInstaller)
        run: |
          .venv\Scripts\pyinstaller.exe OWNEX-Backend.spec --clean --noconfirm

      - name: Validate sidecar exists
        run: |
          $exe = "dist\ownex-backend.exe"
          if (!(Test-Path $exe)) { throw "Sidecar .exe not found: $exe (ONEFILE output)" }
          $size = (Get-Item $exe).Length
          Write-Host "Sidecar size: $([math]::Round($size / 1MB, 2)) MB"
          # Guard: a self-contained backend must embed the whole runtime.
          # The broken 2026-08-24 stub was 19.91 MB; real payload is >100 MB.
          if ($size -lt 50MB) { throw "Sidecar suspiciously small ($([math]::Round($size / 1MB, 2)) MB) — likely missing _internal payload" }

      - name: Smoke test sidecar runtime (imports + health)
        run: |
          $exe = "dist\ownex-backend.exe"
          $err = "$env:RUNNER_TEMP\sidecar_err.txt"
          $p = Start-Process $exe -ArgumentList "--port","8199" -PassThru -RedirectStandardError $err
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try { Invoke-RestMethod "http://127.0.0.1:8199/api/health" -TimeoutSec 3 | Out-Null; $ok = $true; break } catch {}
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) {
            Write-Host "=== sidecar stderr ==="
            Get-Content $err -Tail 20 -ErrorAction SilentlyContinue | ForEach-Object { $_ }
            throw "Sidecar failed to serve /api/health on :8199 — broken imports or missing modules. Release blocked."
          }
          Write-Host "Sidecar runtime smoke: PASS (healthy in $($i*2)s)"

      # ── Copy sidecar to Tauri binaries directory ──
      # Tauri expects sidecar at src-tauri/binaries/<name>-<target-triple>.exe
      - name: Prepare Tauri sidecar
        run: |
          $target = "x86_64-pc-windows-msvc"
          $destDir = "src-tauri\binaries"
          $src = "dist\ownex-backend.exe"
          $dest = "$destDir\ownex-backend-$target.exe"
          if (!(Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force }
          Copy-Item $src $dest -Force
          Write-Host "Sidecar copied to: $dest"
          Get-ChildItem $destDir | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

      # ── Tauri build ──
      - name: Install Tauri system dependencies
        run: |
          # WebView2 is pre-installed on windows-latest
          # MSVC build tools are pre-installed on windows-latest
          Write-Host "System dependencies verified"

      - name: Tauri build
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Verify Tauri output
        run: |
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Write-Host "MSI found: $($msi.Name) ($([math]::Round($msi.Length / 1MB, 2)) MB)"
          } else {
            Write-Host "WARNING: MSI not found"
          }
          if ($nsis) {
            Write-Host "NSIS found: $($nsis.Name) ($([math]::Round($nsis.Length / 1MB, 2)) MB)"
          } else {
            Write-Host "WARNING: NSIS installer not found"
          }

      # ── Calculate checksums ──
      - name: Calculate SHA256 checksums
        run: |
          $files = Get-ChildItem "src-tauri\target\release\bundle\*\*.*" -Include "*.msi","*.exe" -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash
            Write-Host "$hash  $($f.Name)"
            $hash | Out-File "$($f.FullName).sha256" -Encoding ascii
          }

      # ── Upload artifacts ──
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OWNEX-Tauri-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/**/*.sha256
          if-no-files-found: warn

      - name: Upload sidecar (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: OWNEX-Backend-Sidecar
          path: |
            dist/ownex-backend.exe
          if-no-files-found: warn
