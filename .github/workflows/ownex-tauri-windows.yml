name: OWNEX Tauri Multi-Platform Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Build backend sidecar for each platform ──
  build-backend-sidecar:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ownex-backend-windows
            pyinstaller_cmd: .venv\Scripts\pyinstaller.exe
            python_cmd: .venv\Scripts\python.exe
            sidecar_name: ownex-backend.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ownex-backend-linux
            pyinstaller_cmd: .venv/bin/pyinstaller
            python_cmd: .venv/bin/python
            sidecar_name: ownex-backend
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ownex-backend-macos
            pyinstaller_cmd: .venv/bin/pyinstaller
            python_cmd: .venv/bin/python
            sidecar_name: ownex-backend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          ${{ matrix.python_cmd }} -m pip install --upgrade pip
          ${{ matrix.python_cmd }} -m pip install -r requirements.txt
          ${{ matrix.python_cmd }} -m pip install pyinstaller

      # ── Build backend sidecar ──
      - name: Build backend sidecar (PyInstaller)
        run: |
          ${{ matrix.pyinstaller_cmd }} OWNEX-Backend.spec --clean --noconfirm

      - name: Validate sidecar exists
        run: |
          $exe = "dist/${{ matrix.sidecar_name }}"
          if (!(Test-Path $exe)) { throw "Sidecar not found: $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "Sidecar size: $([math]::Round($size / 1MB, 2)) MB"
          if ($size -lt 50MB) { throw "Sidecar suspiciously small ($([math]::Round($size / 1MB, 2)) MB)" }
        shell: pwsh

      # Smoke test sidecar (Windows only - other platforms run Tauri build which tests it)
      - name: Smoke test sidecar runtime
        if: runner.os == 'Windows'
        run: |
          $exe = "dist\ownex-backend.exe"
          $err = "$env:RUNNER_TEMP\sidecar_err.txt"
          $p = Start-Process $exe -ArgumentList "--port","8199" -PassThru -RedirectStandardError $err
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            try { Invoke-RestMethod "http://127.0.0.1:8199/api/health" -TimeoutSec 3 | Out-Null; $ok = $true; break } catch {}
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) {
            Write-Host "=== sidecar stderr ==="
            Get-Content $err -Tail 20 -ErrorAction SilentlyContinue | ForEach-Object { $_ }
            throw "Sidecar failed /api/health"
          }
          Write-Host "Sidecar smoke: PASS"
        shell: pwsh

      # ── Copy sidecar to Tauri binaries directory ──
      - name: Prepare Tauri sidecar
        run: |
          $destDir = "src-tauri\binaries"
          $src = "dist\${{ matrix.sidecar_name }}"
          $dest = "$destDir\${{ matrix.sidecar_name }}"
          if (!(Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force }
          Copy-Item $src $dest -Force
          Write-Host "Sidecar copied to: $dest"
          Get-ChildItem $destDir | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
        shell: pwsh

      # Upload sidecar artifact
      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.sidecar_name }}
          if-no-files-found: error

  # ── Tauri build for each platform ──
  build-tauri:
    needs: build-backend-sidecar
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: OWNEX-Tauri-Windows
            artifact_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/**/*.sha256
          - os: ubuntu-latest
            artifact_name: OWNEX-Tauri-Linux
            artifact_paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/**/*.sha256
          - os: macos-latest
            artifact_name: OWNEX-Tauri-macOS
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/**/*.sha256
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download sidecar artifact
      - name: Download sidecar
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os == 'windows-latest' && 'ownex-backend-windows' || matrix.os == 'ubuntu-latest' && 'ownex-backend-linux' || 'ownex-backend-macos' }}
          path: dist

      # Copy sidecar to Tauri binaries
      - name: Prepare Tauri sidecar (Windows)
        if: runner.os == 'Windows'
        run: |
          $destDir = "src-tauri\binaries"
          $src = "dist\ownex-backend.exe"
          $dest = "$destDir\ownex-backend.exe"
          Copy-Item $src $dest -Force
          Write-Host "Sidecar ready: $dest"
        shell: pwsh

      - name: Prepare Tauri sidecar (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          destDir="src-tauri/binaries"
          src="dist/ownex-backend"
          dest="$destDir/ownex-backend"
          mkdir -p "$destDir"
          cp "dist/ownex-backend" "$dest"
          chmod +x "$dest"
          echo "Sidecar ready: $dest"
          ls -la "$destDir"

      # ── Node.js ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # Build frontend
      - name: Build frontend (Vue + Vite)
        run: |
          cd frontend
          npm run build
          cd ..
        env:
          VITE_API_URL: ''

      # Linux deps
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      # macOS deps (notarization prep)
      - name: macOS setup
        if: runner.os == 'macOS'
        run: |
          echo "macOS build - ensure Apple Developer ID is configured for notarization"
          # Notarization would go here with Apple Developer ID

      # Tauri build
      - name: Tauri build
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      # Verify output
      - name: Verify Tauri output
        run: |
          echo "=== Tauri build output ==="
          find src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app" \) -exec ls -lh {} \;

      # Calculate checksums
      - name: Calculate SHA256 checksums
        run: |
          find src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) -exec sh -c 'sha256sum "$1" > "$1.sha256"' _ {} \;

      # Upload artifacts
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_paths }}
          if-no-files-found: warn

      # Upload checksums
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-checksums
          path: src-tauri/target/release/bundle/**/*.sha256
          if-no-files-found: warn

