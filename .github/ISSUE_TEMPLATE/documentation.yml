name: Documentation Issue
about: Report missing, unclear, or incorrect documentation
title: '[DOCS] '
labels: documentation
body:
  - type: markdown
    attributes:
      value: |
        Help us improve OWNEX documentation!
  - type: textarea
    id: problem
    attributes:
      label: Documentation Problem
      description: What is missing, unclear, or incorrect?
      placeholder: "The SETUP_GUIDE.md doesn't mention Docker installation..."
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: File/Location
      description: Which file or section? (e.g., docs/SETUP_GUIDE.md, README.md#quick-start)
      placeholder: "docs/SETUP_GUIDE.md"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: How should this be fixed? What should be added/changed?
      placeholder: "Add a Docker installation section with docker-compose example..."
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Missing content
        - Incorrect/outdated
        - Unclear/confusing
        - Broken link
        - Formatting issue
        - Translation needed
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked if this exists in another document
          required: true
        - label: I can contribute a fix (PR welcome)
          required: false