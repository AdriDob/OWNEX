name: Bug Report (Frontend)
description: Report a bug in the OWNEX frontend (Vue 3, Mission Control, MERLIN UI)
title: "[BUG-FRONTEND] "
labels: ["bug", "frontend"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a frontend bug! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I click on..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Go to Mission Control
        2. Click on Security Cycle
        3. Observe error in console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: "The Security Cycle dashboard should load..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: "Blank screen with console error..."
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Video
      description: Drag and drop screenshots or screen recordings here.
      placeholder: "Attach screenshots..."
  - type: input
    id: browser
    attributes:
      label: Browser & Version
      description: "e.g., Chrome 126, Firefox 127, Safari 17"
      placeholder: "Chrome 126.0.6478.127"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: "e.g., Windows 11, macOS 14, Ubuntu 24.04"
      placeholder: "Windows 11 Pro 23H2"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node Version
      description: "Run `node --version`"
      placeholder: "v20.15.0"
    validations:
      required: true
  - type: input
    id: ownExVersion
    attributes:
      label: OWNEX Version
      description: "Version from package.json or Git tag"
      placeholder: "7.0.0"
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console Errors
      description: Paste any relevant console errors (F12 → Console)
      placeholder: |
        TypeError: Cannot read property 'data' of undefined
        at SecurityDashboard.vue:45
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues
          required: true
        - label: I have provided a minimal reproduction
          required: true
        - label: I have included console errors
          required: true
        - label: This is not a styling-only issue
          required: false