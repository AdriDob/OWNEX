<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D7FF9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E5BC9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background deep dark -->
  <rect width="512" height="512" fill="#0B0B0B"/>

  <!-- Abstract navigation paths - convergence -->
  <path d="M 100 256 L 200 156 L 256 100 L 312 156 L 412 256" fill="none" stroke="#2D7FF9" stroke-width="3" opacity="0.6"/>
  <path d="M 100 256 L 200 356 L 256 412 L 312 356 L 412 256" fill="none" stroke="#2D7FF9" stroke-width="3" opacity="0.6"/>

  <!-- Abstract O/X convergence at center -->
  <circle cx="256" cy="256" r="60" fill="none" stroke="#2D7FF9" stroke-width="4"/>

  <!-- North star - opportunity indicator -->
  <circle cx="256" cy="256" r="25" fill="#2D7FF9"/>

  <!-- Center precision point -->
  <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>

  <!-- Orbital paths - subtle -->
  <ellipse cx="256" cy="256" rx="180" ry="50" fill="none" stroke="#2D7FF9" stroke-width="1" opacity="0.3" transform="rotate(45 256 256)"/>
  <ellipse cx="256" cy="256" rx="180" ry="50" fill="none" stroke="#2D7FF9" stroke-width="1" opacity="0.3" transform="rotate(-45 256 256)"/>

  <!-- Navigation triangles - subtle indicators -->
  <polygon points="256,30 266,50 246,50" fill="#D4AF37" opacity="0.8"/>
  <polygon points="256,482 266,462 246,462" fill="#D4AF37" opacity="0.8"/>
  <polygon points="30,256 50,266 50,246" fill="#D4AF37" opacity="0.8"/>
  <polygon points="482,256 462,266 462,246" fill="#D4AF37" opacity="0.8"/>
</svg>