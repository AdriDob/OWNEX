<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6EE7FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CF2B5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background dark -->
  <rect width="512" height="512" fill="#0B0F19"/>

  <!-- Abstract orbital ring - main shape -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#grad1)" stroke-width="8"/>

  <!-- Inner orbital ring -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#grad2)" stroke-width="4"/>

  <!-- Core hexagon -->
  <polygon points="256,160 330,200 330,280 256,320 182,280 182,200" fill="none" stroke="url(#grad1)" stroke-width="6"/>

  <!-- Inner core -->
  <circle cx="256" cy="256" r="40" fill="url(#grad1)"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>

  <!-- Precision markers - 8 positions around the ring -->
  <circle cx="256" cy="116" r="6" fill="#5CF2B5"/>
  <circle cx="256" cy="396" r="6" fill="#5CF2B5"/>
  <circle cx="116" cy="256" r="6" fill="#5CF2B5"/>
  <circle cx="396" cy="256" r="6" fill="#5CF2B5"/>
  <circle cx="157" cy="157" r="4" fill="#6EE7FF"/>
  <circle cx="355" cy="157" r="4" fill="#6EE7FF"/>
  <circle cx="157" cy="355" r="4" fill="#6EE7FF"/>
  <circle cx="355" cy="355" r="4" fill="#6EE7FF"/>

  <!-- Subtle orbital paths - thin lines -->
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.3" transform="rotate(45 256 256)"/>
  <ellipse cx="256" cy="256" rx="180" ry="60" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.3" transform="rotate(-45 256 256)"/>

  <!-- Navigation triangles - 4 positions -->
  <polygon points="256,60 266,80 246,80" fill="#00D4FF" opacity="0.8"/>
  <polygon points="256,452 266,432 246,432" fill="#00D4FF" opacity="0.8"/>
  <polygon points="60,256 80,266 80,246" fill="#00D4FF" opacity="0.8"/>
  <polygon points="452,256 432,266 432,246" fill="#00D4FF" opacity="0.8"/>

  <!-- Subtle corner accents -->
  <rect x="40" y="40" width="24" height="2" fill="#111827"/>
  <rect x="40" y="40" width="2" height="24" fill="#111827"/>
  <rect x="448" y="40" width="24" height="2" fill="#111827"/>
  <rect x="448" y="40" width="2" height="24" fill="#111827"/>
  <rect x="40" y="470" width="24" height="2" fill="#111827"/>
  <rect x="40" y="448" width="2" height="24" fill="#111827"/>
  <rect x="448" y="470" width="24" height="2" fill="#111827"/>
  <rect x="448" y="448" width="2" height="24" fill="#111827"/>
</svg>