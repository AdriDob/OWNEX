<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6EE7FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background dark -->
  <rect width="512" height="512" fill="#0B0F19"/>

  <!-- Single orbital ring - main shape -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#grad1)" stroke-width="12"/>

  <!-- Core hexagon -->
  <polygon points="256,160 330,200 330,280 256,320 182,280 182,200" fill="none" stroke="url(#grad1)" stroke-width="8"/>

  <!-- Inner core -->
  <circle cx="256" cy="256" r="50" fill="url(#grad1)"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="15" fill="#ffffff"/>
</svg>