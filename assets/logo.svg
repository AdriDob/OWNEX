<svg xmlns="http://www.w3.org/2003/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f0ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#grad1)" stroke-width="4" filter="url(#glow)"/>

  <!-- Inner ring -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="url(#grad2)" stroke-width="3"/>

  <!-- Core circle -->
  <circle cx="200" cy="200" r="80" fill="url(#grad1)" filter="url(#glow)"/>

  <!-- Inner core -->
  <circle cx="200" cy="200" r="50" fill="#00ff88" filter="url(#glow)"/>

  <!-- Center dot -->
  <circle cx="200" cy="200" r="20" fill="#ffffff" filter="url(#glow)"/>

  <!-- Orbit lines (tech feel) -->
  <ellipse cx="200" cy="200" rx="180" ry="60" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.5" transform="rotate(15 200 200)"/>
  <ellipse cx="200" cy="200" rx="180" ry="60" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.5" transform="rotate(-15 200 200)"/>
  <ellipse cx="200" cy="200" rx="60" ry="180" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.5" transform="rotate(15 200 200)"/>
  <ellipse cx="200" cy="200" rx="60" ry="180" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.5" transform="rotate(-15 200 200)"/>

  <!-- Data points (tech feel) -->
  <circle cx="200" cy="50" r="8" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="200" cy="350" r="8" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="50" cy="200" r="8" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="350" cy="200" r="8" fill="#00ff88" filter="url(#glow)"/>

  <!-- Corner accents -->
  <circle cx="100" cy="100" r="4" fill="#00f0ff" opacity="0.7"/>
  <circle cx="300" cy="100" r="4" fill="#00f0ff" opacity="0.7"/>
  <circle cx="100" cy="300" r="4" fill="#00f0ff" opacity="0.7"/>
  <circle cx="300" cy="300" r="4" fill="#00f0ff" opacity="0.7"/>
</svg>