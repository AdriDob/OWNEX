<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050505;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080808;stop-opacity:1" />
    </linearGradient>
    <pattern id="heroGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.08"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#heroGrad)"/>
  <rect width="1920" height="1080" fill="url(#heroGrid)"/>
  
  <!-- Central hero element -->
  <circle cx="960" cy="540" r="250" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.3"/>
  <circle cx="960" cy="540" r="180" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.2"/>
  <circle cx="960" cy="540" r="120" fill="#3B82F6" opacity="0.08"/>
  
  <!-- Data flow lines -->
  <line x1="160" y1="540" x2="710" y2="540" stroke="#3B82F6" stroke-width="1" opacity="0.25"/>
  <line x1="1210" y1="540" x2="1760" y2="540" stroke="#3B82F6" stroke-width="1" opacity="0.25"/>
  <line x1="960" y1="160" x2="960" y2="420" stroke="#3B82F6" stroke-width="1" opacity="0.25"/>
  <line x1="960" y1="660" x2="960" y2="920" stroke="#3B82F6" stroke-width="1" opacity="0.25"/>
  
  <!-- Central core -->
  <circle cx="960" cy="540" r="80" fill="#3B82F6" opacity="0.15"/>
  <circle cx="960" cy="540" r="50" fill="#3B82F6" opacity="0.25"/>
  <circle cx="960" cy="540" r="25" fill="#3B82F6" opacity="0.4" filter="url(#glow)"/>
  
  <!-- Accent points -->
  <circle cx="710" cy="540" r="6" fill="#F59E0B" opacity="0.8" filter="url(#glow)"/>
  <circle cx="1210" cy="540" r="6" fill="#F59E0B" opacity="0.8" filter="url(#glow)"/>
  <circle cx="960" cy="420" r="6" fill="#F59E0B" opacity="0.8" filter="url(#glow)"/>
  <circle cx="960" cy="660" r="6" fill="#F59E0B" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Text -->
  <text x="960" y="980" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#F0F0F0" opacity="0.9" letter-spacing="4">OWNEX OMEGA</text>
  <text x="960" y="1015" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#3B82F6" opacity="0.8" letter-spacing="2">AUTONOMOUS WORK OPERATING SYSTEM</text>
</svg>