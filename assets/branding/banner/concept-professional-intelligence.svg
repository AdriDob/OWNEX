<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Professional dark background -->
    <linearGradient id="piBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030406"/>
      <stop offset="50%" stop-color="#06080C"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Card surface -->
    <linearGradient id="piCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14161E"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </linearGradient>

    <!-- Professional blue -->
    <linearGradient id="piBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Professional gold -->
    <linearGradient id="piGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Success green -->
    <linearGradient id="piGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#piBg)"/>

  <!-- ═══ PROFESSIONAL INTELLIGENCE PLATFORM CONCEPT ═══ -->

  <!-- Header bar -->
  <rect x="40" y="30" width="1120" height="60" rx="8" fill="url(#piCard)" stroke="#1A1A2E" stroke-width="1"/>
  
  <!-- Logo left -->
  <g transform="translate(70, 60)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#60A5FA" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#60A5FA"/>
  </g>
  
  <text x="100" y="65" font-family="'Inter', sans-serif" font-size="16" fill="#FFFFFF" font-weight="600">OWNEX OMEGA</text>
  
  <!-- Navigation -->
  <text x="300" y="65" font-family="'Inter', sans-serif" font-size="13" fill="#60A5FA">Dashboard</text>
  <text x="400" y="65" font-family="'Inter', sans-serif" font-size="13" fill="#64748B">Agents</text>
  <text x="480" y="65" font-family="'Inter', sans-serif" font-size="13" fill="#64748B">Opportunities</text>
  <text x="600" y="65" font-family="'Inter', sans-serif" font-size="13" fill="#64748B">Revenue</text>
  <text x="700" y="65" font-family="'Inter', sans-serif" font-size="13" fill="#64748B">Knowledge</text>
  
  <!-- User profile right -->
  <circle cx="1120" cy="60" r="18" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
  <text x="1120" y="65" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">AD</text>

  <!-- Main dashboard grid -->
  
  <!-- KPI Cards row -->
  <rect x="40" y="110" width="260" height="100" rx="8" fill="url(#piCard)" stroke="#1A1A2E" stroke-width="1"/>
  <text x="60" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">TOTAL REVENUE</text>
  <text x="60" y="175" font-family="'Inter', sans-serif" font-size="28" fill="#FFFFFF" font-weight="600">$12,400</text>
  <text x="60" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#22C55E">+12% this week</text>

  <rect x="320" y="110" width="260" height="100" rx="8" fill="url(#piCard)" stroke="#1A1A2E" stroke-width="1"/>
  <text x="340" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">ACTIVE AGENTS</text>
  <text x="340" y="175" font-family="'Inter', sans-serif" font-size="28" fill="#FFFFFF" font-weight="600">6</text>
  <text x="340" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#60A5FA">All operational</text>

  <rect x="600" y="110" width="260" height="100" rx="8" fill="url(#piCard)" stroke="#1A1A2E" stroke-width="1"/>
  <text x="620" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">OPPORTUNITIES</text>
  <text x="620" y="175" font-family="'Inter', sans-serif" font-size="28" fill="#FFFFFF" font-weight="600">47</text>
  <text x="620" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#F59E0B">12 high-value</text>

  <rect x="880" y="110" width="280" height="100" rx="8" fill="url(#piCard)" stroke="#1A1A2E" stroke-width="1"/>
  <text x="900" y="140" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">SYSTEM HEALTH</text>
  <text x="900" y="175" font-family="'Inter', sans-serif" font-size="28" fill="#22C55E" font-weight="600">99.9%</text>
  <text x="900" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Uptime: 47 days</text>

  <!-- Main content area -->
  
  <!-- Agent Activity Chart -->
  <rect x="40" y="230" width="540" height="250" rx="8" fill="url(#piCard)" stroke="#1A1A2E" stroke-width="1"/>
  <text x="60" y="260" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">Agent Activity</text>
  
  <!-- Simple chart visualization -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="30" height="40" fill="#3B82F6" opacity="0.6"/>
    <rect x="40" y="0" width="30" height="55" fill="#3B82F6" opacity="0.7"/>
    <rect x="80" y="0" width="30" height="35" fill="#3B82F6" opacity="0.5"/>
    <rect x="120" y="0" width="30" height="60" fill="#3B82F6" opacity="0.8"/>
    <rect x="160" y="0" width="30" height="45" fill="#3B82F6" opacity="0.6"/>
    <rect x="200" y="0" width="30" height="70" fill="#3B82F6" opacity="0.9"/>
    <rect x="240" y="0" width="30" height="50" fill="#3B82F6" opacity="0.7"/>
    <rect x="280" y="0" width="30" height="65" fill="#3B82F6" opacity="0.8"/>
    <rect x="320" y="0" width="30" height="40" fill="#3B82F6" opacity="0.6"/>
    <rect x="360" y="0" width="30" height="55" fill="#3B82F6" opacity="0.7"/>
    <rect x="400" y="0" width="30" height="75" fill="#F59E0B" opacity="0.9"/>
    <rect x="440" y="0" width="30" height="60" fill="#3B82F6" opacity="0.8"/>
  </g>
  
  <!-- Chart labels -->
  <text x="60" y="475" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Mon</text>
  <text x="140" y="475" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Tue</text>
  <text x="220" y="475" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Wed</text>
  <text x="300" y="475" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Thu</text>
  <text x="380" y="475" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Fri</text>
  <text x="460" y="475" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Sat</text>

  <!-- Opportunities List -->
  <rect x="600" y="230" width="560" height="250" rx="8" fill="url(#piCard)" stroke="#1A1A2E" stroke-width="1"/>
  <text x="620" y="260" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">High-Value Opportunities</text>
  
  <!-- Opportunity items -->
  <g transform="translate(620, 290)">
    <rect x="0" y="0" width="520" height="40" rx="4" fill="#1E293B" fill-opacity="0.5"/>
    <text x="15" y="25" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF">IDOR - Enterprise X</text>
    <text x="350" y="25" font-family="'Inter', sans-serif" font-size="11" fill="#F59E0B">$1,200</text>
    <text x="420" y="25" font-family="'Inter', sans-serif" font-size="11" fill="#60A5FA">87%</text>
    <circle cx="500" cy="20" r="4" fill="#22C55E"/>
  </g>
  
  <g transform="translate(620, 340)">
    <rect x="0" y="0" width="520" height="40" rx="4" fill="#1E293B" fill-opacity="0.5"/>
    <text x="15" y="25" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF">SSRF - API Gateway Y</text>
    <text x="350" y="25" font-family="'Inter', sans-serif" font-size="11" fill="#F59E0B">$800</text>
    <text x="420" y="25" font-family="'Inter', sans-serif" font-size="11" fill="#60A5FA">65%</text>
    <circle cx="500" cy="20" r="4" fill="#F59E0B"/>
  </g>
  
  <g transform="translate(620, 390)">
    <rect x="0" y="0" width="520" height="40" rx="4" fill="#1E293B" fill-opacity="0.5"/>
    <text x="15" y="25" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF">XSS - Dashboard Z</text>
    <text x="350" y="25" font-family="'Inter', sans-serif" font-size="11" fill="#F59E0B">$500</text>
    <text x="420" y="25" font-family="'Inter', sans-serif" font-size="11" fill="#60A5FA">52%</text>
    <circle cx="500" cy="20" r="4" fill="#64748B"/>
  </g>

  <!-- Recent Activity -->
  <rect x="40" y="500" width="540" height="90" rx="8" fill="url(#piCard)" stroke="#1A1A2E" stroke-width="1"/>
  <text x="60" y="530" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">Recent Activity</text>
  
  <g transform="translate(60, 550)">
    <circle cx="10" cy="10" r="4" fill="#22C55E"/>
    <text x="25" y="14" font-family="'Inter', sans-serif" font-size="11" fill="#9CA3AF">Research Agent found 3 new programs</text>
    <text x="450" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">2m ago</text>
  </g>
  
  <g transform="translate(60, 570)">
    <circle cx="10" cy="10" r="4" fill="#60A5FA"/>
    <text x="25" y="14" font-family="'Inter', sans-serif" font-size="11" fill="#9CA3AF">Security Agent validated IDOR #234</text>
    <text x="450" y="14" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">15m ago</text>
  </g>

  <!-- System Status -->
  <rect x="600" y="500" width="560" height="90" rx="8" fill="url(#piCard)" stroke="#1A1A2E" stroke-width="1"/>
  <text x="620" y="530" font-family="'Inter', sans-serif" font-size="14" fill="#FFFFFF" font-weight="600">System Status</text>
  
  <g transform="translate(620, 555)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Scheduler:</text>
    <text x="80" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#22C55E">Running</text>
    
    <text x="150" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">EventBus:</text>
    <text x="230" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#22C55E">Active</text>
    
    <text x="300" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">AgentBus:</text>
    <text x="380" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#22C55E">Operational</text>
    
    <text x="470" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Memory:</text>
    <text x="520" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#60A5FA">342MB</text>
  </g>
  
  <g transform="translate(620, 575)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Tasks Processing:</text>
    <text x="120" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#60A5FA">12</text>
    
    <text x="160" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Queue:</text>
    <text x="210" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#F59E0B">5</text>
    
    <text x="250" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#64748B">Completed Today:</text>
    <text x="370" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#22C55E">47</text>
  </g>
</svg>