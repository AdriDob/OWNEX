<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Pure black gradient -->
    <linearGradient id="pureBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#030303"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Subtle blue glow -->
    <radialGradient id="subtleGlow" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0"/>
    </radialGradient>

    <!-- Core blue for logo -->
    <linearGradient id="heroBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Gold accent -->
    <linearGradient id="heroGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Text glow -->
    <filter id="heroTextGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Icon glow -->
    <filter id="heroIconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background - pure black -->
  <rect width="1200" height="630" fill="url(#pureBlack)"/>

  <!-- Subtle ambient glow -->
  <circle cx="350" cy="315" r="300" fill="url(#subtleGlow)"/>

  <!-- ═══ MINIMAL HERO LAYOUT ═══ -->
  
  <!-- Logo (left side, large) -->
  <g transform="translate(250, 315)">
    
    <!-- Outer orbital ring -->
    <ellipse cx="0" cy="0" rx="120" ry="40" fill="none" stroke="url(#heroBlue)" stroke-width="2" 
             transform="rotate(-8)" opacity="0.25"/>
    
    <!-- Middle orbital ring -->
    <ellipse cx="0" cy="0" rx="95" ry="32" fill="none" stroke="#60A5FA" stroke-width="2.5" 
             transform="rotate(12)" opacity="0.35"/>
    
    <!-- Inner orbital ring -->
    <ellipse cx="0" cy="0" rx="70" ry="24" fill="none" stroke="#93C5FD" stroke-width="1.5" 
             transform="rotate(-4)" opacity="0.25"/>

    <!-- Core O ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#heroBlue)" stroke-width="4" 
            opacity="0.85" filter="url(#heroIconGlow)"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.08"/>

    <!-- Inner cutout ring -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#60A5FA" stroke-width="0.8" opacity="0.2"/>

    <!-- Gold accent dot -->
    <circle cx="36" cy="-36" r="4" fill="url(#heroGold)" opacity="0.8" filter="url(#heroIconGlow)"/>
    <circle cx="36" cy="-36" r="1.5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Center core -->
    <circle cx="0" cy="0" r="12" fill="#3B82F6" opacity="0.15"/>
    <circle cx="0" cy="0" r="8" fill="#60A5FA" opacity="0.45"/>
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="-0.5" cy="-0.5" r="1.5" fill="#60A5FA" opacity="1"/>

    <!-- Scanline -->
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#60A5FA" stroke-width="0.5" opacity="0.1"/>
  </g>

  <!-- Text content (right side) -->
  <g transform="translate(500, 315)">
    
    <!-- Main headline -->
    <text x="0" y="-20" 
          font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" 
          font-size="72" 
          font-weight="600" 
          fill="#FFFFFF" 
          letter-spacing="3"
          filter="url(#heroTextGlow)">
      OWNEX
    </text>

    <!-- Subheadline -->
    <text x="0" y="30" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="28" 
          font-weight="400" 
          fill="#9CA3AF" 
          letter-spacing="1">
      OMEGA
    </text>

    <!-- Tagline -->
    <text x="0" y="80" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="18" 
          font-weight="500" 
          fill="#64748B" 
          letter-spacing="4">
      AUTONOMOUS WORK OS
    </text>

    <!-- Divider line -->
    <line x1="0" y1="110" x2="200" y2="110" stroke="url(#heroGold)" stroke-width="2" opacity="0.4"/>

    <!-- Version badge -->
    <g transform="translate(0, 145)">
      <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#1E293B" opacity="0.4"/>
      <text x="0" y="5" 
            font-family="'Inter', monospace" 
            font-size="12" 
            font-weight="600" 
            fill="#60A5FA" 
            text-anchor="middle">
        v7.0
      </text>
    </g>
  </g>

  <!-- Bottom right - minimal tag -->
  <g transform="translate(1150, 590)">
    <text x="0" y="0" 
          font-family="'Inter', monospace" 
          font-size="11" 
          font-weight="500" 
          fill="#3B82F6" 
          text-anchor="end"
          opacity="0.6">
      Production Ready
    </text>
  </g>
</svg>