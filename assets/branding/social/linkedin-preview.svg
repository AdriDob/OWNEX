      <stop offset="0%" style="stop-color:#050505;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F1117;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="627" fill="url(#linkedinGrad)"/>
  
  <!-- Logo left -->
  <circle cx="200" cy="313" r="120" fill="none" stroke="#3B82F6" stroke-width="5" opacity="0.8"/>
  <circle cx="200" cy="313" r="70" fill="#3B82F6" opacity="0.7"/>
  <path d="M200 243 L 200 383" stroke="#F59E0B" stroke-width="4" opacity="0.8"/>
  <path d="M130 313 L 270 313" stroke="#F59E0B" stroke-width="4" opacity="0.8"/>
  <circle cx="200" cy="313" r="25" fill="#F59E0B" opacity="0.9"/>
  
  <!-- Text right -->
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#F0F0F0" letter-spacing="3">OWNEX OMEGA</text>
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#3B82F6" letter-spacing="2">Autonomous Work Operating System</text>
  <text x="400" y="400" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#F0F0F0" opacity="0.7">AI • Bug Bounty • Revenue Generation</text>
  
  <!-- Features grid -->
  <g transform="translate(400, 450)">
