    <text x="340" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#F0F0F0" opacity="0.8">Revenue</text>
    
    <rect x="420" y="0" width="120" height="40" rx="5" fill="#3B82F6" opacity="0.15"/>
