<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="socialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050505;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#080808;stop-opacity:1" />
    </linearGradient>
    <pattern id="socialGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#socialGrad)"/>
  <rect width="1200" height="630" fill="url(#socialGrid)"/>
  
  <!-- Logo -->
  <circle cx="600" cy="280" r="100" fill="none" stroke="#3B82F6" stroke-width="4" opacity="0.8" filter="url(#glow)"/>
  <circle cx="600" cy="280" r="60" fill="#3B82F6" opacity="0.7"/>
  <path d="M600 220 L 600 340" stroke="#F59E0B" stroke-width="3" opacity="0.8"/>
  <path d="M540 280 L 660 280" stroke="#F59E0B" stroke-width="3" opacity="0.8"/>
  <circle cx="600" cy="280" r="20" fill="#F59E0B" opacity="0.9" filter="url(#glow)"/>
  
  <!-- Title -->
  <text x="600" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#F0F0F0" letter-spacing="4">OWNEX OMEGA</text>
  
  <!-- Tagline -->
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#3B82F6" letter-spacing="2">AUTONOMOUS WORK OPERATING SYSTEM</text>
  
  <!-- Accent line -->
  <line x1="400" y1="530" x2="800" y2="530" stroke="#F59E0B" stroke-width="2" opacity="0.6"/>
  
  <!-- Badge -->
  <rect x="1050" y="30" width="120" height="30" rx="15" fill="#3B82F6" opacity="0.2" stroke="#3B82F6" stroke-width="1"/>
  <text x="1110" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#F0F0F0" opacity="0.9">v7.0.0</text>
</svg>