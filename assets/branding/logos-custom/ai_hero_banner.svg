<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#heroGrad)"/>

  <!-- Neural network nodes (AI theme) -->
  <circle cx="200" cy="200" r="30" fill="#06B6D4" opacity="0.6"/>
  <circle cx="400" cy="150" r="25" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="400" cy="250" r="25" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="600" cy="200" r="35" fill="#F59E0B" opacity="0.8"/>
  <circle cx="800" cy="120" r="20" fill="#06B6D4" opacity="0.6"/>
  <circle cx="800" cy="280" r="20" fill="#06B6D4" opacity="0.6"/>
  <circle cx="1000" cy="200" r="30" fill="#8B5CF6" opacity="0.6"/>

  <!-- Neural network connections -->
  <line x1="200" y1="200" x2="400" y2="150" stroke="#F0F0F0" stroke-width="2" opacity="0.3"/>
  <line x1="200" y1="200" x2="400" y2="250" stroke="#F0F0F0" stroke-width="2" opacity="0.3"/>
  <line x1="400" y1="150" x2="600" y2="200" stroke="#F0F0F0" stroke-width="2" opacity="0.3"/>
  <line x1="400" y1="250" x2="600" y2="200" stroke="#F0F0F0" stroke-width="2" opacity="0.3"/>
  <line x1="600" y1="200" x2="800" y2="120" stroke="#F0F0F0" stroke-width="2" opacity="0.3"/>
  <line x1="600" y1="200" x2="800" y2="280" stroke="#F0F0F0" stroke-width="2" opacity="0.3"/>
  <line x1="800" y1="120" x2="1000" y2="200" stroke="#F0F0F0" stroke-width="2" opacity="0.3"/>
  <line x1="800" y1="280" x2="1000" y2="200" stroke="#F0F0F0" stroke-width="2" opacity="0.3"/>

  <!-- Data streams (code/data theme) -->
  <rect x="50" y="320" width="100" height="10" fill="#06B6D4" opacity="0.4"/>
  <rect x="50" y="340" width="80" height="10" fill="#06B6D4" opacity="0.3"/>
  <rect x="50" y="360" width="120" height="10" fill="#06B6D4" opacity="0.5"/>

  <rect x="1050" y="320" width="100" height="10" fill="#8B5CF6" opacity="0.4"/>
  <rect x="1070" y="340" width="80" height="10" fill="#8B5CF6" opacity="0.3"/>
  <rect x="1030" y="360" width="120" height="10" fill="#8B5CF6" opacity="0.5"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="48" font-weight="bold" fill="#F0F0F0">OWNEX OMEGA</text>

  <!-- Subtitle -->
  <text x="600" y="140" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="24" fill="#F59E0B">Autonomous AI Workforce</text>
</svg>