<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#appGrad)"/>

  <!-- Icon centered -->
  <g transform="translate(256, 256)">
    <!-- Outer Hexagon -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"
             fill="none" stroke="url(#iconGrad)" stroke-width="4"/>

    <!-- Inner Hexagon -->
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40"
             fill="url(#iconGrad)" opacity="0.2"/>

    <!-- Interconnected triangles -->
    <polygon points="0,-48 26,-24 44,0 26,24" fill="#06B6D4"/>
    <polygon points="0,48 -26,24 -44,0 -26,-24" fill="#3B82F6"/>
    <polygon points="-72,0 -26,-24 -26,24 -72,48" fill="#8B5CF6"/>
    <polygon points="72,0 26,-24 26,24 72,48" fill="#10B981"/>

    <!-- Center point -->
    <circle cx="0" cy="0" r="8" fill="#F59E0B"/>
  </g>
</svg>