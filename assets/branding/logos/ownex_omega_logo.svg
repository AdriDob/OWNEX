<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="omegaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: Deep Space Black -->
  <rect width="400" height="400" fill="#1A1A1A"/>

  <!-- Outer Circle - Mobility/Connection (more dynamic) -->
  <circle cx="200" cy="200" r="160"
          fill="none" stroke="url(#omegaGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Inner Circle (more transparent for lightness) -->
  <circle cx="200" cy="200" r="120"
          fill="url(#omegaGrad)" opacity="0.15"/>

  <!-- Orbiting Elements - Evolution/Mobility -->
  <!-- Orbit path -->
  <circle cx="200" cy="200" r="90"
          fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>

  <!-- Orbiting nodes (representing connection points) -->
  <circle cx="200" cy="110" r="12" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="290" cy="200" r="12" fill="#10B981" filter="url(#glow)"/>
  <circle cx="200" cy="290" r="12" fill="#3B82F6" filter="url(#glow)"/>
  <circle cx="110" cy="200" r="12" fill="#8B5CF6" filter="url(#glow)"/>

  <!-- Central Core - Intelligence -->
  <circle cx="200" cy="200" r="25" fill="#F59E0B" filter="url(#glow)"/>

  <!-- Connection rays (representing mobility) -->
  <line x1="200" y1="122" x2="200" y2="175" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <line x1="278" y1="200" x2="225" y2="200" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="278" x2="200" y2="225" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <line x1="122" y1="200" x2="175" y2="200" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>

  <!-- OWNEX OMEGA Text -->
  <text x="200" y="320" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
        font-size="32" font-weight="700" fill="#FFFFFF" letter-spacing="4">OWNEX</text>

  <text x="200" y="355" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
        font-size="20" font-weight="600" fill="#8B5CF6" letter-spacing="6">OMEGA</text>

  <!-- Tagline -->
  <text x="200" y="380" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
        font-size="12" font-weight="400" fill="#FFFFFF" opacity="0.6" letter-spacing="2">Mobile Companion</text>
</svg>