<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="alphaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: Deep Space Black -->
  <rect width="400" height="400" fill="#1A1A1A"/>

  <!-- Outer Hexagon - Engineering/Stability (stronger lines) -->
  <polygon points="200,25 355,110 355,290 200,375 45,290 45,110"
           fill="none" stroke="url(#alphaGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Inner Hexagon (more filled for stability) -->
  <polygon points="200,55 325,135 325,265 200,345 75,265 75,135"
           fill="url(#alphaGrad)" opacity="0.25"/>

  <!-- Central Command Structure - Interconnected Squares (Command Center) -->
  <!-- Top square -->
  <rect x="180" y="100" width="40" height="40" fill="#06B6D4" filter="url(#glow)"/>

  <!-- Bottom square -->
  <rect x="180" y="260" width="40" height="40" fill="#3B82F6" filter="url(#glow)"/>

  <!-- Left square -->
  <rect x="100" y="180" width="40" height="40" fill="#8B5CF6" filter="url(#glow)"/>

  <!-- Right square -->
  <rect x="260" y="180" width="40" height="40" fill="#10B981" filter="url(#glow)"/>

  <!-- Center Command Point -->
  <circle cx="200" cy="200" r="10" fill="#F59E0B" filter="url(#glow)"/>

  <!-- Connection lines (command network) -->
  <line x1="200" y1="140" x2="200" y2="180" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="220" x2="200" y2="260" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  <line x1="140" y1="200" x2="180" y2="200" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  <line x1="220" y1="200" x2="260" y2="200" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>

  <!-- OWNEX ALPHA Text -->
  <text x="200" y="320" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
        font-size="32" font-weight="700" fill="#FFFFFF" letter-spacing="4">OWNEX</text>

  <text x="200" y="355" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
        font-size="20" font-weight="600" fill="#06B6D4" letter-spacing="6">ALPHA</text>

  <!-- Tagline -->
  <text x="200" y="380" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
        font-size="12" font-weight="400" fill="#FFFFFF" opacity="0.6" letter-spacing="2">Desktop Command Center</text>
</svg>