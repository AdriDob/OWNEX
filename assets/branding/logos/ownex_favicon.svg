  <polygon points="16,24 12,20 20,16 12,20" fill="#3B82F6"/>
  <polygon points="6,16 10,12 10,20 6,24" fill="#8B5CF6"/>
  <polygon points="26,16 22,12 22,12 26,24" fill="#10B981"/>

  <!-- Center point -->
