<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="omegaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0044FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00F0FF;stop-opacity:1" />
    </linearGradient>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: Space Black -->
  <rect width="512" height="512" fill="#0A0A0A"/>

  <!-- Outer Circle - Mobility (Apple-inspired) -->
  <circle cx="256" cy="256" r="200"
          fill="none" stroke="url(#omegaGrad)" stroke-width="4" filter="url(#subtleGlow)"/>

  <!-- Inner Circle - Connection -->
  <circle cx="256" cy="256" r="150"
          fill="url(#omegaGrad)" opacity="0.15"/>

  <!-- Orbit Path - Connection (SpaceX-inspired) -->
  <circle cx="256" cy="256" r="110"
          fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.5"/>

  <!-- Orbiting Nodes - Connection Points -->
  <!-- Top node -->
  <circle cx="256" cy="146" r="18" fill="#00F0FF" filter="url(#subtleGlow)"/>
  <!-- Right node -->
  <circle cx="366" cy="256" r="18" fill="#00FF88" filter="url(#subtleGlow)"/>
  <!-- Bottom node -->
  <circle cx="256" cy="366" r="18" fill="#0044FF" filter="url(#subtleGlow)"/>
  <!-- Left node -->
  <circle cx="146" cy="256" r="18" fill="#00FF88" filter="url(#subtleGlow)"/>

  <!-- Center Intelligence Core -->
  <circle cx="256" cy="256" r="35" fill="#00F0FF" filter="url(#subtleGlow)"/>

  <!-- Inner Core - Intelligence -->
  <circle cx="256" cy="256" r="20" fill="#0044FF" opacity="0.8"/>

  <!-- OWNEX Text -->
  <text x="256" y="390" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="3">OWNEX</text>

  <!-- OMEGA Text -->
  <text x="256" y="435" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="24" font-weight="600" fill="#0044FF" letter-spacing="6">OMEGA</text>

  <!-- Tagline -->
  <text x="256" y="470" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="14" font-weight="400" fill="#E0E0E0" letter-spacing="1">Mobile Companion</text>
</svg>