<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="merlinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2A;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#merlinGrad)"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
        font-size="32" font-weight="700" fill="#FFFFFF" letter-spacing="2">MERLIN Assistant</text>
  <text x="600" y="80" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
        font-size="16" fill="#06B6D4" letter-spacing="1">Intelligent Interface • Voice • Memory • Explanation</text>

  <!-- Central Interface Core - Not Humanoid -->
  <circle cx="600" cy="400" r="200" fill="none" stroke="#06B6D4" stroke-width="2" filter="url(#glow)"/>
  <circle cx="600" cy="400" r="150" fill="url(#merlinGrad)" opacity="0.3"/>
  <circle cx="600" cy="400" r="100" fill="url(#merlinGrad)" opacity="0.5"/>

  <!-- Intelligence Core - Geometric Pattern -->
  <!-- Hexagonal pattern representing intelligence -->
  <polygon points="600,280 704,340 704,460 600,520 496,460 496,340"
           fill="none" stroke="#8B5CF6" stroke-width="2" filter="url(#glow)"/>

  <!-- Inner geometric patterns -->
  <polygon points="600,320 660,355 660,425 600,460 540,425 540,355"
           fill="#3B82F6" opacity="0.3" filter="url(#glow)"/>

  <!-- Central intelligence point -->
  <circle cx="600" cy="400" r="30" fill="#F59E0B" filter="url(#glow)"/>

  <!-- Voice Rings (Audio Interface) -->
  <circle cx="600" cy="400" r="120" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.5"/>
  <circle cx="600" cy="400" r="140" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.3"/>
  <circle cx="600" cy="400" r="160" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.2"/>

  <!-- Memory Nodes (Connected to core) -->
  <circle cx="450" cy="400" r="20" fill="#8B5CF6" filter="url(#glow)"/>
  <circle cx="750" cy="400" r="20" fill="#8B5CF6" filter="url(#glow)"/>
  <circle cx="600" cy="250" r="20" fill="#3B82F6" filter="url(#glow)"/>
  <circle cx="600" cy="550" r="20" fill="#3B82F6" filter="url(#glow)"/>

  <!-- Connection lines -->
  <line x1="470" y1="400" x2="570" y2="400" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <line x1="730" y1="400" x2="630" y2="400" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="270" x2="600" y2="370" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <line x1="600" y1="530" x2="600" y2="430" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>

  <!-- Chat Interface Panel -->
  <rect x="100" y="620" width="400" height="150" rx="8" fill="#2A2A2A" stroke="#06B6D4" stroke-width="1"/>
  <text x="120" y="650" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#06B6D4">Conversation Memory</text>
  <text x="120" y="670" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.7">User: Explain how the Security Cycle works</text>
  <text x="120" y="690" font-family="Inter, sans-serif" font-size="10" fill="#8B5CF6">MERLIN: The Security Cycle follows Recon → Hypothesis →</text>
  <text x="120" y="710" font-family="Inter, sans-serif" font-size="10" fill="#8B5CF6">Validation → Evidence → Report. Each stage is executed</text>
  <text x="120" y="730" font-family="Inter, sans-serif" font-size="10" fill="#8B5CF6">by autonomous agents with AI-powered analysis.</text>
  <text x="120" y="750" font-family="Inter, sans-serif" font-size="10" fill="#10B981">● 47 conversations stored</text>

  <!-- Explanation Engine Panel -->
  <rect x="700" y="620" width="400" height="150" rx="8" fill="#2A2A2A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="720" y="650" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#8B5CF6">Explanation Engine</text>
  <text x="720" y="670" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.7">Mode: Teach (explain from scratch)</text>
  <text x="720" y="690" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.7">Personality: Professor (educational)</text>
  <text x="720" y="710" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.7">Detail Level: High</text>
  <text x="720" y="730" font-family="Inter, sans-serif" font-size="10" fill="#F59E0B">● 234 explanations provided</text>
  <text x="720" y="750" font-family="Inter, sans-serif" font-size="10" fill="#10B981">● Learning: Active</text>

  <!-- Capabilities Panel -->
  <rect x="100" y="100" width="400" height="120" rx="8" fill="#2A2A2A" stroke="#3B82F6" stroke-width="1"/>
  <text x="120" y="130" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#3B82F6">Capabilities</text>
  <text x="120" y="150" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.7">● Voice Commands (Whisper + Piper)</text>
  <text x="120" y="170" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.7">● Context-Aware Recommendations</text>
  <text x="120" y="190" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.7">● Educational Explanations</text>
  <text x="120" y="210" font-family="Inter, sans-serif" font-size="10" fill="#10B981">● Real-time System Integration</text>

  <!-- Personalization Panel -->
  <rect x="700" y="100" width="400" height="120" rx="8" fill="#2A2A2A" stroke="#F59E0B" stroke-width="1"/>
  <text x="720" y="130" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F59E0B">Personalization</text>
  <text x="720" y="150" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.7">● Tone: Professional</text>
  <text x="720" y="170" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.7">● Speed: 1.0x</text>
  <text x="720" y="190" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.7">● Auto-Explain: Enabled</text>
  <text x="720" y="210" font-family="Inter, sans-serif" font-size="10" fill="#10B981">● Interrupt Threshold: Risk Only</text>
</svg>