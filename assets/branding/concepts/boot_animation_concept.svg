<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2A;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bootGrad)"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
        font-size="32" font-weight="700" fill="#FFFFFF" letter-spacing="2">OWNEX Boot Sequence</text>
  <text x="600" y="80" text-anchor="middle" font-family="Inter, -apple-system, sans-serif"
        font-size="16" fill="#06B6D4" letter-spacing="1">System Initialization • Agent Startup • Service Connection</text>

  <!-- Boot Progress Bar -->
  <rect x="200" y="700" width="800" height="10" rx="5" fill="#2A2A2A" stroke="#06B6D4" stroke-width="1"/>
  <rect x="200" y="700" width="750" height="10" rx="5" fill="#06B6D4" filter="url(#glow)"/>
  <text x="600" y="730" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#06B6D4">Boot Progress: 94%</text>

  <!-- Boot Stages (Left to Right, Timeline) -->

  <!-- Stage 1: Logo Appearance -->
  <rect x="50" y="120" width="200" height="180" rx="8" fill="#2A2A2A" stroke="#10B981" stroke-width="2"/>
  <text x="150" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#10B981">1. Logo Init</text>
  <text x="150" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#10B981">✓ Complete</text>
  <circle cx="150" cy="250" r="40" fill="none" stroke="#06B6D4" stroke-width="2"/>
  <polygon points="150,220 172,242 150,280 128,242" fill="#06B6D4" opacity="0.5"/>

  <!-- Stage 2: System Analysis -->
  <rect x="280" y="120" width="200" height="180" rx="8" fill="#2A2A2A" stroke="#10B981" stroke-width="2"/>
  <text x="380" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#10B981">2. System Check</text>
  <text x="380" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#10B981">✓ Complete</text>
  <text x="300" y="200" font-family="JetBrains Mono, monospace" font-size="9" fill="#FFFFFF" opacity="0.7">Memory: OK</text>
  <text x="300" y="220" font-family="JetBrains Mono, monospace" font-size="9" fill="#FFFFFF" opacity="0.7">CPU: OK</text>
  <text x="300" y="240" font-family="JetBrains Mono, monospace" font-size="9" fill="#FFFFFF" opacity="0.7">Network: OK</text>
  <text x="300" y="260" font-family="JetBrains Mono, monospace" font-size="9" fill="#10B981">All: OK</text>

  <!-- Stage 3: Agents Initializing -->
  <rect x="510" y="120" width="200" height="180" rx="8" fill="#2A2A2A" stroke="#06B6D4" stroke-width="2"/>
  <text x="610" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#06B6D4">3. Agent Init</text>
  <text x="610" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#06B6D4">⏳ In Progress</text>
  <text x="530" y="200" font-family="JetBrains Mono, monospace" font-size="9" fill="#10B981">✓ Security Scout</text>
  <text x="530" y="220" font-family="JetBrains Mono, monospace" font-size="9" fill="#10B981">✓ Code Generator</text>
  <text x="530" y="240" font-family="JetBrains Mono, monospace" font-size="9" fill="#10B981">✓ Validator</text>
  <text x="530" y="260" font-family="JetBrains Mono, monospace" font-size="9" fill="#06B6D4">→ Researcher</text>

  <!-- Stage 4: Service Connection -->
  <rect x="740" y="120" width="200" height="180" rx="8" fill="#2A2A2A" stroke="#8B5CF6" stroke-width="2"/>
  <text x="840" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#8B5CF6">4. Services</text>
  <text x="840" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#8B5CF6">⏳ Connecting</text>
  <text x="760" y="200" font-family="JetBrains Mono, monospace" font-size="9" fill="#10B981">✓ Database</text>
  <text x="760" y="220" font-family="JetBrains Mono, monospace" font-size="9" fill="#10B981">✓ EventBus</text>
  <text x="760" y="240" font-family="JetBrains Mono, monospace" font-size="9" fill="#06B6D4">→ Scheduler</text>
  <text x="760" y="260" font-family="JetBrains Mono, monospace" font-size="9" fill="#8B5CF6">→ AI Providers</text>

  <!-- Stage 5: Mission Control Entry -->
  <rect x="970" y="120" width="180" height="180" rx="8" fill="#2A2A2A" stroke="#F59E0B" stroke-width="2"/>
  <text x="1060" y="150" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F59E0B">5. Mission Ctrl</text>
  <text x="1060" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#F59E0B">⏳ Loading</text>
  <text x="990" y="200" font-family="JetBrains Mono, monospace" font-size="9" fill="#06B6D4">→ Dashboard</text>
  <text x="990" y="220" font-family="JetBrains Mono, monospace" font-size="9" fill="#8B5CF6">→ Agent Fleet</text>
  <text x="990" y="240" font-family="JetBrains Mono, monospace" font-size="9" fill="#8B5CF6">→ Radar</text>
  <text x="990" y="260" font-family="JetBrains Mono, monospace" font-size="9" fill="#8B5CF6">→ Timeline</text>

  <!-- Connection Lines Between Stages -->
  <g stroke="#06B6D4" stroke-width="2" opacity="0.5">
    <line x1="250" y1="210" x2="280" y2="210"/>
    <line x1="480" y1="210" x2="510" y2="210"/>
    <line x1="710" y1="210" x2="740" y2="210"/>
    <line x1="940" y1="210" x2="970" y2="210"/>
  </g>

  <!-- System Info Panel -->
  <rect x="50" y="340" width="500" height="320" rx="8" fill="#2A2A2A" stroke="#3B82F6" stroke-width="1"/>
  <text x="70" y="370" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#3B82F6">System Information</text>
  <text x="70" y="400" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFFFFF" opacity="0.7">OWNEX OMEGA v7.0.0</text>
  <text x="70" y="420" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFFFFF" opacity="0.7">Build: 2026-07-31</text>
  <text x="70" y="440" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFFFFF" opacity="0.7">Environment: Production</text>
  <text x="70" y="460" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFFFFF" opacity="0.7">Platform: Linux x86_64</text>
  <text x="70" y="480" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFFFFF" opacity="0.7">Python: 3.11.7</text>
  <text x="70" y="500" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFFFFF" opacity="0.7">Frontend: Vue 3.4.0</text>
  <text x="70" y="520" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFFFFF" opacity="0.7">Database: PostgreSQL 15</text>
  <text x="70" y="540" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFFFFF" opacity="0.7">Cache: Redis 7.2</text>
  <text x="70" y="560" font-family="JetBrains Mono, monospace" font-size="11" fill="#10B981">Status: All Systems Go</text>
  <text x="70" y="580" font-family="JetBrains Mono, monospace" font-size="11" fill="#10B981">Boot Time: 3.2s</text>
  <text x="70" y="600" font-family="JetBrains Mono, monospace" font-size="11" fill="#10B981">Memory: 4.2GB / 16GB</text>
  <text x="70" y="620" font-family="JetBrains Mono, monospace" font-size="11" fill="#10B981">CPU: 23%</text>
  <text x="70" y="640" font-family="JetBrains Mono, monospace" font-size="11" fill="#10B981">Network: 1.2 Gbps</text>

  <!-- Agent Status Panel -->
  <rect x="580" y="340" width="570" height="320" rx="8" fill="#2A2A2A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="600" y="370" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#8B5CF6">Agent Status</text>
  <text x="600" y="400" font-family="Inter, sans-serif" font-size="11" fill="#10B981">✓ Security Scout — ONLINE</text>
  <text x="600" y="420" font-family="Inter, sans-serif" font-size="11" fill="#10B981">✓ Code Generator — ONLINE</text>
  <text x="600" y="440" font-family="Inter, sans-serif" font-size="11" fill="#10B981">✓ Validator — ONLINE</text>
  <text x="600" y="460" font-family="Inter, sans-serif" font-size="11" fill="#06B6D4">→ Researcher — INITIALIZING</text>
  <text x="600" y="480" font-family="Inter, sans-serif" font-size="11" fill="#8B5CF6">⏳ Executor — PENDING</text>
  <text x="600" y="500" font-family="Inter, sans-serif" font-size="11" fill="#8B5CF6">⏳ Reporter — PENDING</text>
  <text x="600" y="520" font-family="Inter, sans-serif" font-size="11" fill="#8B5CF6">⏳ Optimizer — PENDING</text>
  <text x="600" y="540" font-family="Inter, sans-serif" font-size="11" fill="#8B5CF6">⏳ Analyzer — PENDING</text>
  <text x="600" y="560" font-family="Inter, sans-serif" font-size="11" fill="#8B5CF6">⏳ Coordinator — PENDING</text>
  <text x="600" y="580" font-family="Inter, sans-serif" font-size="11" fill="#F59E0B">● 3 / 12 Active</text>
  <text x="600" y="600" font-family="Inter, sans-serif" font-size="11" fill="#06B6D4">● 9 / 12 Initializing</text>
  <text x="600" y="620" font-family="Inter, sans-serif" font-size="11" fill="#06B6D4">● Estimated: 5.4s</text>
  <text x="600" y="640" font-family="Inter, sans-serif" font-size="11" fill="#10B981">● Fleet Ready: YES</text>
</svg>