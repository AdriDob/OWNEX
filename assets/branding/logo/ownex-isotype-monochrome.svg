<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Monochrome gradient - black to dark gray -->
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
  </defs>

  <!-- Background - transparent for monochrome use -->
  <!-- <rect width="512" height="512" rx="96" fill="#FFFFFF"/> -->

  <!-- ═══ MONOCHROME ISOTYPE ═══ -->
  <g transform="translate(256,256)">
    
    <!-- Outer orbital ring -->
    <ellipse cx="0" cy="0" rx="160" ry="52" fill="none" stroke="#000000" stroke-width="2.5" 
             transform="rotate(-8)" opacity="0.6"/>
    
    <!-- Middle orbital ring -->
    <ellipse cx="0" cy="0" rx="130" ry="42" fill="none" stroke="#000000" stroke-width="3" 
             transform="rotate(12)" opacity="0.7"/>
    
    <!-- Inner orbital ring -->
    <ellipse cx="0" cy="0" rx="100" ry="32" fill="none" stroke="#000000" stroke-width="2" 
             transform="rotate(-4)" opacity="0.5"/>

    <!-- Small orbital particles -->
    <circle cx="95" cy="18" r="3" fill="#000000" opacity="0.7"/>
    <circle cx="-110" cy="-22" r="2.5" fill="#000000" opacity="0.6"/>
    <circle cx="140" cy="-35" r="2" fill="#000000" opacity="0.5"/>

    <!-- Core O ring - main element -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#000000" stroke-width="6" opacity="0.9"/>

    <!-- Inner cutout ring -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="#000000" stroke-width="1.2" opacity="0.4"/>

    <!-- Accent dot - solid black -->
    <circle cx="52" cy="-52" r="6" fill="#000000" opacity="0.9"/>

    <!-- Center core -->
    <circle cx="0" cy="0" r="12" fill="#000000" opacity="0.7"/>
    <circle cx="0" cy="0" r="7" fill="#000000" opacity="0.9"/>

    <!-- Scanline -->
    <line x1="-66" y1="0" x2="66" y2="0" stroke="#000000" stroke-width="0.6" opacity="0.2"/>
  </g>
</svg>