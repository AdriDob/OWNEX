<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Premium dark background -->
    <linearGradient id="bgVert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030406"/>
      <stop offset="50%" stop-color="#06080C"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Core blue gradient -->
    <linearGradient id="coreBlueVert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Gold accent -->
    <linearGradient id="goldVert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Ambient glow -->
    <radialGradient id="glowVert" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0"/>
    </radialGradient>

    <!-- Icon glow -->
    <filter id="iconGlowVert" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="textGlowVert" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgVert)"/>

  <!-- Ambient glow -->
  <circle cx="200" cy="140" r="100" fill="url(#glowVert)"/>

  <!-- ═══ LOGOMARK (CENTERED TOP) ═══ -->
  <g transform="translate(200, 140)">
    
    <!-- Outer orbital ring -->
    <ellipse cx="0" cy="0" rx="70" ry="24" fill="none" stroke="url(#coreBlueVert)" stroke-width="2" 
             transform="rotate(-8)" opacity="0.35"/>
    
    <!-- Middle orbital ring -->
    <ellipse cx="0" cy="0" rx="56" ry="18" fill="none" stroke="#60A5FA" stroke-width="2.5" 
             transform="rotate(12)" opacity="0.45"/>
    
    <!-- Inner orbital ring -->
    <ellipse cx="0" cy="0" rx="42" ry="14" fill="none" stroke="#93C5FD" stroke-width="1.5" 
             transform="rotate(-4)" opacity="0.3"/>

    <!-- Core O ring -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#coreBlueVert)" stroke-width="4" 
            opacity="0.9" filter="url(#iconGlowVert)"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>

    <!-- Inner cutout ring -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#60A5FA" stroke-width="0.8" opacity="0.25"/>

    <!-- Gold accent dot -->
    <circle cx="24" cy="-24" r="3.5" fill="url(#goldVert)" opacity="0.85" filter="url(#iconGlowVert)"/>
    <circle cx="24" cy="-24" r="1.2" fill="#FFFFFF" opacity="0.9"/>

    <!-- Center core -->
    <circle cx="0" cy="0" r="8" fill="#3B82F6" opacity="0.2"/>
    <circle cx="0" cy="0" r="5.5" fill="#60A5FA" opacity="0.5"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="-0.5" cy="-0.5" r="1" fill="#60A5FA" opacity="1"/>

    <!-- Scanline -->
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#60A5FA" stroke-width="0.4" opacity="0.1"/>
  </g>

  <!-- ═══ LOGOTYPE (CENTERED BOTTOM) ═══ -->
  <g transform="translate(200, 280)">
    <!-- Main wordmark -->
    <text x="0" y="0" 
          font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" 
          font-size="52" 
          font-weight="600" 
          fill="#FFFFFF" 
          letter-spacing="6"
          text-anchor="middle"
          filter="url(#textGlowVert)">
      OWNEX
    </text>

    <!-- Underline accent -->
    <line x1="-60" y1="15" x2="60" y2="15" stroke="url(#goldVert)" stroke-width="2" opacity="0.4"/>

    <!-- Tagline -->
    <text x="0" y="38" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="12" 
          font-weight="500" 
          fill="#64748B" 
          letter-spacing="7"
          text-anchor="middle"
          opacity="0.9">
      AUTONOMOUS WORK OS
    </text>
  </g>

  <!-- Version badge -->
  <g transform="translate(200, 350)">
    <rect x="-25" y="-12" width="50" height="24" rx="12" fill="#1E293B" opacity="0.5"/>
    <text x="0" y="4" 
          font-family="'Inter', monospace" 
          font-size="10" 
          font-weight="600" 
          fill="#60A5FA" 
          text-anchor="middle">
      v7.0
    </text>
  </g>
</svg>