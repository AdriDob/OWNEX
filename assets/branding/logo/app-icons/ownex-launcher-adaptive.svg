<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <!-- Android adaptive icon background -->
    <linearGradient id="adaptiveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Core blue -->
    <linearGradient id="adaptiveBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Gold -->
    <linearGradient id="adaptiveGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="adaptiveGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background for adaptive icon -->
  <rect width="108" height="108" rx="24" fill="url(#adaptiveBg)"/>

  <!-- ═══ LAUNCHER ICON ═══ -->
  <g transform="translate(54,54)">
    
    <!-- Orbital rings -->
    <ellipse cx="0" cy="0" rx="38" ry="12" fill="none" stroke="url(#adaptiveBlue)" stroke-width="2" 
             transform="rotate(-8)" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="28" ry="9" fill="none" stroke="#60A5FA" stroke-width="2.5" 
             transform="rotate(12)" opacity="0.5"/>

    <!-- Core O ring -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="url(#adaptiveBlue)" stroke-width="3.5" 
            opacity="0.9" filter="url(#adaptiveGlow)"/>

    <!-- Gold dot -->
    <circle cx="11" cy="-11" r="2.5" fill="url(#adaptiveGold)" opacity="0.9"/>

    <!-- Center core -->
    <circle cx="0" cy="0" r="5" fill="#60A5FA" opacity="0.6"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>