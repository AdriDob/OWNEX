<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- iOS style background gradient -->
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Core blue gradient -->
    <linearGradient id="appBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Gold accent -->
    <linearGradient id="appGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Inner glow -->
    <radialGradient id="appInnerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0"/>
    </radialGradient>

    <!-- Strong glow for icon -->
    <filter id="appGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="appSoftGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- App icon background with iOS style rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#appBg)"/>

  <!-- Inner glow -->
  <circle cx="256" cy="256" r="200" fill="url(#appInnerGlow)"/>

  <!-- ═══ APP ICON ═══ -->
  <g transform="translate(256,256)">
    
    <!-- Outer orbital ring -->
    <ellipse cx="0" cy="0" rx="160" ry="52" fill="none" stroke="url(#appBlue)" stroke-width="3" 
             transform="rotate(-8)" opacity="0.35"/>
    
    <!-- Middle orbital ring -->
    <ellipse cx="0" cy="0" rx="130" ry="42" fill="none" stroke="#60A5FA" stroke-width="3.5" 
             transform="rotate(12)" opacity="0.45"/>
    
    <!-- Inner orbital ring -->
    <ellipse cx="0" cy="0" rx="100" ry="32" fill="none" stroke="#93C5FD" stroke-width="2.5" 
             transform="rotate(-4)" opacity="0.35"/>

    <!-- Orbital particles -->
    <circle cx="95" cy="18" r="4" fill="#60A5FA" opacity="0.6"/>
    <circle cx="-110" cy="-22" r="3.5" fill="#F59E0B" opacity="0.5"/>
    <circle cx="140" cy="-35" r="3" fill="#93C5FD" opacity="0.4"/>

    <!-- Core O ring -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#appBlue)" stroke-width="7" 
            opacity="0.95" filter="url(#appGlow)"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.12"/>

    <!-- Inner cutout ring -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.3"/>

    <!-- Gold accent dot -->
    <circle cx="52" cy="-52" r="7" fill="url(#appGold)" opacity="0.9" filter="url(#appSoftGlow)"/>
    <circle cx="52" cy="-52" r="3" fill="#FFFFFF" opacity="0.95"/>

    <!-- Center core -->
    <circle cx="0" cy="0" r="18" fill="#3B82F6" opacity="0.2" filter="url(#appGlow)"/>
    <circle cx="0" cy="0" r="12" fill="#60A5FA" opacity="0.55"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" opacity="0.98"/>
    <circle cx="-1" cy="-1" r="2.5" fill="#60A5FA" opacity="1"/>

    <!-- Scanline -->
    <line x1="-66" y1="0" x2="66" y2="0" stroke="#60A5FA" stroke-width="0.8" opacity="0.15"/>
  </g>
</svg>