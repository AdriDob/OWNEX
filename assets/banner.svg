<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6EE7FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5CF2B5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background dark -->
  <rect width="1280" height="640" fill="#0B0F19"/>

  <!-- Logo elements - centered -->
  <g transform="translate(640, 220)">
    <!-- Orbital ring -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#grad1)" stroke-width="10"/>

    <!-- Hexagon -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="url(#grad1)" stroke-width="6"/>

    <!-- Inner core -->
    <circle cx="0" cy="0" r="40" fill="url(#grad1)"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>
  </g>

  <!-- Text OWNEX -->
  <text x="640" y="420" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="8">OWNEX</text>

  <!-- ALPHA section -->
  <g transform="translate(320, 480)">
    <rect x="-120" y="-30" width="240" height="60" rx="30" fill="none" stroke="url(#grad1)" stroke-width="2"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#00D4FF" text-anchor="middle" letter-spacing="4">ALPHA</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="14" fill="#6EE7FF" text-anchor="middle">Desktop</text>
  </g>

  <!-- OMEGA section -->
  <g transform="translate(960, 480)">
    <rect x="-120" y="-30" width="240" height="60" rx="30" fill="none" stroke="url(#grad2)" stroke-width="2"/>
    <text x="0" y="10" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#5CF2B5" text-anchor="middle" letter-spacing="4">OMEGA</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="14" fill="#6EE7FF" text-anchor="middle">Mobile</text>
  </g>

  <!-- Connection line -->
  <line x1="440" y1="480" x2="520" y2="480" stroke="#00D4FF" stroke-width="2" opacity="0.5"/>
  <line x1="760" y1="480" x2="840" y2="480" stroke="#00D4FF" stroke-width="2" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="640" y="580" font-family="Arial, sans-serif" font-size="16" fill="#5CF2B5" text-anchor="middle" letter-spacing="2">Autonomous Operating System Ecosystem</text>
</svg>