<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Background -->
  <rect width="800" height="400" fill="#0a0a1a"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#grad1)"/>

  <!-- Logo OWNEX -->
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#00f0ff" text-anchor="middle">OWNEX</text>
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#00f0ff" text-anchor="middle" stroke="#00f0ff" stroke-width="2">OWNEX</text>

  <!-- Subtitle -->
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">Autonomous Work Operating Platform</text>

  <!-- Tagline -->
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="18" fill="#888888" text-anchor="middle">Zero-Barrier Entry • Autonomous Operation • AI-Powered Intelligence</text>

  <!-- Status badge -->
  <rect x="300" y="320" width="200" height="40" rx="20" fill="#00ff88" opacity="0.2"/>
  <rect x="300" y="320" width="200" height="40" rx="20" fill="none" stroke="#00ff88" stroke-width="2"/>
  <text x="400" y="348" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#00ff88" text-anchor="middle">PRODUCTION READY</text>

  <!-- Decorative elements -->
  <circle cx="100" cy="350" r="50" fill="#00f0ff" opacity="0.1"/>
  <circle cx="700" cy="50" r="80" fill="#00f0ff" opacity="0.1"/>
  <circle cx="700" cy="350" r="40" fill="#00ff88" opacity="0.1"/>
</svg>