<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D7FF9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E5BC9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0B0B0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D0D0D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background deep dark - very minimal -->
  <rect width="1600" height="700" fill="url(#grad2)"/>

  <!-- Very subtle orbital geometry - barely visible -->
  <ellipse cx="800" cy="350" rx="600" ry="200" fill="none" stroke="#2D7FF9" stroke-width="0.5" opacity="0.05" transform="rotate(15 800 350)"/>
  <ellipse cx="800" cy="350" rx="600" ry="200" fill="none" stroke="#2D7FF9" stroke-width="0.5" opacity="0.05" transform="rotate(-15 800 350)"/>

  <!-- Minimal navigation paths - very subtle -->
  <g transform="translate(800, 280)" opacity="0.08">
    <path d="M -80 0 L -40 -40 L 0 -60 L 40 -40 L 80 0" fill="none" stroke="#2D7FF9" stroke-width="1"/>
    <path d="M -80 0 L -40 40 L 0 60 L 40 40 L 80 0" fill="none" stroke="#2D7FF9" stroke-width="1"/>
  </g>

  <!-- Central convergence point - minimal -->
  <circle cx="800" cy="280" r="30" fill="none" stroke="#2D7FF9" stroke-width="1.5" opacity="0.3"/>
  <circle cx="800" cy="280" r="12" fill="#2D7FF9" opacity="0.4"/>

  <!-- Text OWNEX - typography-focused, minimal -->
  <text x="800" y="380" font-family="Arial, sans-serif" font-size="72" font-weight="200" fill="#FFFFFF" text-anchor="middle" letter-spacing="24">OWNEX</text>

  <!-- Subtitle - Autonomous Work Operating System -->
  <text x="800" y="440" font-family="Arial, sans-serif" font-size="18" font-weight="300" fill="#888888" text-anchor="middle" letter-spacing="6">Autonomous Work Operating System</text>

  <!-- Technical metrics - very minimal, no boxes -->
  <text x="800" y="500" font-family="Arial, sans-serif" font-size="13" font-weight="300" fill="#2D7FF9" text-anchor="middle" letter-spacing="3">ALPHA  OMEGA  v7.0.0</text>

  <!-- Very subtle accent line -->
  <line x1="400" y1="540" x2="1200" y2="540" stroke="#2D7FF9" stroke-width="0.5" opacity="0.1"/>

  <!-- Bottom version -->
  <text x="800" y="600" font-family="Arial, sans-serif" font-size="11" font-weight="300" fill="#444444" text-anchor="middle" letter-spacing="2">Production Ready</text>
</svg>