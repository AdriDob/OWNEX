<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D7FF9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E5BC9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0B0B0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background deep dark with subtle gradient -->
  <rect width="1600" height="700" fill="url(#grad2)"/>

  <!-- Subtle orbital geometry - very minimal -->
  <ellipse cx="800" cy="350" rx="400" ry="120" fill="none" stroke="#2D7FF9" stroke-width="1" opacity="0.15" transform="rotate(30 800 350)"/>
  <ellipse cx="800" cy="350" rx="400" ry="120" fill="none" stroke="#2D7FF9" stroke-width="1" opacity="0.15" transform="rotate(-30 800 350)"/>

  <!-- Minimal particles - very subtle -->
  <circle cx="200" cy="200" r="2" fill="#2D7FF9" opacity="0.3"/>
  <circle cx="1400" cy="500" r="2" fill="#2D7FF9" opacity="0.3"/>
  <circle cx="300" cy="550" r="1.5" fill="#2D7FF9" opacity="0.2"/>
  <circle cx="1300" cy="150" r="1.5" fill="#2D7FF9" opacity="0.2"/>
  <circle cx="600" cy="100" r="1" fill="#2D7FF9" opacity="0.2"/>
  <circle cx="1000" cy="600" r="1" fill="#2D7FF9" opacity="0.2"/>

  <!-- Main content - centered -->
  <g transform="translate(800, 280)">
    <!-- Abstract navigation paths -->
    <path d="M -100 0 L -50 -50 L 0 -80 L 50 -50 L 100 0" fill="none" stroke="#2D7FF9" stroke-width="2" opacity="0.5"/>
    <path d="M -100 0 L -50 50 L 0 80 L 50 50 L 100 0" fill="none" stroke="#2D7FF9" stroke-width="2" opacity="0.5"/>

    <!-- Abstract convergence circle -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#2D7FF9" stroke-width="3"/>

    <!-- North star - opportunity -->
    <circle cx="0" cy="0" r="20" fill="#2D7FF9"/>

    <!-- Precision point -->
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Text OWNEX - minimal, wide spacing -->
  <text x="800" y="420" font-family="Arial, sans-serif" font-size="80" font-weight="300" fill="#FFFFFF" text-anchor="middle" letter-spacing="20">OWNEX</text>

  <!-- Subtitle - Autonomous Work Operating System -->
  <text x="800" y="480" font-family="Arial, sans-serif" font-size="24" font-weight="300" fill="#2D7FF9" text-anchor="middle" letter-spacing="8">Autonomous Work Operating System</text>

  <!-- Technical subtitle - minimal -->
  <text x="800" y="530" font-family="Arial, sans-serif" font-size="14" font-weight="300" fill="#666666" text-anchor="middle" letter-spacing="4">Precision • Automation • Intelligence</text>

  <!-- Minimal metrics - subtle -->
  <g transform="translate(800, 580)">
    <text x="-200" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2D7FF9" text-anchor="middle" letter-spacing="2">ALPHA</text>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#D4AF37" text-anchor="middle" letter-spacing="2">OMEGA</text>
    <text x="200" y="0" font-family="Arial, sans-serif" font-size="12" fill="#2D7FF9" text-anchor="middle" letter-spacing="2">v7.0.0</text>
  </g>

  <!-- Subtle glow - very minimal -->
  <ellipse cx="800" cy="350" rx="300" ry="100" fill="url(#grad1)" opacity="0.05"/>
</svg>