<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="800" fill="#08090A"/>

  <!-- Phone frame -->
  <rect x="25" y="25" width="350" height="750" rx="40" fill="#111113" stroke="#1F2023" stroke-width="2"/>

  <!-- Phone notch -->
  <rect x="150" y="35" width="100" height="25" rx="12" fill="#08090A"/>

  <!-- Status bar -->
  <text x="60" y="55" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="12" fill="#F6F8FB">9:41</text>
  <circle cx="330" cy="50" r="4" fill="#00E39A"/>
  <circle cx="345" cy="50" r="4" fill="#8B8D98"/>

  <!-- App header -->
  <text x="200" y="100" text-anchor="middle" font-family="'Inter Display', system-ui, sans-serif" font-weight="700" font-size="24" fill="#F6F8FB">OWNEX</text>
  <text x="200" y="125" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="12" fill="#8B8D98">OMEGA</text>

  <!-- Quick status cards -->
  <rect x="50" y="150" width="300" height="80" rx="8" fill="#1F2023" stroke="#5E6AD2" stroke-width="1"/>
  <text x="70" y="175" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="12" fill="#8B8D98">System Status</text>
  <text x="70" y="200" font-family="'Inter Display', system-ui, sans-serif" font-weight="700" font-size="20" fill="#00E39A">Online</text>
  <text x="300" y="200" text-anchor="end" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="12" fill="#8B8D98">12 agents</text>

  <rect x="50" y="240" width="300" height="80" rx="8" fill="#1F2023" stroke="#1F2023" stroke-width="1"/>
  <text x="70" y="265" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="12" fill="#8B8D98">Pending Approvals</text>
  <text x="70" y="290" font-family="'Inter Display', system-ui, sans-serif" font-weight="700" font-size="20" fill="#5E6AD2">3</text>
  <text x="300" y="290" text-anchor="end" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="12" fill="#8B8D98">Action needed</text>

  <!-- MERLIN chat preview -->
  <text x="50" y="360" font-family="'Inter Display', system-ui, sans-serif" font-weight="600" font-size="16" fill="#F6F8FB">MERLIN</text>

  <rect x="50" y="380" width="300" height="60" rx="8" fill="#1F2023" stroke="#1F2023" stroke-width="1"/>
  <text x="70" y="405" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="12" fill="#8B8D98">System</text>
  <text x="70" y="425" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#F6F8FB">Daily summary ready for review</text>

  <rect x="50" y="450" width="300" height="60" rx="8" fill="#00E39A" fill-opacity="0.1" stroke="#00E39A" stroke-width="1"/>
  <text x="70" y="475" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="12" fill="#00E39A">MERLIN</text>
  <text x="70" y="495" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13" fill="#F6F8FB">2 new insights from today's work</text>

  <!-- Bottom navigation -->
  <rect x="25" y="700" width="350" height="75" rx="0" fill="#1F2023" stroke="#1F2023" stroke-width="1"/>

  <circle cx="100" cy="737" r="6" fill="#5E6AD2"/>
  <text x="100" y="760" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="10" fill="#F6F8FB">Home</text>

  <circle cx="200" cy="737" r="6" fill="#8B8D98"/>
  <text x="200" y="760" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="10" fill="#8B8D98">Agents</text>

  <circle cx="300" cy="737" r="6" fill="#8B8D98"/>
  <text x="300" y="760" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="10" fill="#8B8D98">Settings</text>
</svg>