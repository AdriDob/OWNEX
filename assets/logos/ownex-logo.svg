<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e82127"/>
      <stop offset="100%" stop-color="#ff4d4d"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#222" stroke-width="1.5"/>
  
  <!-- Inner geometric mark - hexagon with cross -->
  <polygon points="60,25 88,42.5 88,77.5 60,95 32,77.5 32,42.5" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Horizontal line -->
  <line x1="32" y1="60" x2="88" y2="60" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center dot - accent -->
  <circle cx="60" cy="60" r="5" fill="url(#accent)"/>
  
  <!-- Small accent lines -->
  <line x1="60" y1="25" x2="60" y2="32" stroke="#e82127" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="88" x2="60" y2="95" stroke="#e82127" stroke-width="2" stroke-linecap="round"/>
</svg>
