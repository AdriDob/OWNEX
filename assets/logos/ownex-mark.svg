<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- OWNEX mark: O + X. Tesla style — black field, white geometry, red core. -->
  <rect width="512" height="512" fill="#000000"/>
  <!-- X: two crossed bars -->
  <rect x="96" y="96" width="44" height="320" rx="4" fill="#F5F5F5"/>
  <rect x="372" y="96" width="44" height="320" rx="4" fill="#F5F5F5"/>
  <rect x="96" y="234" width="320" height="44" rx="4" fill="#F5F5F5"/>
  <!-- O: outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#F5F5F5" stroke-width="24"/>
  <!-- O center: red core dot (the only saturated accent) -->
  <circle cx="256" cy="256" r="34" fill="#E82127"/>
</svg>
