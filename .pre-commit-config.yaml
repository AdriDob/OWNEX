repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest --timeout=60 -q --ignore=tests/test_security.py --ignore=tests/test_vision_gateway.py --ignore=tests/test_scheduler.py --deselect tests/test_desktop_release.py::TestHardwareIDConsistency::test_hwid_prefix_validation_pass --deselect tests/test_desktop_release.py::TestHardwareIDConsistency::test_hwid_consistent_across_license_lifecycle
        language: system
        types: [python]
        pass_filenames: false
