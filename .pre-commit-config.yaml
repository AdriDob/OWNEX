repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      # Commit gate = deterministic fast smoke (scoring + opportunity + scheduler
      # + security cycle), same contract as `make test-fast`. The full suite
      # (`make test`) is NOT the hook gate because the concurrent core/→cores/
      # flow keeps ~25 suites in contract drift (KNOWN_DEBT #14); excluding
      # file-by-file would also mask regressions in our own files.
      - id: pytest
        name: pytest (fast smoke)
        entry: .venv/bin/python -m pytest --timeout=60 -q tests/test_scoring.py tests/test_opportunity_engine.py tests/test_opportunity_engine_comprehensive.py tests/test_scheduler_jobs.py tests/test_e2e_security_pipeline.py tests/test_security_cycle.py
        language: system
        types: [python]
        pass_filenames: false

      # Frontend gate. Existe porque `vue-tsc` NO alcanza (medido 2026-10-05:
      # un `v-else` sin su `v-if`, un `})` huérfano y un import sin instalar
      # dieron 0 errores de tipos y pasaron los 202 tests; sólo `vite build`
      # los cazó). CI ya corre el build (ci.yml) pero se salta con
      # --no-verify, que es exactamente como entraron esos tres.
      - id: frontend-build
        name: frontend (vue-tsc + vite build)
        entry: bash -c 'cd frontend && npx vue-tsc --noEmit && npx vite build'
        language: system
        files: ^frontend/(src/.*\.(vue|ts)|package\.json|tsconfig.*\.json|vite\.config\.ts)$
        pass_filenames: false
