// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // FIX 2026-09-28 (P1 release blocker): app/build.gradle y wear/build.gradle
        // aplican 'kotlin-android'/'kotlin-kapt', pero el plugin Kotlin no estaba
        // en el buildscript raíz → "Plugin with id 'kotlin-android' not found" y el
        // build de Android no arrancaba en ninguna máquina.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'
        // Kotlin 2.x exige el plugin de Compose Compiler cuando compose=true
        // (app/build.gradle). Sin esto el build moría con "the Compose Compiler
        // Gradle plugin is required when compose is enabled".
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
