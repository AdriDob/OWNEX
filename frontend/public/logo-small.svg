<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="txtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#F5A623" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Mark (left side) -->
  <g transform="translate(10, 0)">
    <!-- Orbital rings -->
    <circle cx="80" cy="100" r="75" fill="url(#coreGlow)" opacity="0.3"/>
    <ellipse cx="80" cy="100" rx="90" ry="30" fill="none" stroke="#7C3AED" stroke-width="1"
             transform="rotate(-25 80 100)" opacity="0.4"/>
    <ellipse cx="80" cy="100" rx="70" ry="24" fill="none" stroke="#A855F7" stroke-width="1.5"
             transform="rotate(20 80 100)" opacity="0.6"/>
    <ellipse cx="80" cy="100" rx="50" ry="18" fill="none" stroke="#8B5CF6" stroke-width="2"
             transform="rotate(-10 80 100)" filter="url(#glow1)" opacity="0.8"/>

    <!-- Constellation dots -->
    <circle cx="25" cy="82" r="1.5" fill="#00FF41" opacity="0.7"/>
    <circle cx="135" cy="118" r="1.5" fill="#00FF41" opacity="0.5"/>
    <circle cx="50" cy="115" r="1" fill="#F5A623" opacity="0.6"/>
    <circle cx="110" cy="85" r="1" fill="#F5A623" opacity="0.4"/>

    <!-- Gold accent -->
    <path d="M 80 100 L 140 60 A 85 85 0 0 1 155 95 Z" fill="#F5A623" opacity="0.08"/>

    <!-- Core -->
    <circle cx="80" cy="100" r="10" fill="#A855F7" filter="url(#glow1)"/>
    <circle cx="80" cy="100" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- OWNEX text -->
  <text x="170" y="115" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="64"
        font-weight="900" letter-spacing="6" fill="url(#txtGrad)">
    OWNEX
  </text>

  <!-- Tagline -->
  <text x="178" y="155" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13"
        font-weight="400" letter-spacing="8" fill="url(#subGrad)">
    AUTONOMOUS WORK OS
  </text>

  <!-- Small decorative line -->
  <line x1="178" y1="137" x2="340" y2="137" stroke="#F5A623" stroke-width="0.5" opacity="0.3"/>
</svg>
