<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="txtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="coreGlowBig" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#6D28D9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background glow -->
  <circle cx="200" cy="130" r="180" fill="url(#coreGlowBig)"/>

  <!-- Orbital rings -->
  <ellipse cx="200" cy="130" rx="160" ry="55" fill="none" stroke="#7C3AED" stroke-width="1.2"
           transform="rotate(-30 200 130)" opacity="0.4"/>
  <ellipse cx="200" cy="130" rx="130" ry="44" fill="none" stroke="#8B5CF6" stroke-width="1.8"
           transform="rotate(22 200 130)" opacity="0.6"/>
  <ellipse cx="200" cy="130" rx="95" ry="35" fill="none" stroke="#A855F7" stroke-width="2.5"
           transform="rotate(-12 200 130)" filter="url(#glow1)" opacity="0.85"/>

  <!-- Gold radar arc -->
  <path d="M 200 130 L 310 80 A 120 120 0 0 1 330 140 Z" fill="#F5A623" opacity="0.08"/>
  <path d="M 200 130 A 95 95 0 0 1 270 60" fill="none" stroke="#F5A623" stroke-width="1.5"
        opacity="0.4" stroke-dasharray="3 5" filter="url(#glow1)"/>

  <!-- Constellation dots -->
  <circle cx="75" cy="105" r="2" fill="#00FF41" opacity="0.6"/>
  <circle cx="325" cy="155" r="2" fill="#00FF41" opacity="0.4"/>
  <circle cx="110" cy="160" r="1.5" fill="#F5A623" opacity="0.5"/>
  <circle cx="290" cy="100" r="1.5" fill="#F5A623" opacity="0.3"/>
  <circle cx="60" cy="170" r="1" fill="#A855F7" opacity="0.25"/>
  <circle cx="340" cy="120" r="1" fill="#A855F7" opacity="0.25"/>

  <!-- Tiny constellation lines -->
  <line x1="75" y1="105" x2="110" y2="160" stroke="#A855F7" stroke-width="0.5" opacity="0.12"/>
  <line x1="325" y1="155" x2="290" y2="100" stroke="#A855F7" stroke-width="0.5" opacity="0.12"/>

  <!-- Core -->
  <circle cx="200" cy="130" r="16" fill="#7C3AED" filter="url(#glow2)"/>
  <circle cx="200" cy="130" r="8" fill="#A855F7"/>
  <circle cx="200" cy="130" r="3" fill="#FFFFFF" opacity="0.9"/>

  <!-- OWNEX text below mark -->
  <text x="200" y="260" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="48"
        font-weight="900" letter-spacing="8" fill="url(#txtGrad)" text-anchor="middle">
    OWNEX
  </text>

  <!-- Tagline -->
  <text x="200" y="300" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11"
        font-weight="400" letter-spacing="6" fill="#8B5CF6" opacity="0.6" text-anchor="middle">
    AUTONOMOUS WORK OS
  </text>

  <!-- Version -->
  <text x="200" y="325" font-family="'JetBrains Mono', monospace" font-size="10"
        fill="#F5A623" opacity="0.4" text-anchor="middle">
    v5.1.0
  </text>

  <!-- Small divider -->
  <line x1="170" y1="278" x2="230" y2="278" stroke="#F5A623" stroke-width="0.5" opacity="0.2"/>
</svg>
