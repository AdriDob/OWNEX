<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0070d1;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0070d1;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="250" fill="url(#secBg)" rx="16"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="560" height="35" fill="#0d1117" rx="8" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
  <circle cx="40" cy="37" r="10" fill="#00ff88"/>
  <text x="58" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">SECURITY CYCLE — Bug Bounty Pipeline</text>
  
  <!-- Pipeline Steps -->
  <!-- Step 1: Recon -->
  <rect x="25" y="70" width="85" height="60" fill="url(#stepGradient)" stroke="#0070d1" stroke-width="2" rx="8"/>
  <text x="67" y="90" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">RECON</text>
  <text x="67" y="105" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">Discovery</text>
  <text x="67" y="118" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">Attack Surface</text>
  
  <!-- Arrow 1 -->
  <path d="M110 100 L130 100" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2: Hypothesis -->
  <rect x="135" y="70" width="85" height="60" fill="url(#stepGradient)" stroke="#0070d1" stroke-width="2" rx="8"/>
  <text x="177" y="90" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">HYPOTHESIS</text>
  <text x="177" y="105" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">Analysis</text>
  <text x="177" y="118" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">Vulnerability Theory</text>
  
  <!-- Arrow 2 -->
  <path d="M220 100 L240 100" stroke="#00ff88" stroke-width="2"/>
  
  <!-- Step 3: Validation -->
  <rect x="245" y="70" width="85" height="60" fill="url(#stepGradient)" stroke="#0070d1" stroke-width="2" rx="8"/>
  <text x="287" y="90" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">VALIDATION</text>
  <text x="287" y="105" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">Testing</text>
  <text x="287" y="118" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">Proof of Concept</text>
  
  <!-- Arrow 3 -->
  <path d="M330 100 L350 100" stroke="#00ff88" stroke-width="2"/>
  
  <!-- Step 4: Evidence -->
  <rect x="355" y="70" width="85" height="60" fill="url(#stepGradient)" stroke="#0070d1" stroke-width="2" rx="8"/>
  <text x="397" y="90" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">EVIDENCE</text>
  <text x="397" y="105" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">Capture</text>
  <text x="397" y="118" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">Screenshots + Logs</text>
  
  <!-- Arrow 4 -->
  <path d="M440 100 L460 100" stroke="#00ff88" stroke-width="2"/>
  
  <!-- Step 5: Report -->
  <rect x="465" y="70" width="85" height="60" fill="url(#stepGradient)" stroke="#0070d1" stroke-width="2" rx="8"/>
  <text x="507" y="90" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">REPORT</text>
  <text x="507" y="105" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">Submission</text>
  <text x="507" y="118" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">Platform + Format</text>
  
  <!-- Arrow 5 (curved down) -->
  <path d="M507 130 Q507 160 467 160 L137 160 Q97 160 97 130" stroke="#ffd700" stroke-width="2" stroke-dasharray="4" fill="none"/>
  
  <!-- Step 6: Learning (in the loop) -->
  <rect x="245" y="145" width="85" height="50" fill="#ffd700" fill-opacity="0.2" stroke="#ffd700" stroke-width="2" rx="8"/>
  <text x="287" y="165" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">LEARNING</text>
  <text x="287" y="180" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">Knowledge Capture</text>
  <text x="287" y="190" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">AI Memory Update</text>
  
  <!-- Metrics Section -->
  <rect x="25" y="210" width="160" height="30" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="6"/>
  <text x="105" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#0070d1">🎯 127 Findings</text>
  
  <rect x="195" y="210" width="160" height="30" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="6"/>
  <text x="275" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#00ff88">✅ 89 Validated</text>
  
  <rect x="365" y="210" width="160" height="30" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="6"/>
  <text x="445" y="230" text-anchor="middle" font-family="Arial" font-size="10" fill="#ffd700">💰 $12,450 Payouts</text>
</svg>