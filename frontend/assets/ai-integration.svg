<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="providerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0070d1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0070d1;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="routerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="280" fill="url(#aiBg)" rx="16"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="560" height="35" fill="#0d1117" rx="8" stroke="#ffd700" stroke-width="1" opacity="0.5"/>
  <circle cx="40" cy="37" r="10" fill="#ffd700"/>
  <text x="58" y="42" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">AI INTEGRATION — ModelRouter Architecture</text>
  
  <!-- AI Providers (Top) -->
  <text x="300" y="75" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#888">AI PROVIDERS</text>
  
  <!-- Provider 1: Ollama Local -->
  <rect x="30" y="85" width="120" height="50" fill="url(#providerGradient)" stroke="#0070d1" stroke-width="2" rx="8"/>
  <text x="90" y="105" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">Ollama Local</text>
  <text x="90" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">qwen3-coder:8b</text>
  <text x="90" y="132" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">Always Available</text>
  
  <!-- Provider 2: FCC Proxy -->
  <rect x="165" y="85" width="120" height="50" fill="url(#providerGradient)" stroke="#00ff88" stroke-width="2" rx="8"/>
  <text x="225" y="105" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">FCC Proxy</text>
  <text x="225" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">Claude Sonnet 4.5</text>
  <text x="225" y="132" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">Multi-Provider</text>
  
  <!-- Provider 3: OpenCode Free -->
  <rect x="300" y="85" width="120" height="50" fill="url(#providerGradient)" stroke="#ffd700" stroke-width="2" rx="8"/>
  <text x="360" y="105" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">OpenCode Free</text>
  <text x="360" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">DeepSeek V4</text>
  <text x="360" y="132" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">Built-in Free</text>
  
  <!-- Provider 4: OmniRoute -->
  <rect x="435" y="85" width="120" height="50" fill="url(#providerGradient)" stroke="#0070d1" stroke-width="2" rx="8"/>
  <text x="495" y="105" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="white">OmniRoute</text>
  <text x="495" y="120" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">Best Models</text>
  <text x="495" y="132" text-anchor="middle" font-family="Arial" font-size="8" fill="#888">Gateway</text>
  
  <!-- Arrows to ModelRouter -->
  <path d="M90 135 L90 155 L280 155" stroke="#0070d1" stroke-width="1.5" fill="none"/>
  <path d="M225 135 L225 155 L300 155" stroke="#00ff88" stroke-width="1.5" fill="none"/>
  <path d="M360 135 L360 155 L320 155" stroke="#ffd700" stroke-width="1.5" fill="none"/>
  <path d="M495 135 L495 155 L340 155" stroke="#0070d1" stroke-width="1.5" fill="none"/>
  
  <!-- ModelRouter (Center) -->
  <rect x="150" y="165" width="300" height="60" fill="url(#routerGradient)" stroke="#ffd700" stroke-width="3" rx="12"/>
  <text x="300" y="185" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">MODEL ROUTER</text>
  <text x="300" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#ffd700">Autonomous Decision Engine</text>
  <text x="300" y="218" text-anchor="middle" font-family="Arial" font-size="9" fill="#888">Failover Chain • Tier Selection • Cost Optimization</text>
  
  <!-- Arrows to Applications -->
  <path d="M300 225 L300 245" stroke="#ffd700" stroke-width="2"/>
  
  <!-- Applications (Bottom) -->
  <rect x="40" y="250" width="100" height="25" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="4"/>
  <text x="90" y="267" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">CoderAgent</text>
  
  <rect x="150" y="250" width="100" height="25" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="4"/>
  <text x="200" y="267" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">Security Engine</text>
  
  <rect x="260" y="250" width="100" height="25" fill="#0d1117" stroke="#ffd700" stroke-width="1" rx="4"/>
  <text x="310" y="267" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd700">Self-Improvement</text>
  
  <rect x="370" y="250" width="100" height="25" fill="#0d1117" stroke="#0070d1" stroke-width="1" rx="4"/>
  <text x="420" y="267" text-anchor="middle" font-family="Arial" font-size="9" fill="#0070d1">Opportunity Engine</text>
  
  <rect x="480" y="250" width="80" height="25" fill="#0d1117" stroke="#00ff88" stroke-width="1" rx="4"/>
  <text x="520" y="267" text-anchor="middle" font-family="Arial" font-size="9" fill="#00ff88">COPILOT</text>
</svg>